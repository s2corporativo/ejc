# Nginx do container frontend: serve SPA + repassa /api ao backend
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/xml image/svg+xml application/manifest+json;

    # Headers básicos (o nginx do HOST aplica os de produção, incl. CSP/HSTS)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    # SPA fallback — HTML NUNCA fica em cache (sempre revalida p/ pegar o bundle novo).
    # Sem isto, o navegador reusa um index.html antigo que aponta p/ assets antigos.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Service worker nunca em cache (precisa atualizar p/ trocar o app)
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Assets com hash no nome → cache longo imutável (seguro: nome muda a cada build)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API → backend (rede docker; host.docker.internal não existe no Linux,
    # então o proxy real fica no Nginx do HOST — este bloco é fallback dev)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60M;
        proxy_read_timeout 300s;
    }
}
