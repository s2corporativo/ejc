# Nginx do container frontend: serve SPA + repassa /api ao backend
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/xml image/svg+xml application/manifest+json;

    # Headers básicos (o nginx do HOST aplica os de produção, incl. HSTS)
    # Atenção: no Nginx, add_header dentro de location pode impedir a herança
    # dos headers definidos no nível do server. Por isso, os locations que
    # definem Cache-Control repetem os headers de segurança essenciais.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # CSP como defesa em profundidade (o app é SPA self-contained; sem CDNs externas).
    # style-src permite 'unsafe-inline' pois o Tailwind/React injetam estilos inline;
    # img-src data: cobre ícones/QR embutidos; connect-src 'self' cobre /api e SSE.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    server_tokens off;

    # Compatibilidade controlada: telas antigas ainda podem chamar /v1/*.
    # O backend real fica sob /api; redirecionar evita que a SPA devolva index.html
    # para uma chamada de API e exponha erro do tipo "Unexpected token <".
    location /v1/ {
        return 308 /api$request_uri;
    }

    # SPA fallback — HTML NUNCA fica em cache (sempre revalida p/ pegar o bundle novo).
    # Sem isto, o navegador reusa um index.html antigo que aponta p/ assets antigos.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Service worker nunca em cache (precisa atualizar p/ trocar o app)
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Assets com hash no nome → cache longo imutável (seguro: nome muda a cada build)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # API → backend (rede docker; host.docker.internal não existe no Linux,
    # então o proxy real fica no Nginx do HOST — este bloco é fallback dev)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60M;
        proxy_read_timeout 300s;
    }
}
