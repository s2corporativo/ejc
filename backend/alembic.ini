# ── Alembic — configuração EJC ────────────────────────────────────────────────
# A URL do banco NÃO é hardcodada aqui: o env.py a injeta a partir das settings
# (app.core.config → DATABASE_URL, asyncpg). Mantém o segredo fora do versionado.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url é definido em env.py (não remover esta nota)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
