title = "EJC Gitleaks configuration"

[extend]
useDefault = true

# O build do frontend minifica `moduleRegistry.tsx` em um bundle de nome hash.
# A chave semântica `dpt360-subroutes` é classificada pelo rule genérico como API key.
# A exceção exige simultaneamente a regra, o caminho gerado e o valor semântico;
# qualquer outro finding nesse bundle continua bloqueante.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "moduleRegistry: chave semântica dpt360-subroutes no bundle gerado"
  condition = "AND"
  paths = ['^frontend/dist/assets/moduleRegistry-[^/]+\.js$']
  stopwords = ["dpt360-subroutes"]
