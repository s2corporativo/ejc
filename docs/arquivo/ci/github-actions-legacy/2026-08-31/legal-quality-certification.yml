name: EJC Legal Quality Certification

# Certificação deliberadamente separada do CI técnico: não é correto inventar
# curadoria humana para manter PR verde. Este workflow é fail-closed e só fica
# verde quando o corpus humano real atingir o patamar mínimo institucional.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-real:
    name: Gold jurídico humano — 75 casos / 15 por área
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar proveniência humana e cobertura mínima
        run: |
          python -m app.eval.gold_governance \
            --require-real \
            --min-total 75 \
            --areas consumidor,trabalhista,civel,penal,tributario \
            --min-casos-area 15 \
            --cenarios normal,fronteira,excecao \
            --min-casos-cenario 5

      - name: Validar harness e presença das áreas críticas
        run: |
          python -m app.eval.run_eval \
            --smoke \
            --areas-obrigatorias consumidor,trabalhista,civel,penal,tributario \
            --min-casos-area 15
