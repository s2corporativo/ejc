x-logging: &ejc-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    # pgvector/pgvector:pg16 — Postgres 16 COM a extensão `vector` já instalada.
    # As migrations do RAG fazem `CREATE EXTENSION vector`; a imagem oficial
    # postgres:16-alpine NÃO traz o pgvector e o `alembic upgrade head` falharia.
    image: pgvector/pgvector:pg16
    # Nome fixo: scripts/backup.sh, post_deploy_check.sh e deploy_vps_safe.sh
    # fazem `docker exec ejc_db`/`ejc_backend`/`ejc_frontend` — sem isto o
    # Compose V2 nomeia com hífen (ejc-db-1) e os 3 scripts falham com
    # "No such container".
    container_name: ejc_db
    restart: unless-stopped
    logging: *ejc-logging
    # Teto de memória — ver a nota em `backend` abaixo. Folga generosa: um
    # Postgres morto por OOM é pior que um container lento.
    mem_limit: ${EJC_DB_MEM_LIMIT:-3g}
    # PostgreSQL/pgvector usa shared memory para operações paralelas. O default
    # Docker de 64 MiB ficou pequeno para HNSW/consultas vetoriais; 256 MiB é
    # conservador dentro do teto de 3 GiB e pode ser ajustado por ambiente.
    shm_size: "${EJC_DB_SHM_SIZE:-256m}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # Broker/result backend do Celery (Fase 3A — fila assíncrona de indexação).
    image: redis:7-alpine
    container_name: ejc_redis
    restart: unless-stopped
    logging: *ejc-logging
    # Teto de memória — ver a nota em `backend` abaixo.
    mem_limit: ${EJC_REDIS_MEM_LIMIT:-512m}
    # AOF ligado: tasks enfileiradas sobrevivem a restart do container.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ejc_backend
    restart: unless-stopped
    logging: *ejc-logging
    # Teto DURO de memória. Esta VPS não é dedicada ao EJC: hospeda também
    # Verde Limp, sistema-s2, Evolution API (WhatsApp) e o Woodpecker. Até
    # 2026-08-27 nenhum container do EJC declarava limite — só o `ollama` —
    # enquanto os containers dos outros sistemas já tinham teto. Naquele dia a
    # reindexação do RAG cresceu até 10 GB dentro deste container e disparou o
    # OOM-killer GLOBAL, que reiniciou o `verdelimp-erp`: um trabalho do EJC
    # derrubou o sistema de OUTRA empresa. Com o teto, o estouro fica contido
    # neste container e os vizinhos seguem no ar.
    # Ver docs/auditoria/relatorios/2026-08-27-verificacao-e-novos-achados.md §9.
    mem_limit: ${EJC_BACKEND_MEM_LIMIT:-6g}
    ports:
      # Publica só no loopback do host; o Nginx do host faz proxy_pass para 127.0.0.1:8000.
      - "127.0.0.1:8000:8000"
    networks: [default, ia]
    env_file:
      - .env
    environment:
      APP_ENV: production
      # SHA do commit publicado — exposto em /api/health como prova de qual
      # código está no ar (deploy_vps_safe.sh exporta e confere depois).
      GIT_SHA: ${GIT_SHA:-}
      # Runtime pode usar papel de menor privilégio sem alterar o papel bootstrap
      # do container PostgreSQL. Fallback preserva instalações existentes.
      DATABASE_URL: "${APP_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}"
      DATABASE_URL_SYNC: "${APP_DATABASE_URL_SYNC:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}"
      # MIGRATION_DATABASE_URL é deliberadamente AUSENTE do runtime. Quando
      # existir um papel ejc_migrator, a esteira fornece a variável apenas ao
      # container one-shot que executa Alembic; nunca pelo env_file do backend.
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      # O entrypoint aplica `alembic upgrade head` no boot SOMENTE quando
      # RUN_MIGRATIONS=1 (ver backend/entrypoint.sh). Fail-closed: o padrão é 0,
      # inclusive em `docker compose up` manual; migrations só rodam por opt-in
      # explícito da esteira de deploy, após backup e revisão.
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-0}"
      # 2FA é recurso opcional por decisão do titular (#1580). O default não
      # exige nenhum papel e não reativa TOTP por acidente em recreate/deploy.
      TWO_FACTOR_AUTH_ENABLED: "${TWO_FACTOR_AUTH_ENABLED:-false}"
      REQUIRE_2FA_ROLES: "${REQUIRE_2FA_ROLES:-}"
      # Fila assíncrona (Fase 3A): worker existe no compose → Celery ligado.
      # Redis fora do ar não quebra nada: o dispatcher cai para BackgroundTasks.
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      # Rate limit distribuído: com o Redis já disponível aqui, contar no Redis
      # torna seguro subir uvicorn com >1 worker (o contador em memória só vale
      # para 1 processo). Redis fora do ar → fallback para o contador local.
      # LIMITE (item 11 — auditoria): esta flag cobre SÓ a dependency
      # consumir()/rate_limit() (core/rate_limit.py). O anti-brute-force do
      # login (security_service.py) e o slowapi @limiter.limit continuam POR
      # PROCESSO — não escalar uvicorn com --workers sem migrá-los para Redis.
      RATE_LIMIT_REDIS_ENABLED: "true"
      # IA: este stack NÃO sobe um serviço `ollama` (OLLAMA_BASE_URL default
      # aponta para http://ollama:11434, inexistente aqui). Mantê-lo "enabled"
      # fazia TODA tarefa tentar um provider local morto antes do Anthropic e,
      # sem Anthropic elegível, a importação de documentos falhava com
      # "habilite o Ollama". Decisão de produto: IA externa com mascaramento/
      # pseudonimização de PII (CPF/CNPJ → [CPF]/[CNPJ]). Para usar IA local,
      # suba um serviço `ollama` e volte para "true".
      OLLAMA_ENABLED: "false"
      # Anthropic primeiro (melhor qualidade jurídica); Maritaca (Sabiá,
      # legal-tuned PT-BR) como 2º externo; Groq depois.
      # Requer ANTHROPIC_API_KEY no .env do VPS (segredo — nunca versionado).
      AI_PROVIDER_PRIORITY: "anthropic,maritaca,groq,ollama"
      # Maritaca: default alinhado ao código (config.py) e ao .env.example —
      # DESLIGADA até decisão explícita no .env (MARITACA_ENABLED=true). Antes o
      # compose ligava por padrão e divergia das outras duas fontes (análise
      # E2E 03/09/2026, A2); com chave presente, dado jurídico pseudonimizado
      # saía para um destino não soberano sem ninguém ter habilitado.
      MARITACA_ENABLED: "${MARITACA_ENABLED:-false}"
      # Perfil de IA (opcional): externo | local | hibrido | desligado — deriva
      # os *_ENABLED e a prioridade; vazio = flags manuais (config.py).
      AI_PROFILE: "${AI_PROFILE:-}"
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
      # FastEmbed usa /tmp/fastembed_cache por default; volume evita baixar
      # novamente o modelo 1024d após recreate/deploy.
      - fastembed_cache:/tmp/fastembed_cache
      # Backup offsite via rclone (PR #480): o upload roda DENTRO do container,
      # então a config do rclone (token OAuth) do host é montada aqui.
      # GRAVÁVEL de propósito: o OneDrive renova o access token (~1h) e o
      # rclone PRECISA persistir o token renovado no rclone.conf — mount :ro
      # quebraria o backup diário após a primeira renovação (review PR #484).
      # Configure o remote no HOST (`rclone config`); o container mantém o
      # token fresco para ambos.
      - ${RCLONE_CONFIG_DIR:-/root/.config/rclone}:/root/.config/rclone
    depends_on:
      db:
        condition: service_healthy
      # service_started (não healthy) de propósito: a API NUNCA deve ficar
      # refém do Redis — sem ele, o dispatcher usa BackgroundTasks.
      redis:
        condition: service_started
    # OBRIGATÓRIO: o frontend usa depends_on: backend: service_healthy —
    # sem este healthcheck o compose falha com "has no healthcheck
    # configured" e o frontend NUNCA sobe (regressão da reescrita que
    # adicionou o Redis; originalmente adicionado no PR #29).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "10", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # start_period: janela de graça do BOOT. Sem ela, as 5 tentativas correm
      # desde o segundo zero e um startup lento (banco frio, carga de feriados,
      # overlay do cofre) marca o container `unhealthy` antes de ele terminar
      # de subir — e o `frontend`, que declara `depends_on: backend:
      # service_healthy`, NUNCA sobe num `up` limpo. Falha marcada aqui dentro
      # não conta para o `retries`.
      start_period: 60s

  worker:
    # Worker Celery — mesma imagem do backend (mesmo código/dependências).
    build:
      context: ./backend
    container_name: ejc_worker
    restart: unless-stopped
    logging: *ejc-logging
    # Teto de memória — ver a nota em `backend`. O worker roda o MESMO código
    # (indexação incluída), então precisa do mesmo tipo de contenção.
    mem_limit: ${EJC_WORKER_MEM_LIMIT:-2g}
    networks: [default, ia]
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    env_file:
      - .env
    environment:
      APP_ENV: production
      # SHA do commit publicado — exposto em /api/health como prova de qual
      # código está no ar (deploy_vps_safe.sh exporta e confere depois).
      GIT_SHA: ${GIT_SHA:-}
      DATABASE_URL: "${APP_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}"
      DATABASE_URL_SYNC: "${APP_DATABASE_URL_SYNC:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}"
      UPLOAD_DIR: /app/uploads
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      # Scheduler APScheduler só no processo da API — nunca no worker.
      ENABLE_SCHEDULER: "false"
      # Mesma política de IA da API (o worker também roda tarefas de IA na fila):
      # sem Ollama local neste stack; IA externa com mascaramento de PII.
      OLLAMA_ENABLED: "false"
      AI_PROVIDER_PRIORITY: "anthropic,maritaca,groq,ollama"
      # Mesmo default da API: Maritaca desligada até decisão explícita no .env.
      MARITACA_ENABLED: "${MARITACA_ENABLED:-false}"
      AI_PROFILE: "${AI_PROFILE:-}"
    volumes:
      - uploads_data:/app/uploads
      - fastembed_cache:/tmp/fastembed_cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Worker Celery não expõe HTTP — o health correto é perguntar ao próprio
      # Celery se há worker respondendo. `inspect ping` retorna != 0 quando
      # nenhum worker responde no broker. start_period cobre o tempo de boot
      # (conexão ao Redis + registro das filas) sem marcar unhealthy cedo demais.
      test: ["CMD", "celery", "-A", "app.core.celery_app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        # Flag do menu de 9 módulos (Onda 1) — default ATIVO no código.
        # Rollback global: VITE_EJC_MENU_9=false no .env do host + rebuild.
        VITE_EJC_MENU_9: ${VITE_EJC_MENU_9:-}
        # Abas Tarefas/Intimações no workspace do caso (Onda 4) — mesmo
        # caminho até o Vite; rollback global idêntico.
        VITE_EJC_W4_TABS: ${VITE_EJC_W4_TABS:-}
    container_name: ejc_frontend
    restart: unless-stopped
    logging: *ejc-logging
    # Teto de memória — ver a nota em `backend`. Nginx servindo estáticos.
    mem_limit: ${EJC_FRONTEND_MEM_LIMIT:-256m}
    ports:
      # Publica SÓ no loopback do host, atrás do Nginx do host (nginx/ejc.conf
      # faz o TLS/HSTS/CSP e o proxy_pass para 127.0.0.1:8080). Expor 0.0.0.0:80
      # cru pulava o Nginx (sem TLS) e batia com toda a tooling, que checa
      # 127.0.0.1:8080 (post_deploy_check.sh, monitor_health.sh, vps_setup.sh) —
      # a divergência fazia o deploy da main dar ROLLBACK numa stack saudável e
      # o monitor reiniciar o frontend a cada run.
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  # ── Fase 6 — Observabilidade de IA (Langfuse SELF-HOSTED) ──────────────────
  # OPT-IN via profile "observability": o compose padrão (up -d) NÃO sobe estes
  # serviços. Para ligar:
  #   docker compose --profile observability up -d langfuse-db langfuse
  # Depois acesse http://SEU_HOST:3000, crie a conta/projeto e gere as chaves
  # (public/secret) → cole em LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY no .env e
  # ligue LANGFUSE_ENABLED=true. Langfuse v2 usa Postgres PRÓPRIO (isolado do
  # banco jurídico) — nenhum dado do EJC é copiado para cá; só metadados de
  # tracing enviados pelo backend.
  langfuse-db:
    image: postgres:16-alpine
    container_name: ejc_langfuse_db
    profiles: ["observability"]
    restart: unless-stopped
    logging: *ejc-logging
    # Teto de memória — ver a nota em `backend`. Opt-in por profile, mas
    # nenhum container do EJC fica sem teto nesta VPS compartilhada.
    mem_limit: ${LANGFUSE_DB_MEM_LIMIT:-1g}
    environment:
      POSTGRES_USER: langfuse
      # Fail-closed em RUNTIME: sem senha no .env o postgres se recusa a subir
      # (sem fallback fraco). NÃO usar ${VAR:?} aqui: o compose interpola
      # variáveis mesmo com o profile DESLIGADO e quebraria todo build/up
      # de quem não usa observabilidade (regressão vista no deploy do VPS).
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: ejc_langfuse
    profiles: ["observability"]
    restart: unless-stopped
    logging: *ejc-logging
    # Teto de memória — ver a nota em `backend`.
    mem_limit: ${LANGFUSE_MEM_LIMIT:-1g}
    depends_on:
      langfuse-db:
        condition: service_healthy
    # Painel exposto SÓ no loopback do host — nunca em 0.0.0.0. Acesso remoto
    # deve passar por túnel SSH/reverse-proxy autenticado, não pela porta crua.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Fail-closed em RUNTIME (langfuse aborta sem estes valores); ver nota
      # acima sobre por que NÃO usar ${VAR:?} em serviços com profile.
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-}@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      SALT: ${LANGFUSE_SALT:-}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      TELEMETRY_ENABLED: "false"
      # Self-hosted fechado: sem signup público após criar o 1º usuário admin.
      LANGFUSE_DEFAULT_PROJECT_ROLE: MEMBER

  # ── IA local (Ollama) — análise com custo zero por token ───────────────────
  # OPT-IN via profile "ia-local": o `up -d` padrão NÃO sobe estes serviços.
  # Para ligar (ou use scripts/subir-ia-local.sh, que acompanha o download):
  #   docker compose --profile ia-local up -d
  # O backend já aponta para http://ollama:11434 (OLLAMA_BASE_URL) e a cadeia
  # de fallback do ai_gateway cai para Anthropic/Groq se o Ollama estiver
  # ausente/lento — ligar ou desligar este profile NUNCA quebra a aplicação.
  #
  # RAM por modelo (CPU, sem GPU — some ~1-2GB de overhead do runtime):
  #   llama3.2:3b / qwen2.5:3b  ≈ 3-4 GB   → VPS modesta (8 GB total)
  #   deepseek-r1:8b / gemma3:9b ≈ 6-7 GB  → servidor 16 GB+
  #   qwen2.5:14b               ≈ 10-11 GB → servidor 16 GB+ (apertado c/ 16)
  # Ajuste OLLAMA_MEM_LIMIT e os OLLAMA_MODEL_*/OLLAMA_PULL_MODELS no .env
  # (perfis prontos comentados no .env.example).
  ollama:
    # Tag pinada (não usar :latest): 0.31.1 estável em 2026-06-30.
    image: ollama/ollama:0.31.1
    container_name: ejc_ollama
    profiles: ["ia-local"]
    restart: unless-stopped
    logging: *ejc-logging
    # Rede dedicada: só backend/worker alcançam a API sem auth do Ollama —
    # frontend/langfuse ficam fora (menor superfície em caso de comprometimento).
    networks: [ia]
    # Porta NÃO publicada no host de propósito: só a rede interna do compose
    # alcança o Ollama (backend/worker via http://ollama:11434). Não exponha —
    # a API do Ollama não tem autenticação.
    environment:
      # 1 modelo carregado por vez e sem paralelismo: teto de RAM previsível
      # numa VPS sem GPU. Troca de modelo = descarrega/carrega (segundos).
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Descarrega o modelo da RAM após ociosidade (recarrega sob demanda).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    # Teto duro de memória do container (mem_limit = compose standalone, como
    # usamos aqui). Estouro → OOM-kill do container, NUNCA da VPS inteira;
    # o backend segue no ar e cai para Anthropic/Groq.
    mem_limit: ${OLLAMA_MEM_LIMIT:-12g}
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      # A imagem não traz curl/wget; o próprio CLI consulta o servidor local.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-init:
    # One-shot: baixa os modelos listados em OLLAMA_PULL_MODELS (CSV no .env;
    # default = modelos padrão do backend/app/core/config.py). Idempotente:
    # pull de modelo já baixado só confere o digest e retorna em segundos.
    # Roda e SAI (restart "no") — `docker compose --profile ia-local up -d`
    # já o executa; acompanhe com `docker logs -f ejc_ollama_init`.
    image: ollama/ollama:0.31.1
    container_name: ejc_ollama_init
    profiles: ["ia-local"]
    restart: "no"
    logging: *ejc-logging
    networks: [ia]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # CLI dentro deste container fala com o serviço ollama, não com localhost.
      OLLAMA_HOST: http://ollama:11434
      # Fonte única: mantenha em sincronia com os OLLAMA_MODEL_* do .env
      # (config.py: ANALISE/CONTRATO=deepseek-r1:8b, PETICAO=qwen2.5:14b,
      # RESUMO/CHAT=gemma3:9b).
      OLLAMA_PULL_MODELS: ${OLLAMA_PULL_MODELS:-deepseek-r1:8b,qwen2.5:14b,gemma3:9b}
    entrypoint: ["/bin/sh", "-c"]
    # $$ = escape do compose: variável avaliada pelo shell DO CONTAINER.
    command:
      - |
        set -eu
        set -f  # sem glob: item com * no CSV não expande contra o cwd
        falhas=0
        IFS=','
        for m in $$OLLAMA_PULL_MODELS; do
          m="$$(echo "$$m" | tr -d '[:space:]')"
          [ -n "$$m" ] || continue
          echo "==> ollama pull $$m"
          if ! ollama pull -- "$$m"; then
            echo "[ERRO] pull de $$m falhou (segue para o próximo)" >&2
            falhas=$$((falhas+1))
          fi
        done
        echo "==> modelos instalados:"
        ollama list
        exit "$$falhas"

networks:
  default:
  # Rede interna da IA local: backend/worker <-> ollama. Nenhuma porta no host.
  ia:

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  fastembed_cache:
  redis_data:
  langfuse_db_data:
  ollama_models:
