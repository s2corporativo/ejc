services:
  db:
    # pgvector/pgvector:pg16 — Postgres 16 COM a extensão `vector` já instalada.
    # As migrations do RAG fazem `CREATE EXTENSION vector`; a imagem oficial
    # postgres:16-alpine NÃO traz o pgvector e o `alembic upgrade head` falharia.
    image: pgvector/pgvector:pg16
    # Nome fixo: scripts/backup.sh, post_deploy_check.sh e deploy_vps_safe.sh
    # fazem `docker exec ejc_db`/`ejc_backend`/`ejc_frontend` — sem isto o
    # Compose V2 nomeia com hífen (ejc-db-1) e os 3 scripts falham com
    # "No such container".
    container_name: ejc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # Broker/result backend do Celery (Fase 3A — fila assíncrona de indexação).
    image: redis:7-alpine
    container_name: ejc_redis
    restart: unless-stopped
    # AOF ligado: tasks enfileiradas sobrevivem a restart do container.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ejc_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      # Fila assíncrona (Fase 3A): worker existe no compose → Celery ligado.
      # Redis fora do ar não quebra nada: o dispatcher cai para BackgroundTasks.
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
      # service_started (não healthy) de propósito: a API NUNCA deve ficar
      # refém do Redis — sem ele, o dispatcher usa BackgroundTasks.
      redis:
        condition: service_started

  worker:
    # Worker Celery — mesma imagem do backend (mesmo código/dependências).
    build:
      context: ./backend
    container_name: ejc_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /app/uploads
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      # Scheduler APScheduler só no processo da API — nunca no worker.
      ENABLE_SCHEDULER: "false"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # O único endpoint de health registrado é /api/health (main.py:358) —
      # "/health" (sem /api) sempre 404, e o container nunca ficava "healthy".
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: ejc_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  redis_data:
