services:
  db:
    # pgvector/pgvector:pg16 — Postgres 16 COM a extensão `vector` já instalada.
    # As migrations do RAG fazem `CREATE EXTENSION vector`; a imagem oficial
    # postgres:16-alpine NÃO traz o pgvector e o `alembic upgrade head` falharia.
    image: pgvector/pgvector:pg16
    # Nome fixo: scripts/backup.sh, post_deploy_check.sh e deploy_vps_safe.sh
    # fazem `docker exec ejc_db`/`ejc_backend`/`ejc_frontend` — sem isto o
    # Compose V2 nomeia com hífen (ejc-db-1) e os 3 scripts falham com
    # "No such container".
    container_name: ejc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # Broker/result backend do Celery (Fase 3A — fila assíncrona de indexação).
    image: redis:7-alpine
    container_name: ejc_redis
    restart: unless-stopped
    # AOF ligado: tasks enfileiradas sobrevivem a restart do container.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ejc_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      # Fila assíncrona (Fase 3A): worker existe no compose → Celery ligado.
      # Redis fora do ar não quebra nada: o dispatcher cai para BackgroundTasks.
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    depends_on:
      db:
        condition: service_healthy
      # service_started (não healthy) de propósito: a API NUNCA deve ficar
      # refém do Redis — sem ele, o dispatcher usa BackgroundTasks.
      redis:
        condition: service_started
    # OBRIGATÓRIO: o frontend usa depends_on: backend: service_healthy —
    # sem este healthcheck o compose falha com "has no healthcheck
    # configured" e o frontend NUNCA sobe (regressão da reescrita que
    # adicionou o Redis; originalmente adicionado no PR #29).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    # Worker Celery — mesma imagem do backend (mesmo código/dependências).
    build:
      context: ./backend
    container_name: ejc_worker
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /app/uploads
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      # Scheduler APScheduler só no processo da API — nunca no worker.
      ENABLE_SCHEDULER: "false"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # O único endpoint de health registrado é /api/health (main.py:358) —
      # "/health" (sem /api) sempre 404, e o container nunca ficava "healthy".
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: ejc_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  # ── Fase 6 — Observabilidade de IA (Langfuse SELF-HOSTED) ──────────────────
  # OPT-IN via profile "observability": o compose padrão (up -d) NÃO sobe estes
  # serviços. Para ligar:
  #   docker compose --profile observability up -d langfuse-db langfuse
  # Depois acesse http://SEU_HOST:3000, crie a conta/projeto e gere as chaves
  # (public/secret) → cole em LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY no .env e
  # ligue LANGFUSE_ENABLED=true. Langfuse v2 usa Postgres PRÓPRIO (isolado do
  # banco jurídico) — nenhum dado do EJC é copiado para cá; só metadados de
  # tracing enviados pelo backend.
  langfuse-db:
    image: postgres:16-alpine
    container_name: ejc_langfuse_db
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      # Fail-closed: sem senha definida no .env o serviço nem sobe (nada de
      # fallback fraco tipo "langfuse" — evita banco de tracing com senha padrão).
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?defina LANGFUSE_DB_PASSWORD no .env}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: ejc_langfuse
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    # Painel exposto SÓ no loopback do host — nunca em 0.0.0.0. Acesso remoto
    # deve passar por túnel SSH/reverse-proxy autenticado, não pela porta crua.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Fail-closed em todos os segredos: sem valor no .env o serviço não sobe.
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?defina LANGFUSE_DB_PASSWORD no .env}@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?defina LANGFUSE_NEXTAUTH_SECRET no .env}
      SALT: ${LANGFUSE_SALT:?defina LANGFUSE_SALT no .env}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      TELEMETRY_ENABLED: "false"
      # Self-hosted fechado: sem signup público após criar o 1º usuário admin.
      LANGFUSE_DEFAULT_PROJECT_ROLE: MEMBER

volumes:
  postgres_data:
  uploads_data:
  backups_data:
  redis_data:
  langfuse_db_data:
