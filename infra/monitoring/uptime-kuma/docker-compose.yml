x-logging: &kuma-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.2.0
    restart: unless-stopped
    logging: *kuma-logging
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  uptime-kuma-data:
