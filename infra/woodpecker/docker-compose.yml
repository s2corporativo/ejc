# Woodpecker CI — servidor + agente, self-hosted na VPS.
# Substituto do GitHub Actions (conta sem alocação de runner desde ~22/08/2026).
# Runbook completo: README.md ao lado. Variáveis: copie .env.example para .env.
services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.18.0
    restart: unless-stopped
    ports:
      # Só loopback: o Nginx do host faz o TLS e o proxy público.
      - "127.0.0.1:8100:8000"
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker/
    environment:
      - WOODPECKER_HOST=${WOODPECKER_HOST:?defina WOODPECKER_HOST no .env}
      - WOODPECKER_OPEN=false
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN:-s2corporativo}
      - WOODPECKER_REPO_OWNERS=s2corporativo
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT:?defina WOODPECKER_GITHUB_CLIENT no .env}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET:?defina WOODPECKER_GITHUB_SECRET no .env}
      # Funções distintas no v3: AGENT_SECRET autentica/registra agentes;
      # GRPC_SECRET assina JWTs das conexões gRPC. Use segredos independentes.
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:?defina WOODPECKER_AGENT_SECRET no .env}
      - WOODPECKER_GRPC_SECRET=${WOODPECKER_GRPC_SECRET:?defina WOODPECKER_GRPC_SECRET no .env}
      # PRs internos executam automaticamente; PRs vindos de forks continuam
      # exigindo aprovação humana. Usuários não podem registrar agentes próprios.
      - WOODPECKER_DEFAULT_APPROVAL_MODE=forks
      - WOODPECKER_DISABLE_USER_AGENT_REGISTRATION=true

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.18.0
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    volumes:
      - woodpecker-agent-config:/etc/woodpecker
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:?defina WOODPECKER_AGENT_SECRET no .env}
      - WOODPECKER_BACKEND=docker
      # 1 workflow por vez e limites por contêiner: a VPS também serve produção.
      - WOODPECKER_MAX_WORKFLOWS=1
      - WOODPECKER_BACKEND_DOCKER_LIMIT_MEM=${WOODPECKER_JOB_MEMORY_BYTES:-3221225472}
      - WOODPECKER_BACKEND_DOCKER_LIMIT_MEM_SWAP=${WOODPECKER_JOB_MEMORY_SWAP_BYTES:-3221225472}
      - WOODPECKER_BACKEND_DOCKER_LIMIT_CPU_QUOTA=${WOODPECKER_JOB_CPU_QUOTA:-100000}
      - WOODPECKER_BACKEND_DOCKER_LIMIT_CPU_SHARES=${WOODPECKER_JOB_CPU_SHARES:-512}

volumes:
  woodpecker-server-data:
  woodpecker-agent-config:
