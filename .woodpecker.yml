# CI oficial self-hosted (Woodpecker — infra/woodpecker/). Não depende de GitHub Actions.
# Replica os portões locais e adiciona SAST, vulnerabilidades e secret scanning.
when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ejc_user
      POSTGRES_PASSWORD: ejc_pass
      POSTGRES_DB: ejc_db

steps:
  backend:
    image: python:3.11-bookworm
    environment:
      DATABASE_URL: postgresql+asyncpg://ejc_user:ejc_pass@db:5432/ejc_db
      DATABASE_URL_SYNC: postgresql://ejc_user:ejc_pass@db:5432/ejc_db
      SCHEMA_CHECK_DATABASE_URL: postgresql://ejc_user:ejc_pass@db:5432/ejc_db
    commands:
      - apt-get update -qq
      - apt-get install -y -qq --no-install-recommends jq libmagic1 poppler-utils tesseract-ocr libpango-1.0-0 libpangocairo-1.0-0 libcairo2 postgresql-client
      - cd backend
      - pip install --quiet -r requirements.txt
      - ruff check app
      - python -m alembic heads
      - until pg_isready -h db -U ejc_user -q; do sleep 1; done
      - python -m alembic upgrade head
      - pytest tests -q

  frontend:
    image: node:22
    commands:
      - cd frontend
      - npm ci
      - npm run lint
      - npm test
      - npm run build

  security-sast:
    image: semgrep/semgrep
    commands:
      - semgrep scan --config=auto --error backend/app frontend/src

  security-vulnerabilities:
    image: aquasec/trivy:0.74.0
    commands:
      - trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  security-secrets:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    commands:
      - gitleaks git . --redact --verbose --exit-code 1
