# Override carregado automaticamente por `docker compose` (produção e dev).
# Monta ./secrets (credenciais OAuth de runtime, NUNCA versionadas — ver
# .gitignore `/secrets/`) em backend/worker, somente leitura. Sem `ports`
# aqui: o compose base já publica 127.0.0.1:8000 e repetir gerava lista
# duplicada (INF-15). Em máquina de desenvolvimento sem ./secrets o Docker
# cria o diretório vazio — inofensivo.
services:
  backend:
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
      - ./secrets:/app/secrets:ro

  worker:
    volumes:
      - uploads_data:/app/uploads
      - ./secrets:/app/secrets:ro
