# ── EJC — Nginx reverse proxy de PRODUÇÃO (host, fora do Docker) ──────────────
# Instalado por scripts/vps_setup.sh em /etc/nginx/sites-available/ejc.conf e
# habilitado via symlink em sites-enabled. Faz o TLS e encaminha para os
# containers publicados SOMENTE no loopback do host:
#   frontend  → 127.0.0.1:8080  (docker-compose: ports "127.0.0.1:8080:80")
#   backend   → 127.0.0.1:8000  (uvicorn; Dockerfile EXPOSE 8000 / entrypoint.sh)
#
# CONSOLIDAÇÃO 2026-07-27: até esta data existiam DOIS vhosts para o mesmo
# domínio — este arquivo e um `ejc` criado à mão na VPS. O Nginx honra o
# primeiro que carrega (ordem alfabética: `ejc` < `ejc.conf`) e IGNORA o outro
# em silêncio — no `nginx -t` isso aparecia como "conflicting server name
# ... ignored", quatro vezes. Ou seja: o arquivo versionado NUNCA esteve
# valendo, e as proteções abaixo (rate limit, CSP) viviam apenas na VPS, fora
# do controle de versão. Este arquivo passa a ser a fonte única, reunindo o que
# havia de melhor nos dois.
#
# AO APLICAR: remova o symlink /etc/nginx/sites-enabled/ejc (guarde o arquivo
# em sites-available como backup), valide com `nginx -t` e recarregue com
# `systemctl reload nginx`. Ver scripts/vps-nginx-auditoria.sh.
#
# O server_name e os caminhos de certificado abaixo já refletem o domínio real
# em produção (certbot --nginx -d ejc.depaulateixeira.adv.br). O deploy público
# checa https://ejc.depaulateixeira.adv.br/api/health.

# ── WebSocket/SSE: só envia "Connection: upgrade" quando há Upgrade ──────────
# Mandar o header fixo em toda requisição quebra o keep-alive das chamadas
# comuns. Precisa ficar no escopo http{} — sites-available é incluído lá.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Rate limiting (força bruta no login e abuso de IA) ───────────────────────
# auth: login/refresh/redefinição — 5 tentativas por minuto por IP.
# api:  uso geral autenticado.
# ai:   geração de peças e chamadas de IA (caras e lentas).
limit_req_zone $binary_remote_addr zone=ejc_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ejc_api:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=ejc_ai:10m   rate=10r/m;

# ── HTTP :80 — validação ACME + redirect permanente para HTTPS ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name ejc.depaulateixeira.adv.br;

    # Deixe o webroot do certbot passar em claro (renovação sem downtime).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — TLS + proxy para frontend/backend ───────────────────────────
server {
    # HTTP/2 na própria diretiva listen: compatível com nginx 1.18–1.24 E 1.25+.
    # (No 1.25.1+ existe a diretiva separada `http2 on;`, mas ela quebra o boot
    #  em nginx < 1.25.1 com "unknown directive http2" — esta forma vale nas duas.)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ejc.depaulateixeira.adv.br;

    ssl_certificate     /etc/letsencrypt/live/ejc.depaulateixeira.adv.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ejc.depaulateixeira.adv.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Upload de documentos jurídicos — alinhe com MAX_UPLOAD_MB do backend.
    client_max_body_size 60m;

    # ── Headers de segurança ─────────────────────────────────────────────────
    # HSTS de 1 ano SEM preload: o preload é praticamente irreversível (exige
    # pedido de remoção na lista dos navegadores) e não se justifica antes do
    # go-live definitivo. `always` para valerem também nas respostas de erro.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # ── IP real / anti-spoofing de X-Forwarded-For ───────────────────────────
    # O Nginx é o primeiro hop confiável: $remote_addr já é o IP do cliente.
    # Com CDN/balanceador na frente (ex.: Cloudflare), liste as faixas dele
    # para que o IP verdadeiro seja preservado nos logs e no rate limit.
    set_real_ip_from 127.0.0.1;
    #set_real_ip_from 173.245.48.0/20;   # ex.: faixa Cloudflare
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── Autenticação — 5 req/min (anti força bruta) ──────────────────────────
    # Regex é avaliada antes dos prefixos, então tem precedência sobre /api/.
    location ~ ^/api/auth/(login|redefinir-senha|refresh) {
        limit_req zone=ejc_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── IA e geração de peças — 10 req/min, timeout longo (streaming SSE) ────
    location ~ ^/api/(ai|pecas)/ {
        limit_req zone=ejc_ai burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;          # SSE precisa de flush imediato
    }

    # ── API geral ────────────────────────────────────────────────────────────
    # proxy_pass sem barra final preserva o prefixo /api/ que o FastAPI espera.
    location /api/ {
        limit_req zone=ejc_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # ── Frontend (build estático servido pelo container nginx do frontend) ───
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── Catch-all :80 — acesso por IP ou domínio desconhecido ────────────────────
# Sem um default explícito, uma requisição a domínio não mapeado cai no
# primeiro vhost por acaso de ordenação. Com vários sites na mesma VPS, isso
# faria um site responder pelo nome de outro. Mantenha ESTE como o único
# `default_server` da porta 80 em toda a máquina.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 302 https://ejc.depaulateixeira.adv.br;
}
