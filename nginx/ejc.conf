# ── EJC — Nginx reverse proxy de PRODUÇÃO (host, fora do Docker) ──────────────
# Copiado para /etc/nginx/sites-available/ejc.conf por scripts/vps_setup.sh e
# habilitado via symlink em sites-enabled. Faz o TLS e encaminha para os
# containers publicados SOMENTE no loopback do host:
#   frontend  → 127.0.0.1:8080  (docker-compose: ports "127.0.0.1:8080:80")
#   backend   → 127.0.0.1:8000  (uvicorn; Dockerfile EXPOSE 8000 / entrypoint.sh)
#
# IMPORTANTE: troque o server_name e os caminhos de certificado abaixo pelo
# domínio real usado no certbot (`certbot --nginx -d <domínio>`). O caminho do
# certificado precisa casar EXATAMENTE com esse -d (Let's Encrypt cria
# /etc/letsencrypt/live/<domínio>/). O deploy público checa
# https://ejc.depaulateixeira.adv.br/api/health.

# ── HTTP :80 — validação ACME + redirect permanente para HTTPS ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name ejc.depaulateixeira.adv.br;

    # Deixe o webroot do certbot passar em claro (renovação sem downtime).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — TLS + proxy para frontend/backend ───────────────────────────
server {
    # HTTP/2 na própria diretiva listen: compatível com nginx 1.18–1.24 E 1.25+.
    # (No 1.25.1+ a diretiva separada `http2 on;` existe, mas quebra o boot em
    #  nginx < 1.25.1 com "unknown directive http2" — esta forma vale em todas.)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ejc.depaulateixeira.adv.br;

    # Certbot preenche/gerencia estes caminhos. Placeholders (ajuste o domínio):
    #   /etc/letsencrypt/live/<domínio>/fullchain.pem
    #   /etc/letsencrypt/live/<domínio>/privkey.pem
    ssl_certificate     /etc/letsencrypt/live/ejc.depaulateixeira.adv.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ejc.depaulateixeira.adv.br/privkey.pem;
    # Gerenciados pelo pacote python3-certbot-nginx (options-ssl-nginx.conf):
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS: força HTTPS por 2 anos (só habilite depois de confirmar que o
    # certificado está OK — HSTS é difícil de reverter).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload de documentos jurídicos: alinhe com MAX_UPLOAD_MB do backend (50).
    client_max_body_size 50m;

    # ── IP real / anti-spoofing de X-Forwarded-For ───────────────────────────
    # Nginx é o PRIMEIRO hop confiável. Só substitui $remote_addr pelo valor de
    # X-Forwarded-For quando a conexão vem de uma fonte confiável (real_ip),
    # evitando que um cliente arbitrário forje o IP. Como o Nginx aqui é
    # público (recebe o cliente direto), $remote_addr já é o IP real; se houver
    # um CDN/balanceador na frente (ex.: Cloudflare), descomente e liste as
    # faixas dele em set_real_ip_from para o IP verdadeiro ser preservado.
    set_real_ip_from 127.0.0.1;
    #set_real_ip_from 10.0.0.0/8;
    #set_real_ip_from 173.245.48.0/20;   # ex.: faixa Cloudflare
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── API (backend uvicorn) ────────────────────────────────────────────────
    # /api/ ANTES de / (mais específico). proxy_pass sem barra final preserva
    # o prefixo /api/ que o FastAPI espera nas rotas.
    #
    # A mitigação que esta regra do semgrep pede ("allow only the value
    # websocket for HTTP/1.1 upgrade headers") ESTÁ aplicada — nos dois `map`
    # no fim deste arquivo. A regra não a enxerga porque `map` só pode ser
    # declarado no escopo http::, fora do `server{}`, e o casamento dela é
    # textual dentro do bloco `location`. Ver docs/seguranca/SAST_BASELINE.md
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Suporte a WebSocket/SSE, caso a API use streaming de IA.
        # H2C smuggling: repassar `$http_upgrade` cru deixava o cliente pedir
        # `Upgrade: h2c` e tunelar HTTP/2 em texto claro direto para o uvicorn,
        # escapando do roteamento por location e do real_ip deste Nginx. Só
        # `websocket` é repassado (ver os maps no fim do arquivo); qualquer
        # outro valor de Upgrade vira header vazio + `Connection: close`.
        proxy_set_header Upgrade    $upgrade_permitido;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }

    # ── Frontend (build estático servido pelo container nginx do frontend) ────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Maps do handshake de Upgrade. Definidos no escopo http:: precisam ficar fora
# do server{}, mas o sites-available é incluído dentro do http{} do nginx.conf,
# então estes maps são válidos aqui.
#
# ALLOWLIST, não denylist: `default upgrade` repassava QUALQUER protocolo de
# Upgrade — inclusive `h2c` (HTTP/2 cleartext), o que permite smuggling: o
# cliente negocia h2c com o backend e passa a falar direto com o uvicorn,
# ignorando as regras de location e a normalização de X-Forwarded-For feitas
# aqui. Só `websocket` sobe. A comparação do `map` é case-insensitive, então
# `WebSocket`/`websocket` casam igual. SSE não usa Upgrade e não é afetado.
map $http_upgrade $connection_upgrade {
    default   close;
    websocket upgrade;
}

# O header Upgrade repassado ao backend também é filtrado: valor não permitido
# vira string vazia, e o Nginx omite header vazio em vez de encaminhá-lo.
map $http_upgrade $upgrade_permitido {
    default   "";
    websocket $http_upgrade;
}
