# ── /etc/nginx/sites-available/ejc.conf — Nginx do HOST (Contabo VPS) ────────
# Domínio: ejc.depaulateixeira.adv.br | VPS: 13.140.167.153
# SSL: certbot --nginx -d ejc.depaulateixeira.adv.br

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=ejc_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ejc_api:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=ejc_ai:10m   rate=10r/m;

server {
    listen 80;
    server_name ejc.depaulateixeira.adv.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ejc.depaulateixeira.adv.br;

    # Certificados (certbot preenche automaticamente)
    ssl_certificate     /etc/letsencrypt/live/ejc.depaulateixeira.adv.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ejc.depaulateixeira.adv.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Headers de segurança
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Compressão gzip (texto/JSON/JS/CSS)
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss text/xml image/svg+xml application/manifest+json;

    client_max_body_size 60M;

    # Auth endpoints — rate limit agressivo (5r/min)
    location ~ ^/api/(auth/login|auth/redefinir-senha|auth/refresh) {
        limit_req zone=ejc_auth burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # IA endpoints — rate limit moderado (10r/min)
    location ~ ^/api/(ai/|pecas/) {
        limit_req zone=ejc_ai burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # API → backend (127.0.0.1:8000)
    location /api/ {
        limit_req zone=ejc_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # Frontend → container nginx (127.0.0.1:8080)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
