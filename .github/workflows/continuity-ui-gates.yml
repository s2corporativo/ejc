name: Continuity and UI Gates

# SEGURANÇA (SYS-098): os jobs rodam em [self-hosted, ejc-vps] no host de
# PRODUÇÃO e executam código do checkout (restore drill, build, Playwright).
#
# Estes são GATES DE RELEASE/CONTINUIDADE, não de PR: o restore drill restaura um
# dump cifrado em banco vazio e o smoke responsivo sobe Chromium real — provas
# pesadas e que mutam o host, próprias de prontidão de release. Por isso seguem só
# em push na main e workflow_dispatch (`if: github.event_name != 'pull_request'`) —
# em PR os jobs são PULADOS (satisfaz required checks sem rodar nada no host). O
# gate de correção por PR (testes/build/typecheck) vive no ci.yml, que roda em PRs
# do próprio repo com guarda anti-fork.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuity-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore-drill:
    name: Continuidade — backup cifrado + restore em banco vazio
    # SYS-098: não executar código de PR no host de produção self-hosted.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ejc_user
          POSTGRES_PASSWORD: ejc_pass
          POSTGRES_DB: ejc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ejc_user -d ejc_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://ejc_user:ejc_pass@localhost:5432/ejc_db
      DATABASE_URL_SYNC: postgresql://ejc_user:ejc_pass@localhost:5432/ejc_db
      APP_ENV: development
      RESTORE_DRILL_ALLOW: "1"
      RESTORE_DRILL_REPORT: ../restore-drill-report.json
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar cliente PostgreSQL e dependências Python
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Preparar banco migrado
        run: |
          PGPASSWORD=ejc_pass psql -h localhost -U ejc_user -d ejc_db \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          python -m alembic upgrade head

      - name: Executar prova integral de restauração
        run: |
          python -m py_compile ../scripts/backup/restore_drill.py
          PYTHONPATH=. python ../scripts/backup/restore_drill.py

      - name: Publicar relatório de continuidade
        if: always()
        run: |
          {
            echo "## Backup e restauração"
            echo
            echo '```json'
            cat ../restore-drill-report.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Anexar prova de restauração
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restore-drill-report
          path: restore-drill-report.json
          if-no-files-found: error
          retention-days: 14

  frontend-extra-gates:
    name: Frontend — ESLint + browser responsivo
    # SYS-098: não executar código de PR no host de produção self-hosted.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências bloqueadas
        run: npm ci

      - name: ESLint bloqueante
        run: npm run lint:eslint

      - name: Gerar build para teste real de navegador
        run: npm run build

      - name: Instalar Playwright e Chromium compatíveis
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Smoke responsivo em Chromium real
        env:
          SCREENSHOT_DIR: tests/__out__
        run: npm run test:responsive

      - name: Anexar evidências visuais
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-browser-evidence
          path: frontend/tests/__out__
          if-no-files-found: warn
          retention-days: 14
