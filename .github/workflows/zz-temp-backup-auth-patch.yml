name: Temporary backup auth patch

on:
  pull_request:
    branches:
      - fix/backup-auth-isolada-20260720

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Aplicar substituições verificadas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: bloco esperado {count} vez(es), necessário 1")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "backend/app/services/backup_service.py",
              """# - Reusa as credenciais Google já cadastradas para a curadoria de conhecimento
          #   (google_drive_service._build_credentials) — nenhum fluxo novo de auth. O
          #   client do RAG é somente-leitura; aqui re-escopamos para escrita, portanto o
          #   consentimento/compartilhamento do Google precisa permitir escrita na pasta
          #   BACKUP_DRIVE_FOLDER_ID (senão o upload falha com 403 e o alerta dispara).
          """,
              """# - Usa identidade Google exclusiva do backup quando configurada
          #   (BACKUP_GOOGLE_DRIVE_*), preservando o escopo somente leitura do RAG.
          #   O modo legado herdado permanece explícito para compatibilidade.
          """,
          )
          replace_once(
              "backend/app/services/backup_service.py",
              """# Escrita exige escopo amplo: drive.file só alcança arquivos criados pelo
          # próprio app, e a pasta de backup foi criada pelo usuário no Drive dele.
          DRIVE_WRITE_SCOPE = "https://www.googleapis.com/auth/drive"
          
          """,
              "",
          )
          replace_once(
              "backend/app/services/backup_service.py",
              """def configuracao_status() -> dict[str, bool]:
              \"\"\"Booleans de configuração (sem expor nenhum segredo).\"\"\"
              from app.services import google_drive_service as gdrive
          
              auth = gdrive.auth_status()
              credencial_drive = any(v for k, v in auth.items() if k != "auth_mode")
              return {
                  "enabled": bool(settings.BACKUP_ENABLED),
                  "chave_configurada": bool((settings.BACKUP_ENCRYPTION_KEY or "").strip()),
                  "pasta_configurada": bool((settings.BACKUP_DRIVE_FOLDER_ID or "").strip()),
                  "credencial_drive_configurada": credencial_drive,
                  "pg_dump_disponivel": shutil.which("pg_dump") is not None,
              }
          """,
              """def configuracao_status() -> dict[str, bool | str]:
              \"\"\"Configuração operacional sem expor qualquer segredo.\"\"\"
              from app.services import backup_drive_auth
          
              auth = backup_drive_auth.auth_status()
              dedicada = bool(auth["credencial_dedicada_configurada"])
              # Em auto/inherit, GOOGLE_DRIVE_* continua aceito por compatibilidade.
              herdada_permitida = auth["auth_mode"] in {"auto", "inherit"}
              if herdada_permitida and not dedicada:
                  from app.services import google_drive_service as gdrive
          
                  inherited = gdrive.auth_status()
                  credencial_drive = any(
                      bool(value)
                      for key, value in inherited.items()
                      if key != "auth_mode"
                  )
              else:
                  credencial_drive = dedicada
              return {
                  "enabled": bool(settings.BACKUP_ENABLED),
                  "chave_configurada": bool((settings.BACKUP_ENCRYPTION_KEY or "").strip()),
                  "pasta_configurada": bool((settings.BACKUP_DRIVE_FOLDER_ID or "").strip()),
                  "credencial_drive_configurada": credencial_drive,
                  "credencial_dedicada_configurada": dedicada,
                  "auth_mode": str(auth["auth_mode"]),
                  "pg_dump_disponivel": shutil.which("pg_dump") is not None,
              }
          """,
          )
          replace_once(
              "backend/app/services/backup_service.py",
              """# ── Google Drive (reuso das credenciais da curadoria de conhecimento) ────────
          
          def _drive_client_escrita():
              \"\"\"Client Drive com escopo de ESCRITA, reusando o cadastro existente.
          
              Reusa google_drive_service._build_credentials() (mesmos env vars/fluxo do
              PR #205); só o escopo muda, porque o client do RAG é readonly por desenho.
              \"\"\"
              from google.oauth2 import credentials as user_credentials
              from google.oauth2 import service_account
              from googleapiclient.discovery import build
          
              from app.services import google_drive_service as gdrive
          
              creds = gdrive._build_credentials()
              if isinstance(creds, service_account.Credentials):
                  creds = creds.with_scopes([DRIVE_WRITE_SCOPE])
              else:
                  # OAuth de usuário: reconstrói com o escopo de escrita a partir do
                  # MESMO refresh_token/client cadastrados (sem novo consentimento se o
                  # grant original já incluir escrita; senão o refresh/upload falha e o
                  # erro sobe para o alerta).
                  creds = user_credentials.Credentials(
                      token=None,
                      refresh_token=getattr(creds, "refresh_token", None),
                      token_uri=getattr(creds, "token_uri", None) or gdrive.GOOGLE_TOKEN_URI,
                      client_id=getattr(creds, "client_id", None),
                      client_secret=getattr(creds, "client_secret", None),
                      scopes=[DRIVE_WRITE_SCOPE],
                  )
                  creds = gdrive._refresh_if_needed(creds)
              return build("drive", "v3", credentials=creds, cache_discovery=False)
          """,
              """# ── Google Drive (identidade de escrita isolada do RAG) ──────────────────────
          
          def _drive_client_escrita():
              from app.services import backup_drive_auth
          
              return backup_drive_auth.build_client()
          """,
          )
          replace_once(
              "backend/app/services/backup_service.py",
              "# 4) Upload ao Drive (credenciais reusadas da curadoria).",
              "# 4) Upload ao Drive (identidade de escrita exclusiva quando configurada).",
          )
          replace_once(
              "backend/app/core/config.py",
              """# (b) Backup diário cifrado → Google Drive (services/backup_service.py).
              # Reusa as credenciais Google da curadoria de conhecimento (GOOGLE_DRIVE_*)
              # — nenhum fluxo novo de auth. Opt-in: default False mantém tudo desligado.
          """,
              """# (b) Backup diário cifrado → Google Drive (services/backup_service.py).
              # Prefere identidade exclusiva BACKUP_GOOGLE_DRIVE_* com escrita. O modo
              # herdado GOOGLE_DRIVE_* existe apenas para compatibilidade explícita.
              # Opt-in: default False mantém tudo desligado.
          """,
          )
          replace_once(
              ".env.example",
              """# Reusa as credenciais Google da curadoria de conhecimento (GOOGLE_DRIVE_*
          # acima) — nenhum fluxo novo de auth. O consentimento/compartilha-
          # mento do Google precisa permitir ESCRITA na pasta de backup (o client do RAG
          # é somente-leitura; o de backup re-escopa para escrita).
          """,
              """# Prefere credencial EXCLUSIVA de escrita para não ampliar o escopo do RAG.
          # Em produção, use service_account e compartilhe a pasta de backup como Editor.
          # `auto` tenta credencial dedicada e só então herda GOOGLE_DRIVE_* por legado.
          """,
          )
          replace_once(
              ".env.example",
              "BACKUP_DRIVE_FOLDER_ID=\n",
              """BACKUP_DRIVE_FOLDER_ID=
          # auto | service_account | oauth | inherit. Recomendado: service_account.
          BACKUP_GOOGLE_DRIVE_AUTH_MODE=auto
          # JSON em uma linha OU caminho montado somente leitura; configure apenas um.
          BACKUP_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON=
          BACKUP_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE=
          # Alternativa OAuth exclusiva: authorized_user JSON/arquivo OU trio abaixo.
          BACKUP_GOOGLE_DRIVE_OAUTH_USER_JSON=
          BACKUP_GOOGLE_DRIVE_OAUTH_USER_FILE=
          BACKUP_GOOGLE_DRIVE_OAUTH_CLIENT_ID=
          BACKUP_GOOGLE_DRIVE_OAUTH_CLIENT_SECRET=
          BACKUP_GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN=
          """,
          )

          runbook = Path("RUNBOOK_ROTINA_BACKUP_DIARIA_GDRIVE.md")
          text = runbook.read_text(encoding="utf-8")
          marker = "## Credencial exclusiva de escrita"
          if marker not in text:
              text += """
          
          ## Credencial exclusiva de escrita
          
          O backup não deve ampliar a credencial somente leitura usada pelo RAG. Em
          produção, configure `BACKUP_GOOGLE_DRIVE_AUTH_MODE=service_account` e uma
          das variáveis `BACKUP_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON` ou
          `BACKUP_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE`. Compartilhe somente a pasta
          `BACKUP_DRIVE_FOLDER_ID` com o e-mail da conta de serviço no papel **Editor**.
          
          O modo `inherit` existe apenas para compatibilidade. Um refresh token emitido
          somente com `drive.readonly` continuará falhando com `invalid_scope` quando
          reconstruído para escrita; nesse caso, reautorize com escrita ou migre para a
          conta de serviço exclusiva.
          """
              runbook.write_text(text, encoding="utf-8")

          Path("scripts/.backup-auth-trigger").unlink(missing_ok=True)
          PY
      - name: Commitar patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/backup_service.py backend/app/core/config.py .env.example RUNBOOK_ROTINA_BACKUP_DIARIA_GDRIVE.md scripts/.backup-auth-trigger
          git commit -m "fix(backup): usar credencial de escrita isolada do RAG"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
