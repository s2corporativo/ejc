name: Auditoria consolidada EJC

on:
  workflow_dispatch:
  push:
    branches:
      - fix/parte10-inteligencia-conferencia-assinatura

permissions:
  contents: read

jobs:
  backend-estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar backend
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compilar Python
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Testes Partes 10 e 12
        working-directory: backend
        run: pytest -q tests/test_parte10_conferencia_assinatura.py tests/test_parte12_filtros_e_metricas.py

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ejc_test
          POSTGRES_PASSWORD: ejc_test
          POSTGRES_DB: ejc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ejc_test -d ejc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ejc_test:ejc_test@localhost:5432/ejc_test
      DATABASE_URL_SYNC: postgresql://ejc_test:ejc_test@localhost:5432/ejc_test
      RUN_DB_TESTS: '1'
      SECRET_KEY: ci-only-secret-key-not-for-production
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production
      POSTGRES_USER: ejc_test
      POSTGRES_PASSWORD: ejc_test
      POSTGRES_DB: ejc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar backend
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Aplicar migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Testes de integridade no PostgreSQL
        working-directory: backend
        run: pytest -q tests/test_integridade_contadores_dblevel.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:eslint
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar ambiente mínimo para interpolação
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ejc
          POSTGRES_PASSWORD=ci-only
          POSTGRES_DB=ejc
          SECRET_KEY=ci-only
          JWT_SECRET_KEY=ci-only
          EOF
      - name: Validar docker-compose
        run: docker compose config -q
