name: CI

# Executa automaticamente em cada push para main e em cada Pull Request.
# Todos os controles abaixo são bloqueantes: teste, build, lint, formatação ou
# vulnerabilidade alta impedem homologação. Para eficácia jurídica/operacional,
# os checks deste workflow e do "EJC Release Gate" devem ser obrigatórios na
# proteção da branch main.

# CI em runner self-hosted dedicado `ejc-ci`, isolado da produção. O runner
# `ejc-vps` permanece reservado a deploy, backup real e operações oficiais.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-validation:
    name: Backend — suíte completa + schema/RAG (Postgres pgvector)
    runs-on: [self-hosted, linux, ejc-ci, ejc-ci-isolado]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ejc_user
          POSTGRES_PASSWORD: ejc_pass
          POSTGRES_DB: ejc_db
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ejc_user -d ejc_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://ejc_user:ejc_pass@localhost:55432/ejc_db
      DATABASE_URL_SYNC: postgresql://ejc_user:ejc_pass@localhost:55432/ejc_db
      SCHEMA_CHECK_DATABASE_URL: postgresql://ejc_user:ejc_pass@localhost:55432/ejc_db
      APP_ENV: development
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Validar sintaxe dos scripts críticos de produção
        working-directory: .
        run: bash -n scripts/backup/ativar_backup.sh scripts/deploy_vps_safe.sh

      - name: Instalar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validar dependências nativas pré-instaladas
        run: |
          command -v psql
          command -v tesseract
          command -v pdftotext
          test -r /usr/lib/x86_64-linux-gnu/libmagic.so.1 || true

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Gate de compatibilidade dos modelos RAG (sem download de pesos)
        run: |
          python -c "from app.services.embedding_service import validar_modelo_local; ok,msg=validar_modelo_local(); print(msg); raise SystemExit(0 if ok else 1)"
          python -c "from app.core.config import get_settings; from fastembed.rerank.cross_encoder import TextCrossEncoder; s=get_settings(); nomes={m['model'] for m in TextCrossEncoder.list_supported_models()}; assert s.RAG_RERANK_MODEL in nomes, s.RAG_RERANK_MODEL; print(s.RAG_RERANK_MODEL)"

      - name: Criar extensões (vector, pg_trgm, pgcrypto)
        run: |
          PGPASSWORD=ejc_pass psql -h localhost -p 55432 -U ejc_user -d ejc_db \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Lint bloqueante (ruff)
        run: |
          set -o pipefail
          python -m ruff check app --output-format=concise 2>&1 | tee ../ruff-report.txt

      - name: Anexar diagnóstico Ruff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruff-report
          path: ruff-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Auditoria bloqueante de dependências Python (pip-audit)
        run: |
          set -o pipefail
          python -m pip install pip-audit
          pip-audit -r requirements.txt --desc 2>&1 | tee ../pip-audit-report.txt

      - name: Anexar diagnóstico pip-audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Aplicar migrations (alembic upgrade head)
        run: python -m alembic upgrade head

      - name: Testes com banco real e cobertura mínima do backend
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=short --maxfail=25 \
            --cov=app \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:../backend-coverage.xml \
            --cov-fail-under=65 \
            2>&1 | tee ../backend-test-summary.log

      - name: Publicar resumo backend
        if: always()
        run: |
          {
            echo "## Backend — resumo dos testes e cobertura"
            echo
            echo '```text'
            tail -n 250 ../backend-test-summary.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Anexar log e cobertura backend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-summary
          path: |
            backend-test-summary.log
            backend-coverage.xml
          if-no-files-found: warn
          retention-days: 7

  eval-smoke:
    name: Eval — smoke dos gold sets (offline, bloqueante)
    runs-on: [self-hosted, linux, ejc-ci, ejc-ci-isolado]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar formato dos gold sets (smoke — sem banco/LLM)
        run: python -m app.eval.run_eval --smoke

      - name: Eval de trajetória do agente (offline, LLM mockado)
        run: python -m app.eval.agent_trajectory --min-tool 1.0 --max-violacoes-hitl 0

  frontend-build:
    name: Frontend — testes + typecheck + build
    runs-on: [self-hosted, linux, ejc-ci, ejc-ci-isolado]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Node 22.22
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Formatação bloqueante (prettier)
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee ../prettier-report.txt

      - name: Anexar diagnóstico Prettier
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prettier-report
          path: prettier-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Testes (Vitest com resumo compacto)
        run: |
          set -o pipefail
          npm run test -- --reporter=dot 2>&1 | tee ../frontend-test-summary.log

      - name: Publicar resumo frontend
        if: always()
        run: |
          {
            echo "## Frontend — resumo dos testes"
            echo
            echo '```text'
            tail -n 250 ../frontend-test-summary.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Anexar log frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-summary
          path: frontend-test-summary.log
          if-no-files-found: warn
          retention-days: 7

      - name: Auditoria bloqueante de dependências Node (alta e crítica)
        run: npm audit --audit-level=high

      - name: Typecheck + build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../frontend-build-report.log

      - name: Anexar diagnóstico TypeScript/Vite
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build-report
          path: frontend-build-report.log
          if-no-files-found: warn
          retention-days: 7
