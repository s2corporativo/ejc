name: CI

# Roda em cada push e Pull Request. Se algum teste/build falhar, bloqueia o merge.
# Objetivo: nada quebrado chega na produção do escritório.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar testes (unitários + segurança, sem banco)
        env:
          APP_ENV: development
        # Escopo deste job: testes que validam a reaplicação de segurança e a
        # lógica pura (sem banco/rede). Os testes de INTEGRAÇÃO (test_auth,
        # test_casos, test_honorarios, test_prazos, test_seguranca,
        # test_case_context_precedentes) exigem Postgres e rodarão num CI de
        # integração com serviço de banco (staging — Bloco 3). Testes de
        # correções de IA fora deste escopo (test_legal_base, test_documento_service)
        # entram no PR de hardening de IA.
        run: >
          python -m pytest -q
          tests/test_ownership.py
          tests/test_rag_isolation.py
          tests/test_sanitizer.py
          tests/test_security.py
          tests/test_security_service.py
          tests/test_citation_check.py
          tests/test_calc_custas.py
          tests/test_calc_prescricao.py
          tests/test_calc_trabalhista.py
          tests/test_tax_tables.py
          tests/test_deadline_calculator.py
          tests/test_document_format.py
          tests/test_smoke.py

  frontend-build:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Typecheck + build
        run: npm run build

  backend-integration:
    name: Backend — integração (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ejc_user
          POSTGRES_PASSWORD: ejc_secret
          POSTGRES_DB: ejc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ejc_user -d ejc_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Instalar cliente psql + habilitar extensão pgvector
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=ejc_secret psql -h localhost -U ejc_user -d ejc_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Rodar testes de integração
        env:
          APP_ENV: development
          # O fixture troca /ejc_db -> /ejc_test (conftest). Banco real = ejc_test.
          DATABASE_URL: postgresql+asyncpg://ejc_user:ejc_secret@localhost:5432/ejc_db
        run: >
          python -m pytest -q
          tests/test_auth.py
          tests/test_casos.py
          tests/test_honorarios.py
          tests/test_prazos.py
          tests/test_seguranca.py
