name: CI

# Roda automaticamente em cada push e em cada Pull Request.
# Se QUALQUER teste ou build falhar, o GitHub bloqueia o merge/deploy.
# Objetivo: nada quebrado chega na produção do escritório.

# CI no runner SELF-HOSTED (2026-07-17): roda no VPS do escritório em vez da nuvem
# do GitHub → Actions minutes = 0 (custo zero), mantendo os checks de PR.
# ⚠️ Requer o runner registrado ANTES (scripts/setup-selfhosted-runner.sh); sem
# runner online os checks ficam "aguardando runner". Ver docs/RUNNER_SELFHOSTED.md.
# (Para voltar à nuvem paga: runs-on: ubuntu-latest.)
on:
  # CI automática REATIVADA (2026-07-18): o runner é SELF-HOSTED no VPS
  # (ejc-vps), então rodar em cada PR e no push da main custa 0 minutos de
  # Actions — o motivo original de deixar manual (economia de minutos) não se
  # aplica mais, e o próprio header deste arquivo já visa "manter os checks de PR".
  # ⚠️ REQUER o runner self-hosted 'ejc-vps' registrado e ONLINE
  # (docs/RUNNER_SELFHOSTED.md / scripts/setup-selfhosted-runner.sh); sem runner,
  # os checks ficam "aguardando runner". workflow_dispatch segue disponível.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O antigo job backend-tests (pytest SEM banco) foi consolidado aqui: o
  # db-validation roda a MESMA suíte completa (RUN_DB_TESTS=1 só ADICIONA os
  # testes row-level), então manter os dois pagava a suíte inteira duas vezes
  # (~8 min de runner por push — cota de Actions em repositório privado).
  # Lint (ruff) e pip-audit migraram para cá.
  db-validation:
    name: Backend — suíte completa + schema/RAG (Postgres pgvector)
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ejc_user
          POSTGRES_PASSWORD: ejc_pass
          POSTGRES_DB: ejc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ejc_user -d ejc_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # Async (app/asyncpg) e sync (alembic/psycopg2) apontam para o serviço.
      DATABASE_URL: postgresql+asyncpg://ejc_user:ejc_pass@localhost:5432/ejc_db
      DATABASE_URL_SYNC: postgresql://ejc_user:ejc_pass@localhost:5432/ejc_db
      SCHEMA_CHECK_DATABASE_URL: postgresql://ejc_user:ejc_pass@localhost:5432/ejc_db
      APP_ENV: development
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependências nativas e cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libmagic1 \
            poppler-utils \
            tesseract-ocr \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Gate de compatibilidade dos modelos RAG (sem download de pesos)
        run: |
          python -c "from app.services.embedding_service import validar_modelo_local; ok,msg=validar_modelo_local(); print(msg); raise SystemExit(0 if ok else 1)"
          python -c "from app.core.config import get_settings; from fastembed.rerank.cross_encoder import TextCrossEncoder; s=get_settings(); nomes={m['model'] for m in TextCrossEncoder.list_supported_models()}; assert s.RAG_RERANK_MODEL in nomes, s.RAG_RERANK_MODEL; print(s.RAG_RERANK_MODEL)"

      - name: Criar extensões (vector, pg_trgm, pgcrypto)
        run: |
          PGPASSWORD=ejc_pass psql -h localhost -U ejc_user -d ejc_db \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      # Gate de lint/format — ruff já está no requirements.txt. Non-blocking
      # por ora (continue-on-error); quando o código estiver limpo, REMOVA o
      # continue-on-error para tornar o lint BLOQUEANTE.
      - name: Lint (ruff)
        continue-on-error: true
        run: python -m ruff check app

      # Scan de vulnerabilidades das dependências Python. Non-blocking para
      # não travar o CI com achados legados de dependências transitivas.
      - name: Scan de vulnerabilidades (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --desc

      - name: Aplicar migrations (alembic upgrade head)
        run: python -m alembic upgrade head

      - name: Testes com banco real (schema, RAG row-level, LGPD row-level)
        # Suíte COMPLETA com RUN_DB_TESTS=1 — não listar arquivos um a um:
        # a lista explícita anterior fez os testes row-level de LGPD (Bloco 6)
        # nunca rodarem no CI apesar do job verde (verde enganoso). Com a
        # suíte inteira, qualquer *_dblevel.py novo roda automaticamente.
        run: python -m pytest tests -v

  # Eval SMOKE (auditoria IA — P2): valida o formato dos gold sets e roda as
  # métricas determinísticas 100% OFFLINE (sem banco e sem chamada de LLM
  # externa). O smoke é BLOQUEANTE: formato inválido ou violação HITL não pode
  # chegar à main. Pisos de qualidade do gold set real seguem no roadmap.
  eval-smoke:
    name: Eval — smoke dos gold sets (offline, bloqueante)
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar formato dos gold sets (smoke — sem banco/LLM)
        run: python -m app.eval.run_eval --smoke

      - name: Eval de trajetória do agente (offline, LLM mockado)
        run: python -m app.eval.agent_trajectory --min-tool 1.0 --max-violacoes-hitl 0

  frontend-build:
    name: Frontend — typecheck + build (tsc + vite)
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Gate de format — script "format:check" (prettier) já existe no
      # package.json. Non-blocking por ora; remova o continue-on-error para
      # torná-lo BLOQUEANTE quando o código estiver formatado.
      - name: Checar formatação (prettier)
        continue-on-error: true
        run: npm run format:check

      # Testes de unidade do frontend (vitest). --if-present evita quebrar o CI
      # caso o script "test" ainda não tenha entrado no package.json; assim que
      # entrar, roda automaticamente. Quando o vitest estiver consolidado,
      # prefira o step direto `npm run test`.
      - name: Testes (vitest)
        run: npm run test --if-present

      # Scan de vulnerabilidades das dependências npm (severidade >= high).
      # Non-blocking por ora (continue-on-error) para triagem de achados
      # legados; remova para tornar bloqueante em severidade alta.
      - name: Scan de vulnerabilidades (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Typecheck + build
        run: npm run build
