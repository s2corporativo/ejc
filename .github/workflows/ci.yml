name: CI

# Roda automaticamente em cada push e em cada Pull Request.
# Se QUALQUER teste ou build falhar, o GitHub bloqueia o merge/deploy.
# Objetivo: nada quebrado chega na produção do escritório.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — pytest (inclui guarda de drift de schema)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        env:
          APP_ENV: development
        run: python -m pytest tests -q

  db-validation:
    name: Validação schema + RAG row-level (Postgres pgvector)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ejc_user
          POSTGRES_PASSWORD: ejc_pass
          POSTGRES_DB: ejc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ejc_user -d ejc_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # Async (app/asyncpg) e sync (alembic/psycopg2) apontam para o serviço.
      DATABASE_URL: postgresql+asyncpg://ejc_user:ejc_pass@localhost:5432/ejc_db
      DATABASE_URL_SYNC: postgresql://ejc_user:ejc_pass@localhost:5432/ejc_db
      SCHEMA_CHECK_DATABASE_URL: postgresql://ejc_user:ejc_pass@localhost:5432/ejc_db
      APP_ENV: development
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        # psycopg2-binary: driver SYNC exigido por alembic (env.py) e pela
        # checagem de schema — hoje ausente do requirements.txt (ver relatório).
        run: pip install -r requirements.txt psycopg2-binary

      - name: Criar extensões (vector, pg_trgm, pgcrypto)
        run: |
          PGPASSWORD=ejc_pass psql -h localhost -U ejc_user -d ejc_db \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Aplicar migrations (alembic upgrade head)
        run: python -m alembic upgrade head

      - name: Validação de schema (metadata × banco) + RAG isolamento row-level
        run: python -m pytest tests/test_schema_sync.py tests/test_rag_isolation_dblevel.py -v

  frontend-build:
    name: Frontend — typecheck + build (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck + build
        run: npm run build
