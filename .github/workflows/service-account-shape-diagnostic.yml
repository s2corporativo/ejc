name: Service Account Shape Diagnostic

on:
  push:
    branches:
      - diagnostic/prod-backend-20260817
    paths:
      - .github/workflows/service-account-shape-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Classificar arquivo montado sem imprimir conteúdo
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i ejc_worker python - <<'PY'
          import base64, json, os, re
          from pathlib import Path

          path = Path('/app/secrets/ejc-backup-drive.json')
          raw = path.read_bytes() if path.is_file() else b''
          print(f"file_exists={path.is_file()}")
          print(f"file_size={len(raw)}")
          text = raw.decode('utf-8-sig', errors='replace').strip()
          print("first_nonspace_is_object=" + str(text.startswith('{')).lower())
          print("looks_base64_charset=" + str(bool(text) and re.fullmatch(r'[A-Za-z0-9+/=_\-\s]+', text) is not None).lower())
          print("looks_env_assignment=" + str('=' in text[:100] and not text.startswith('{')).lower())

          required = {'type','project_id','private_key_id','private_key','client_email','client_id','token_uri'}
          def assess(label, candidate):
              try:
                  obj = json.loads(candidate)
              except Exception:
                  print(label + '_json_valid=false')
                  return False
              print(label + '_json_valid=true')
              print(label + '_is_object=' + str(isinstance(obj, dict)).lower())
              if isinstance(obj, dict):
                  print(label + '_type_service_account=' + str(obj.get('type') == 'service_account').lower())
                  print(label + '_required_fields_complete=' + str(required.issubset(obj)).lower())
              return isinstance(obj, dict) and obj.get('type') == 'service_account' and required.issubset(obj)

          direct = assess('direct', text)
          quoted = False
          if not direct and len(text) >= 2 and text[0] == text[-1] and text[0] in {'\'', '"'}:
              quoted = assess('outer_quoted', text[1:-1])
          env_candidate = None
          if not direct and '=' in text:
              _, rhs = text.split('=', 1)
              rhs = rhs.strip()
              if len(rhs) >= 2 and rhs[0] == rhs[-1] and rhs[0] in {'\'', '"'}:
                  rhs = rhs[1:-1]
              env_candidate = rhs
              assess('env_rhs', rhs)
          try:
              compact = ''.join(text.split())
              decoded = base64.b64decode(compact, validate=True).decode('utf-8-sig')
              assess('base64_decoded', decoded.strip())
          except Exception:
              print('base64_decoded_json_valid=false')
          PY
