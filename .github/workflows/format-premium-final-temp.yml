name: Format Premium Final Temp

on:
  push:
    branches:
      - refactor/ejc-premium-gold-graphite-20260805

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ejc-premium-gold-graphite-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Formatar arquivos alterados
        working-directory: frontend
        run: |
          npx prettier --write \
            src/App.tsx \
            src/components/SidebarWeekCalendar.tsx \
            src/pages/AgendaDia.tsx

      - name: Commit da formatação
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração de formatação necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/App.tsx \
            frontend/src/components/SidebarWeekCalendar.tsx \
            frontend/src/pages/AgendaDia.tsx
          git commit -m "style(frontend): formata rota da agenda diaria"
          git push origin HEAD:refactor/ejc-premium-gold-graphite-20260805
