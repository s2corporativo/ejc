name: GDrive Mounted Credential Probe

on:
  push:
    branches:
      - diagnostic/prod-backend-20260817
    paths:
      - .github/workflows/gdrive-mounted-credential-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Provar credencial montada e acesso à pasta sem escrita
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f /opt/ejc/docker-compose.yml run --rm --no-deps -T \
            -e BACKUP_DESTINO=gdrive \
            -e BACKUP_GOOGLE_DRIVE_AUTH_MODE=service_account \
            -e BACKUP_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE=/app/secrets/ejc-backup-drive.json \
            backend python - <<'PY'
          import os
          from app.core.config import get_settings
          from app.services import backup_drive_auth

          path = os.environ.get("BACKUP_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE", "")
          print("mounted_service_account_exists=" + str(os.path.isfile(path)).lower())
          if not os.path.isfile(path):
              raise SystemExit("credencial montada ausente")
          settings = get_settings()
          folder = (settings.BACKUP_DRIVE_FOLDER_ID or "").strip()
          if not folder:
              raise SystemExit("pasta de backup não configurada")
          service = backup_drive_auth.build_client()
          meta = service.files().get(fileId=folder, fields="id", supportsAllDrives=True).execute()
          print("gdrive_folder_read_ok=" + str(bool(meta.get("id"))).lower())
          PY
