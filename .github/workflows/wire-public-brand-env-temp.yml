name: Wire Public Branding Env Temp

on:
  push:
    branches:
      - refactor/ejc-premium-gold-graphite-20260805

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ejc-premium-gold-graphite-20260805
          fetch-depth: 0

      - name: Conectar variáveis públicas ao build Docker
        run: |
          python - <<'PY'
          from pathlib import Path

          dockerfile = Path("frontend/Dockerfile")
          text = dockerfile.read_text(encoding="utf-8")
          marker = "FROM node:20-slim AS build\nWORKDIR /app\n"
          replacement = """FROM node:20-slim AS build
ARG VITE_EJC_OFFICE_NAME=""
ARG VITE_EJC_LOGO_PATH=""
ARG VITE_EJC_WHATSAPP_NUMBER=""
ARG VITE_EJC_CONTACT_EMAIL=""
ARG VITE_EJC_OFFICE_AI_URL=""
ARG VITE_EJC_OFFICE_AI_LABEL=""
ARG VITE_EJC_TIMEZONE=""
ARG VITE_EJC_DAILY_MESSAGE=""
ARG VITE_EJC_DAILY_MESSAGE_SOURCE=""
ENV VITE_EJC_OFFICE_NAME=$VITE_EJC_OFFICE_NAME \\
    VITE_EJC_LOGO_PATH=$VITE_EJC_LOGO_PATH \\
    VITE_EJC_WHATSAPP_NUMBER=$VITE_EJC_WHATSAPP_NUMBER \\
    VITE_EJC_CONTACT_EMAIL=$VITE_EJC_CONTACT_EMAIL \\
    VITE_EJC_OFFICE_AI_URL=$VITE_EJC_OFFICE_AI_URL \\
    VITE_EJC_OFFICE_AI_LABEL=$VITE_EJC_OFFICE_AI_LABEL \\
    VITE_EJC_TIMEZONE=$VITE_EJC_TIMEZONE \\
    VITE_EJC_DAILY_MESSAGE=$VITE_EJC_DAILY_MESSAGE \\
    VITE_EJC_DAILY_MESSAGE_SOURCE=$VITE_EJC_DAILY_MESSAGE_SOURCE
WORKDIR /app
"""
          if marker not in text:
              raise SystemExit("marcador do frontend/Dockerfile não encontrado")
          dockerfile.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

          compose = Path("docker-compose.yml")
          text = compose.read_text(encoding="utf-8")
          marker = """  frontend:
    build:
      context: ./frontend
"""
          replacement = """  frontend:
    build:
      context: ./frontend
      args:
        VITE_EJC_OFFICE_NAME: ${VITE_EJC_OFFICE_NAME:-}
        VITE_EJC_LOGO_PATH: ${VITE_EJC_LOGO_PATH:-}
        VITE_EJC_WHATSAPP_NUMBER: ${VITE_EJC_WHATSAPP_NUMBER:-}
        VITE_EJC_CONTACT_EMAIL: ${VITE_EJC_CONTACT_EMAIL:-}
        VITE_EJC_OFFICE_AI_URL: ${VITE_EJC_OFFICE_AI_URL:-}
        VITE_EJC_OFFICE_AI_LABEL: ${VITE_EJC_OFFICE_AI_LABEL:-}
        VITE_EJC_TIMEZONE: ${VITE_EJC_TIMEZONE:-}
        VITE_EJC_DAILY_MESSAGE: ${VITE_EJC_DAILY_MESSAGE:-}
        VITE_EJC_DAILY_MESSAGE_SOURCE: ${VITE_EJC_DAILY_MESSAGE_SOURCE:-}
"""
          if marker not in text:
              raise SystemExit("bloco frontend do docker-compose.yml não encontrado")
          compose.write_text(text.replace(marker, replacement, 1), encoding="utf-8")

          env_file = Path(".env.example")
          text = env_file.read_text(encoding="utf-8")
          marker = "FRONTEND_URL=https://seu-dominio.com.br\n\n# PII em repouso"
          section = """FRONTEND_URL=https://seu-dominio.com.br

# Identidade pública do frontend — estes valores são incorporados ao bundle
# Vite durante o build e, portanto, NÃO podem conter segredo, token ou senha.
VITE_EJC_OFFICE_NAME=EJC — Ecossistema Jurídico Clóvis
VITE_EJC_LOGO_PATH=/brand/logo-hd.png
# Somente dígitos, com DDI e DDD. Vazio = botão desabilitado.
VITE_EJC_WHATSAPP_NUMBER=
VITE_EJC_CONTACT_EMAIL=
# URL http/https sem credenciais embutidas. Vazio = botão desabilitado.
VITE_EJC_OFFICE_AI_URL=
VITE_EJC_OFFICE_AI_LABEL=Claude
VITE_EJC_TIMEZONE=America/Sao_Paulo
VITE_EJC_DAILY_MESSAGE=Organização, clareza e responsabilidade em cada decisão.
VITE_EJC_DAILY_MESSAGE_SOURCE=Mensagem institucional

# PII em repouso"""
          if marker not in text:
              raise SystemExit("ponto de inserção em .env.example não encontrado")
          env_file.write_text(text.replace(marker, section, 1), encoding="utf-8")
          PY

      - name: Validar configuração e build frontend
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config >/tmp/ejc-compose-config.yml
          grep -q "VITE_EJC_OFFICE_NAME" /tmp/ejc-compose-config.yml
          cd frontend
          npm ci
          npm run lint
          npm run lint:eslint
          npm run build

      - name: Remover workflow temporário e publicar correção
        run: |
          rm .github/workflows/wire-public-brand-env-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .env.example \
            docker-compose.yml \
            frontend/Dockerfile \
            .github/workflows/wire-public-brand-env-temp.yml
          git commit -m "fix(deploy): injeta branding publico no build Vite"
          git push origin HEAD:refactor/ejc-premium-gold-graphite-20260805
