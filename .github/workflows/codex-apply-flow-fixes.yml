name: Codex — aplicar ajustes de fluxo

on:
  push:
    branches:
      - codex/fluxo-modulos-p0-p1
    paths:
      - scripts/codex_apply_flow_fixes.py
      - .github/workflows/codex-apply-flow-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: codex/fluxo-modulos-p0-p1
          fetch-depth: 0

      - name: Aplicar substituições validadas
        run: python scripts/codex_apply_flow_fixes.py

      - name: Validar ausência de segredos no diff
        run: |
          if git diff -- . ':!scripts/codex_apply_flow_fixes.py' | grep -E '(API_KEY|SECRET_KEY|PASSWORD=|BEGIN (RSA|OPENSSH) PRIVATE KEY)' ; then
            echo 'Possível segredo detectado no diff.' >&2
            exit 1
          fi

      - name: Commitar somente quando houver alterações
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages
          git commit -m 'refactor(fluxo): concluir correções pontuais dos módulos'
          git push origin HEAD:codex/fluxo-modulos-p0-p1
