# Deploy automático do EJC no runner instalado na própria VPS.
#
# Após a CI de push na main concluir com sucesso, o runner local confere o SHA,
# classifica somente as migrations pendentes e executa uma transação host-level:
# rsync → backup → build → migration expand-only → troca → health → rollback.
# Não usa SSH, senha de root, chave privada ou rsync remoto.
name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      run_seeds:
        description: "Reingerir o corpus RAG após o deploy"
        type: boolean
        default: false
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_run' &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RUN_SEEDS: ${{ (github.event_name == 'workflow_run' || inputs.run_seeds) && '1' || '0' }}
      REQUIRE_PREDEPLOY_BACKUP: "1"
    steps:
      - name: Checkout exato do commit aprovado
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      # O actions/checkout registra safe.directory num HOME temporário. Em
      # self-hosted runner isso não deve virar confiança global persistente.
      # A exceção é concedida por comando e somente após validar o dono do
      # workspace, evitando reabrir execução de .git/config não confiável.
      - name: Idempotência por SHA — pular se o commit já está implantado
        shell: bash
        run: |
          set -uo pipefail
          LAST_SHA=""
          [ -f /opt/ejc/.deploy_last_sha ] && LAST_SHA="$(cat /opt/ejc/.deploy_last_sha)" || true
          if [ "$LAST_SHA" = "$TARGET_SHA" ]; then
            echo "SHA $TARGET_SHA já implantado no último deploy bem-sucedido; pulando para evitar retrabalho."
            {
              echo "## Deploy VPS — pulado (idempotência)";
              echo "";
              echo "O commit \`$TARGET_SHA\` já está implantado desde o deploy anterior bem-sucedido. Não há retrabalho a fazer.";
              echo "O marcador fica em \`/opt/ejc/.deploy_last_sha\` na VPS e é atualizado ao final de cada deploy com sucesso.";
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Confirmar SHA e runtime de produção
        shell: bash
        run: |
          set -uo pipefail
          set +e
          erros=0
          reprovar() { echo "::error::Pré-voo do deploy: $1"; erros=1; }

          dono="$(stat -c %u "$GITHUB_WORKSPACE" 2>/dev/null)"
          if [ "$dono" = "$(id -u)" ] || [ "$dono" = "0" ]; then
            if head_local="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD 2>&1)"; then
              [ "$head_local" = "$TARGET_SHA" ] ||
                reprovar "checkout está em '$head_local', esperado '$TARGET_SHA'"
            else
              reprovar "git rev-parse HEAD falhou — $head_local"
            fi
          else
            reprovar "workspace pertence ao uid '${dono:-desconhecido}', nem ao runner nem a root — não confio nele para executar git"
          fi

          [ -d /opt/ejc ] || reprovar "/opt/ejc não existe ou não é diretório"
          [ -f /opt/ejc/.env ] || reprovar "/opt/ejc/.env ausente ou ilegível para o usuário do runner"
          docker ps --format '{{.Names}}' 2>/dev/null | grep -qx ejc_db ||
            reprovar "container ejc_db fora do ar, ou o runner não alcança o socket do Docker"
          command -v python3 >/dev/null || reprovar "python3 ausente no PATH do runner"
          command -v rsync >/dev/null || reprovar "rsync ausente no PATH do runner"
          command -v flock >/dev/null || reprovar "flock ausente no PATH do runner"
          command -v sudo >/dev/null || reprovar "sudo ausente no PATH do runner"
          sudo -n true >/dev/null 2>&1 || reprovar "sudo não está disponível em modo não interativo"
          [ -f scripts/deploy_lock.sh ] || reprovar "scripts/deploy_lock.sh ausente no checkout aprovado"
          [ -f scripts/deploy_workflow_transaction.sh ] || reprovar "scripts/deploy_workflow_transaction.sh ausente no checkout aprovado"

          APP_DIR=/opt/ejc
          activated_marker="$APP_DIR/data/.rag_vigencia_activated_v1"
          env_file="$APP_DIR/.env"
          if sudo test -f "$activated_marker"; then
            total_true="$(sudo grep -c '^RAG_EXIGIR_VIGENCIA_VERIFICADA=' "$env_file" || true)"
            true_count="$(sudo grep -c '^RAG_EXIGIR_VIGENCIA_VERIFICADA=true$' "$env_file" || true)"
            if [ "$total_true" != "1" ] || [ "$true_count" != "1" ]; then
              reprovar "marker de ativação existe, mas o gate de vigência não está canonicamente true; abortando antes de tocar produção"
            fi
          fi

          [ "$erros" -eq 0 ] || exit 1
          echo "Pré-voo aprovado — HEAD $head_local, /opt/ejc e runtime presentes."

      - name: Classificar migrations pendentes
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          current_revisions="$({
            docker exec ejc_db sh -lc \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atq -c "SELECT version_num FROM alembic_version ORDER BY version_num"'
          } | tr -d '\r')"
          revision_count="$(printf '%s\n' "$current_revisions" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$revision_count" -ne 1 ]; then
            echo "::error::Produção deve possuir exatamente uma revisão Alembic; encontradas $revision_count."
            exit 2
          fi
          current_revision="$(printf '%s\n' "$current_revisions" | sed '/^$/d' | head -1)"

          set +e
          python3 scripts/check_migration_compatibility.py \
            --versions-dir backend/alembic/versions \
            --current-revision "$current_revision" \
            --output migration-policy.json
          policy_rc=$?
          set -e
          cat migration-policy.json

          if [ "$policy_rc" -eq 2 ]; then
            echo "::error::Grafo Alembic inválido ou revisão atual desconhecida."
            exit 2
          fi
          if [ "$policy_rc" -eq 1 ]; then
            echo "::error::Migration pendente não é expand-only; deploy automático bloqueado."
            exit 1
          fi

          pending_count="$(python3 -c 'import json; print(json.load(open("migration-policy.json"))["pending_count"])')"
          if [ "$pending_count" -gt 0 ]; then
            echo "run_migrations=1" >> "$GITHUB_OUTPUT"
            echo "backward_compatible=1" >> "$GITHUB_OUTPUT"
          else
            echo "run_migrations=0" >> "$GITHUB_OUTPUT"
            echo "backward_compatible=0" >> "$GITHUB_OUTPUT"
          fi
          echo "current_revision=$current_revision" >> "$GITHUB_OUTPUT"
          echo "pending_count=$pending_count" >> "$GITHUB_OUTPUT"

      - name: Anexar decisão de migration
        uses: actions/upload-artifact@v7
        with:
          name: deploy-migration-policy
          path: migration-policy.json
          if-no-files-found: error
          retention-days: 30

      # ÚNICA seção mutável principal. O mesmo FD/lock cobre o rsync, o .env e
      # todo deploy_vps_safe.sh; concorrência GitHub + manual não se intercalam.
      - name: Sincronizar e implantar sob mutex host-level
        id: sync
        env:
          RUN_MIGRATIONS: ${{ steps.migrations.outputs.run_migrations }}
          MIGRATIONS_BACKWARD_COMPATIBLE: ${{ steps.migrations.outputs.backward_compatible }}
        shell: bash
        run: bash scripts/deploy_workflow_transaction.sh

      - name: Verificação local e pública pós-deploy
        run: |
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          curl -fsS -o /dev/null -w \
            "https://ejc.depaulateixeira.adv.br/api/health → HTTP %{http_code}\n" \
            https://ejc.depaulateixeira.adv.br/api/health

      - name: Smoke test pós-deploy
        run: bash /opt/ejc/scripts/post_deploy_check.sh

      # P0.1 — pré-armamento transicional do gate jurídico de vigência.
      # A mutação do .env adquire o MESMO mutex host-level e confirma primeiro
      # que .deploy_last_sha (registro pós-conclusão do deploy) ainda é o
      # TARGET_SHA desta execução.
      - name: Pré-armar gate de vigência em modo compatível
        shell: bash
        run: |
          set -euo pipefail

          APP_DIR=/opt/ejc
          [ -f "$APP_DIR/scripts/deploy_lock.sh" ] || {
            echo "::error::Prearm RAG: deploy_lock.sh ausente."
            exit 2
          }
          source "$APP_DIR/scripts/deploy_lock.sh"
          lock_rc=0
          ejc_deploy_lock_acquire "$APP_DIR" || lock_rc=$?
          if [ "$lock_rc" -eq 75 ]; then
            echo "::error::Prearm RAG: outro deploy iniciou; mutação pós-deploy foi retida."
            exit 75
          fi
          [ "$lock_rc" -eq 0 ] || {
            echo "::error::Prearm RAG: não foi possível adquirir mutex host-level."
            exit 2
          }

          marker="$APP_DIR/data/.rag_vigencia_prearm_v1"
          activated_marker="$APP_DIR/data/.rag_vigencia_activated_v1"
          env_file="$APP_DIR/.env"
          candidate="$APP_DIR/.env.prearm.new"
          backup="$APP_DIR/.env.prearm.rollback"
          work="$(mktemp)"
          alterado=0
          concluido=0

          finalizar() {
            rc=$?
            trap - EXIT INT TERM
            set +e
            rm -f "$work"
            sudo rm -f "$candidate"
            if [ "$concluido" != "1" ]; then
              if [ "$alterado" = "1" ]; then
                if sudo test -f "$backup"; then
                  echo "::warning::Prearm RAG interrompido; restaurando .env a partir do backup 0600."
                  sudo mv -f "$backup" "$env_file"
                else
                  echo "::error::Prearm RAG interrompido após abrir a janela de alteração, mas backup não está disponível."
                fi
              else
                sudo rm -f "$backup"
              fi
              if sudo test -f "$marker"; then
                marker_sha="$(sudo cat "$marker" 2>/dev/null || true)"
                [ "$marker_sha" != "$TARGET_SHA" ] || sudo rm -f "$marker"
              fi
            else
              sudo rm -f "$backup"
            fi
            exit "$rc"
          }
          trap finalizar EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          deployed="$(sudo cat "$APP_DIR/.deploy_last_sha" 2>/dev/null || true)"
          if [ -z "$deployed" ] || [ "$deployed" != "$TARGET_SHA" ]; then
            echo "::error::Prearm RAG: /opt/ejc não comprova o TARGET_SHA que este Deploy VPS implantou."
            false
          fi

          sudo mkdir -p "$APP_DIR/data"
          sudo test -f "$env_file" || {
            echo "::error::Prearm RAG: .env de produção ausente."
            false
          }

          if sudo test -f "$activated_marker"; then
            total_true="$(sudo grep -c '^RAG_EXIGIR_VIGENCIA_VERIFICADA=' "$env_file" || true)"
            true_count="$(sudo grep -c '^RAG_EXIGIR_VIGENCIA_VERIFICADA=true$' "$env_file" || true)"
            if [ "$total_true" = "1" ] && [ "$true_count" = "1" ]; then
              sudo rm -f "$backup"
              concluido=1
              echo "Gate de vigência já ativado; prearm preservou configuração canônica true."
              exit 0
            fi
            echo "::error::Prearm RAG: marcador de ativação existe, mas .env não está canonicamente true."
            false
          fi

          total="$(sudo grep -c '^RAG_EXIGIR_VIGENCIA_VERIFICADA=' "$env_file" || true)"
          false_count="$(sudo grep -c '^RAG_EXIGIR_VIGENCIA_VERIFICADA=false$' "$env_file" || true)"
          if [ "$total" = "1" ] && [ "$false_count" = "1" ]; then
            sudo rm -f "$backup"
            printf '%s\n' "$TARGET_SHA" | sudo tee "$marker" >/dev/null
            sudo chmod 600 "$marker"
            concluido=1
            echo "Prearm RAG já canônico em false; prova atualizada para o SHA implantado."
            exit 0
          fi

          uid="$(sudo stat -c %u "$env_file")"
          gid="$(sudo stat -c %g "$env_file")"
          mode="$(sudo stat -c %a "$env_file")"

          sudo cat "$env_file" | awk '
            BEGIN { seen = 0 }
            /^RAG_EXIGIR_VIGENCIA_VERIFICADA=/ {
              if (!seen) {
                print "RAG_EXIGIR_VIGENCIA_VERIFICADA=false"
                seen = 1
              }
              next
            }
            { print }
            END {
              if (!seen) print "RAG_EXIGIR_VIGENCIA_VERIFICADA=false"
            }
          ' > "$work"
          chmod 600 "$work"

          sudo rm -f "$candidate" "$backup"
          sudo install -o "$uid" -g "$gid" -m "$mode" "$work" "$candidate"
          candidate_total="$(sudo grep -c '^RAG_EXIGIR_VIGENCIA_VERIFICADA=' "$candidate" || true)"
          candidate_false="$(sudo grep -c '^RAG_EXIGIR_VIGENCIA_VERIFICADA=false$' "$candidate" || true)"
          if [ "$candidate_total" != "1" ] || [ "$candidate_false" != "1" ]; then
            echo "::error::Prearm RAG: candidato não ficou canônico; destino não será tocado."
            false
          fi

          sudo cp -p "$env_file" "$backup"
          sudo chmod 600 "$backup"
          alterado=1
          sudo mv -f "$candidate" "$env_file"

          final_total="$(sudo grep -c '^RAG_EXIGIR_VIGENCIA_VERIFICADA=' "$env_file" || true)"
          final_false="$(sudo grep -c '^RAG_EXIGIR_VIGENCIA_VERIFICADA=false$' "$env_file" || true)"
          if [ "$final_total" != "1" ] || [ "$final_false" != "1" ]; then
            echo "::error::Prearm RAG: validação pós-rename falhou."
            false
          fi

          printf '%s\n' "$TARGET_SHA" | sudo tee "$marker" >/dev/null
          sudo chmod 600 "$marker"
          concluido=1
          echo "Prearm RAG concluído: gate estrito permanece desligado até backfill/ativação."

      - name: Resumo da implantação
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          REVISAO_ANTERIOR: ${{ steps.migrations.outputs.current_revision }}
          MIGRATIONS_PENDENTES: ${{ steps.migrations.outputs.pending_count }}
        run: |
          state_file="$RUNNER_TEMP/ejc-deploy-tx-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.state"
          tx_state="$(cat "$state_file" 2>/dev/null || echo absent)"
          {
            echo "## Deploy VPS"
            echo
            if [ "$JOB_STATUS" = "success" ]; then
              echo "- Resultado: **implantado**"
            elif [ "$tx_state" = "absent" ] || [ "$tx_state" = "pre_sync" ]; then
              echo "- Resultado: **abortado antes de tocar produção** (\`$JOB_STATUS\`)"
              echo "  — nada foi implantado; \`/opt/ejc\` está como estava."
            elif [ "$tx_state" = "sync_started" ]; then
              echo "- Resultado: **ESTADO INCERTO** — a sincronização não concluiu."
              echo "  O \`rsync --delete\` pode ter reescrito ou apagado parte de \`/opt/ejc\`"
              echo "  antes de falhar. **Não presuma que produção está intacta**."
            elif [ "$tx_state" = "sync_completed" ] || [ "$tx_state" = "deploy_completed" ]; then
              echo "- Resultado: **FALHOU APÓS TOCAR PRODUÇÃO** (\`$JOB_STATUS\`)"
              echo "  — \`/opt/ejc\` já foi sincronizado; consulte o log do executor para saber se o rollback de runtime foi acionado."
              echo "  O rollback automático não desfaz o rsync nem migrations já aplicadas."
            else
              echo "- Resultado: **ESTADO DESCONHECIDO** — marcador de fase inválido: \`$tx_state\`."
            fi
            echo "- Fase transacional: \`$tx_state\`"
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Revisão anterior: \`$REVISAO_ANTERIOR\`"
            echo "- Migrations pendentes: \`$MIGRATIONS_PENDENTES\`"
            echo "- Seeds: \`$RUN_SEEDS\`"
            echo "- Backup pré-deploy obrigatório: \`$REQUIRE_PREDEPLOY_BACKUP\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Registrar SHA implantado (após conclusão do deploy)
        if: always() && success()
        shell: bash
        run: |
          mkdir -p /opt/ejc && printf '%s' "$TARGET_SHA" > /opt/ejc/.deploy_last_sha
          rm -f "$state_file"
