# Deploy automático do EJC no runner instalado na própria VPS.
#
# Após a CI de push na main concluir com sucesso, o runner local confere o SHA,
# classifica somente as migrations pendentes, sincroniza o checkout aprovado e
# executa backup → build → migration expand-only → troca → health → rollback.
# Não usa SSH, senha de root, chave privada ou rsync remoto.
name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      run_seeds:
        description: "Reingerir o corpus RAG após o deploy"
        type: boolean
        default: false
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    # A CI da main chega por push (fluxo clássico) ou por workflow_dispatch
    # (redisparo do Auto-integracao após merge automático — o push feito pelo
    # GITHUB_TOKEN não gera evento). O filtro `branches: [main]` do gatilho
    # garante que só corridas da main chegam aqui em ambos os casos.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_run' &&
       contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RUN_SEEDS: ${{ (github.event_name == 'workflow_run' || inputs.run_seeds) && '1' || '0' }}
      REQUIRE_PREDEPLOY_BACKUP: "1"
    steps:
      - name: Checkout exato do commit aprovado
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      # O actions/checkout registra safe.directory num HOME temporário. Em
      # self-hosted runner isso não deve virar confiança global persistente.
      # A exceção é concedida por comando e somente após validar o dono do
      # workspace, evitando reabrir execução de .git/config não confiável.
      - name: Confirmar SHA e runtime de produção
        shell: bash
        run: |
          set -uo pipefail
          set +e
          erros=0
          reprovar() { echo "::error::Pré-voo do deploy: $1"; erros=1; }

          dono="$(stat -c %u "$GITHUB_WORKSPACE" 2>/dev/null)"
          if [ "$dono" = "$(id -u)" ] || [ "$dono" = "0" ]; then
            if head_local="$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD 2>&1)"; then
              [ "$head_local" = "$TARGET_SHA" ] ||
                reprovar "checkout está em '$head_local', esperado '$TARGET_SHA'"
            else
              reprovar "git rev-parse HEAD falhou — $head_local"
            fi
          else
            reprovar "workspace pertence ao uid '${dono:-desconhecido}', nem ao runner nem a root — não confio nele para executar git"
          fi

          [ -d /opt/ejc ] ||
            reprovar "/opt/ejc não existe ou não é diretório"
          [ -f /opt/ejc/.env ] ||
            reprovar "/opt/ejc/.env ausente ou ilegível para o usuário do runner"
          docker ps --format '{{.Names}}' 2>/dev/null | grep -qx ejc_db ||
            reprovar "container ejc_db fora do ar, ou o runner não alcança o socket do Docker"
          command -v python3 >/dev/null ||
            reprovar "python3 ausente no PATH do runner"
          command -v rsync >/dev/null ||
            reprovar "rsync ausente no PATH do runner"

          [ "$erros" -eq 0 ] || exit 1
          echo "Pré-voo aprovado — HEAD $head_local, /opt/ejc e ejc_db presentes."

      - name: Classificar migrations pendentes
        id: migrations
        shell: bash
        run: |
          set -euo pipefail
          current_revisions="$({
            docker exec ejc_db sh -lc \
              'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atq -c "SELECT version_num FROM alembic_version ORDER BY version_num"'
          } | tr -d '\r')"
          revision_count="$(printf '%s\n' "$current_revisions" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$revision_count" -ne 1 ]; then
            echo "::error::Produção deve possuir exatamente uma revisão Alembic; encontradas $revision_count."
            exit 2
          fi
          current_revision="$(printf '%s\n' "$current_revisions" | sed '/^$/d' | head -1)"

          set +e
          python3 scripts/check_migration_compatibility.py \
            --versions-dir backend/alembic/versions \
            --current-revision "$current_revision" \
            --output migration-policy.json
          policy_rc=$?
          set -e
          cat migration-policy.json

          if [ "$policy_rc" -eq 2 ]; then
            echo "::error::Grafo Alembic inválido ou revisão atual desconhecida."
            exit 2
          fi
          if [ "$policy_rc" -eq 1 ]; then
            echo "::error::Migration pendente não é expand-only; deploy automático bloqueado."
            exit 1
          fi

          pending_count="$(python3 -c 'import json; print(json.load(open("migration-policy.json"))["pending_count"])')"
          if [ "$pending_count" -gt 0 ]; then
            echo "run_migrations=1" >> "$GITHUB_OUTPUT"
            echo "backward_compatible=1" >> "$GITHUB_OUTPUT"
          else
            echo "run_migrations=0" >> "$GITHUB_OUTPUT"
            echo "backward_compatible=0" >> "$GITHUB_OUTPUT"
          fi
          echo "current_revision=$current_revision" >> "$GITHUB_OUTPUT"
          echo "pending_count=$pending_count" >> "$GITHUB_OUTPUT"

      - name: Anexar decisão de migration
        uses: actions/upload-artifact@v7
        with:
          name: deploy-migration-policy
          path: migration-policy.json
          if-no-files-found: error
          retention-days: 30

      # A partir deste passo /opt/ejc pode ter sido alterado. O id é usado no
      # resumo para não declarar produção intacta quando o rsync falha no meio.
      - name: Sincronizar checkout aprovado para /opt/ejc
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          sudo rsync -a --delete \
            --exclude '.git/' \
            --exclude '.env' --exclude '.env.*' \
            --exclude '**/.env' --exclude '**/.env.*' \
            --exclude '.deployed_sha' \
            --exclude 'uploads/' --exclude 'backups/' \
            --exclude 'logs/' --exclude 'data/' --exclude 'storage/' \
            --exclude 'secrets/' --exclude 'certs/' --exclude 'tmp/' \
            --exclude 'node_modules/' --exclude 'frontend/node_modules/' \
            --exclude 'frontend/dist/' --exclude 'graphify-out/' \
            --exclude 'vps-tools/' --exclude '*.log' \
            ./ /opt/ejc/

      - name: Restringir acesso ao .env preservado
        shell: bash
        run: |
          set -euo pipefail
          # O deploy precisa ler e eventualmente migrar valores obsoletos do
          # .env. Em vez de torná-lo world-readable (0644), o arquivo fica sob
          # o usuário dedicado do runner e modo 0600. root continua tendo acesso.
          sudo chown "$(id -u):$(id -g)" /opt/ejc/.env
          sudo chmod 600 /opt/ejc/.env
          test "$(stat -c %a /opt/ejc/.env)" = "600"
          test "$(stat -c %u:%g /opt/ejc/.env)" = "$(id -u):$(id -g)"

      - name: Deploy seguro com política calculada
        env:
          RUN_MIGRATIONS: ${{ steps.migrations.outputs.run_migrations }}
          MIGRATIONS_BACKWARD_COMPATIBLE: ${{ steps.migrations.outputs.backward_compatible }}
        shell: bash
        run: |
          cd /opt/ejc
          RUN_MIGRATIONS="$RUN_MIGRATIONS" \
          MIGRATIONS_BACKWARD_COMPATIBLE="$MIGRATIONS_BACKWARD_COMPATIBLE" \
          RUN_SEEDS="$RUN_SEEDS" \
          REQUIRE_PREDEPLOY_BACKUP="$REQUIRE_PREDEPLOY_BACKUP" \
          bash scripts/deploy_vps_safe.sh

      - name: Registrar versão implantada
        run: |
          printf '%s\n' "$TARGET_SHA" | sudo tee /opt/ejc/.deployed_sha >/dev/null
          sudo chmod 644 /opt/ejc/.deployed_sha

      - name: Verificação local e pública pós-deploy
        run: |
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          curl -fsS -o /dev/null -w \
            "https://ejc.depaulateixeira.adv.br/api/health → HTTP %{http_code}\n" \
            https://ejc.depaulateixeira.adv.br/api/health

      - name: Smoke test pós-deploy
        # Frontend + API locais e públicos, endpoint de login, compilação dos
        # módulos críticos. Falha aqui NÃO dispara o rollback do deploy (a troca
        # já foi validada pelo health com SHA); ela reprova o workflow para que
        # a falha fique visível e acionável.
        run: bash /opt/ejc/scripts/post_deploy_check.sh

      - name: Resumo da implantação
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          REVISAO_ANTERIOR: ${{ steps.migrations.outputs.current_revision }}
          MIGRATIONS_PENDENTES: ${{ steps.migrations.outputs.pending_count }}
        run: |
          {
            echo "## Deploy VPS"
            echo
            if [ "$JOB_STATUS" = "success" ]; then
              echo "- Resultado: **implantado**"
            elif [ -z "$SYNC_OUTCOME" ] || [ "$SYNC_OUTCOME" = "skipped" ]; then
              echo "- Resultado: **abortado antes de tocar produção** (\`$JOB_STATUS\`)"
              echo "  — nada foi implantado; \`/opt/ejc\` está como estava."
            elif [ "$SYNC_OUTCOME" = "success" ]; then
              echo "- Resultado: **FALHOU APÓS TOCAR PRODUÇÃO** (\`$JOB_STATUS\`)"
              echo "  — \`/opt/ejc\` já foi reescrito e o deploy pode ter migrado o schema."
              echo "  O rollback automático restaura imagens, **não** a árvore nem o banco."
              echo "  Verifique o estado real antes de reexecutar."
            else
              echo "- Resultado: **ESTADO INCERTO** — a sincronização não concluiu (\`$SYNC_OUTCOME\`)."
              echo "  O \`rsync --delete\` pode ter reescrito ou apagado parte de \`/opt/ejc\`"
              echo "  antes de falhar. **Não presuma que produção está intacta**."
            fi
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Revisão anterior: \`$REVISAO_ANTERIOR\`"
            echo "- Migrations pendentes: \`$MIGRATIONS_PENDENTES\`"
            echo "- Seeds: \`$RUN_SEEDS\`"
            echo "- Backup pré-deploy obrigatório: \`$REQUIRE_PREDEPLOY_BACKUP\`"
          } >> "$GITHUB_STEP_SUMMARY"
