# ── Deploy automático do EJC no VPS ───────────────────────────────────────────
# Disparo: automático, quando o workflow "CI" conclui com SUCESSO na main (ou
# seja, só depois que pytest + typecheck/build passaram no commit que chegou à
# main) — ou manual (workflow_dispatch), a partir de qualquer branch/ref.
# Fluxo: probe de autenticação SSH → sync do código para /opt/ejc via rsync →
# scripts/deploy_vps_safe.sh (backup → build → health-check → rollback em falha).
#
# Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      — IP ou hostname do VPS (obrigatório)
#   VPS_USER      — usuário SSH (obrigatório; ex.: root)
#   VPS_SSH_KEY   — chave PRIVADA OpenSSH (recomendado; tem prioridade)
#   VPS_PASSWORD  — senha SSH (alternativa à chave)
#   VPS_PORT      — opcional (default 22)
#
# Segurança: o rsync NUNCA toca .env, uploads/, backups/ do servidor e não usa
# --delete. Migrations NÃO rodam por padrão (input run_migrations) — inclusive
# no disparo automático, que nunca roda migrations.
name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Rodar migrations Alembic (apenas com migração revisada)"
        type: boolean
        default: false
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  SSHPASS: ${{ secrets.VPS_PASSWORD }}
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_PORT: ${{ secrets.VPS_PORT }}

jobs:
  deploy:
    # No disparo automático (workflow_run), só prossegue se a CI concluiu com
    # sucesso — CI falhou/cancelada nunca deploya. workflow_dispatch sempre roda.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Validar secrets
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          faltando=""
          [ -n "$VPS_HOST" ] || faltando="$faltando VPS_HOST"
          [ -n "$VPS_USER" ] || faltando="$faltando VPS_USER"
          if [ -z "$VPS_SSH_KEY" ] && [ -z "$SSHPASS" ]; then
            faltando="$faltando (VPS_SSH_KEY ou VPS_PASSWORD)"
          fi
          if [ -n "$faltando" ]; then
            echo "::error::Secrets ausentes:$faltando — crie em Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Instalar sshpass e rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Preparar autenticação SSH (chave tem prioridade sobre senha)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            echo "RSH=ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -p ${PORT}" >> "$GITHUB_ENV"
            echo "Autenticação: chave SSH"
          else
            echo "RSH=sshpass -e ssh -o PreferredAuthentications=password,keyboard-interactive -o StrictHostKeyChecking=accept-new -p ${PORT}" >> "$GITHUB_ENV"
            echo "Autenticação: senha (sshpass)"
          fi

      - name: Testar conexão SSH (probe)
        run: |
          if ! ${RSH} "${VPS_USER}@${VPS_HOST}" "echo 'SSH ok:' \$(hostname)"; then
            echo "::error::Autenticação SSH recusada pelo VPS. Verifique: (1) VPS_USER e VPS_PASSWORD exatos — sem espaço ou quebra de linha ao colar o secret; (2) se o sshd do VPS permite senha (PasswordAuthentication yes e PermitRootLogin yes em /etc/ssh/sshd_config) — se o servidor for só-chave, crie o secret VPS_SSH_KEY com a chave privada; (3) VPS_HOST/VPS_PORT corretos."
            exit 1
          fi

      - name: Sincronizar código para /opt/ejc
        run: |
          rsync -az --stats \
            -e "${RSH}" \
            --exclude '.git/' \
            --exclude '.env' --exclude '**/.env' --exclude '*.env' \
            --exclude 'uploads/' --exclude 'backups/' \
            --exclude 'node_modules/' --exclude 'graphify-out/' \
            --exclude 'vps-tools/' \
            ./ "${VPS_USER}@${VPS_HOST}:/opt/ejc/"

      - name: Deploy seguro (backup → build → health-check → rollback em falha)
        env:
          RUN_MIGRATIONS: ${{ inputs.run_migrations && '1' || '0' }}
        run: |
          ${RSH} "${VPS_USER}@${VPS_HOST}" \
            "cd /opt/ejc && RUN_MIGRATIONS=${RUN_MIGRATIONS} bash scripts/deploy_vps_safe.sh"

      - name: Verificação pública pós-deploy
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "https://ejc.depaulateixeira.adv.br/api/health → HTTP %{http_code}\n" \
            https://ejc.depaulateixeira.adv.br/api/health
