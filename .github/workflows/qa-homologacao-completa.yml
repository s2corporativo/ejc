name: QA — Homologação Completa EJC

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-homologacao-completa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homologacao-completa:
    if: github.head_ref == 'qa/ux-render-click-latency-20260729'
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 60
    env:
      EJC_BASE_URL: http://127.0.0.1:8000
      EJC_FRONTEND_URL: http://127.0.0.1:8080
      EJC_ALLOW_PRODUCTION_E2E: "true"
      EJC_HAS_AI: "true"
      EJC_QA_OUT: qa/homologacao/reports
      SCREENSHOT_DIR: frontend/tests/__out__/homologacao-live
      EJC_QA_BROWSER_REPORT: frontend/tests/__out__/homologacao-live/browser_homologacao_report.json
      EJC_AI_REPORT: qa/homologacao/reports/ia_peca_protocolavel_report.json

    steps:
      - uses: actions/checkout@v7

      - name: Gerar credenciais efêmeras da homologação
        shell: bash
        run: |
          set -euo pipefail
          readarray -t VALUES < <(python3 - <<'PY'
          import base64, os, secrets
          run = os.environ.get('GITHUB_RUN_ID', secrets.token_hex(6))
          print(f"homolog.qa.{run}@depaulateixeira.adv.br")
          print("Qa!" + secrets.token_urlsafe(22) + "9")
          print(base64.b32encode(os.urandom(20)).decode().rstrip("="))
          PY
          )
          EMAIL="${VALUES[0]}"
          PASSWORD="${VALUES[1]}"
          TOTP="${VALUES[2]}"
          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$TOTP"
          {
            echo "EJC_TEST_EMAIL=$EMAIL"
            echo "EJC_QA_EMAIL=$EMAIL"
            echo "EJC_TEST_PASSWORD=$PASSWORD"
            echo "EJC_QA_PASSWORD=$PASSWORD"
            echo "EJC_TEST_TOTP_SECRET=$TOTP"
            echo "EJC_QA_TOTP_SECRET=$TOTP"
          } >> "$GITHUB_ENV"

      - name: Verificar stack publicada e commit observado
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          docker inspect -f '{{.State.Health.Status}}' ejc_backend
          docker inspect -f '{{.State.Status}}' ejc_frontend
          curl -fsS --max-time 15 http://127.0.0.1:8000/api/health | tee qa/homologacao/reports/health_producao.json
          curl -fsSI --max-time 15 http://127.0.0.1:8080/login | tee qa/homologacao/reports/frontend_headers.txt

      - name: Criar usuário QA temporário com TOTP
        shell: bash
        run: |
          set -euo pipefail
          docker cp qa/homologacao/temp_prod_qa_user.py ejc_backend:/tmp/temp_prod_qa_user.py
          docker exec \
            -e EJC_QA_EMAIL="$EJC_QA_EMAIL" \
            -e EJC_QA_PASSWORD="$EJC_QA_PASSWORD" \
            -e EJC_QA_TOTP_SECRET="$EJC_QA_TOTP_SECRET" \
            ejc_backend python /tmp/temp_prod_qa_user.py criar

      - name: Instalar dependências leves da homologação API/IA
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preparar cliente HTTP de teste
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check httpx==0.27.2 pyotp==2.9.0

      - name: Executar matriz H01–H15 na API real
        id: api_matrix
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python qa/homologacao/run_homologacao_totp.py 2>&1 | tee qa/homologacao/reports/homologacao_console.txt

      - name: Executar IA jurídica e peça pronta para protocolo
        id: ai_peca
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python qa/homologacao/run_ia_peca_protocolavel.py 2>&1 | tee qa/homologacao/reports/ia_peca_console.txt

      - name: Instalar Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar frontend e Chromium de homologação
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Testar telas renderizadas, cliques e latência percebida
        id: browser
        continue-on-error: true
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          node tests/homologacao-completa-live.mjs 2>&1 | tee ../qa/homologacao/reports/browser_console.txt

      - name: Consolidar resumo auditável
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = {
              "api": Path("qa/homologacao/reports/homologacao_report.json"),
              "ia": Path("qa/homologacao/reports/ia_peca_protocolavel_report.json"),
              "browser": Path("frontend/tests/__out__/homologacao-live/browser_homologacao_report.json"),
              "health": Path("qa/homologacao/reports/health_producao.json"),
          }
          out = {"arquivos": {}, "conclusao": "EXECUTADA"}
          for nome, path in paths.items():
              if path.exists():
                  try:
                      out["arquivos"][nome] = json.loads(path.read_text(encoding="utf-8"))
                  except Exception:
                      out["arquivos"][nome] = {"path": str(path), "texto": path.read_text(encoding="utf-8", errors="replace")[:3000]}
              else:
                  out["arquivos"][nome] = {"ausente": True, "path": str(path)}
                  out["conclusao"] = "INCOMPLETA"
          Path("qa/homologacao/reports/homologacao_completa_consolidada.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          print(json.dumps({
              "api": out["arquivos"].get("api", {}).get("resumo"),
              "ia": out["arquivos"].get("ia", {}).get("resultado"),
              "browser": out["arquivos"].get("browser", {}).get("summary"),
              "conclusao": out["conclusao"],
          }, ensure_ascii=False))
          PY

      - name: Anexar relatórios e evidências visuais
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: homologacao-completa-ejc
          path: |
            qa/homologacao/reports/
            frontend/tests/__out__/homologacao-live/
          if-no-files-found: error
          retention-days: 30

      - name: Limpar massa fictícia e desativar usuário QA
        if: always()
        shell: bash
        run: |
          set +e
          MARKERS=$(python3 - <<'PY'
          import json
          from pathlib import Path
          marks=[]
          for path, key in [
              (Path('qa/homologacao/reports/homologacao_report.json'), 'run_marker'),
              (Path('qa/homologacao/reports/ia_peca_protocolavel_report.json'), 'marker'),
          ]:
              try:
                  value=json.loads(path.read_text(encoding='utf-8')).get(key)
                  if value: marks.append(value)
              except Exception: pass
          print(','.join(marks))
          PY
          )
          docker cp qa/homologacao/cleanup_prod_qa_data.py ejc_backend:/tmp/cleanup_prod_qa_data.py
          if [ -n "$MARKERS" ]; then
            docker exec -e EJC_QA_MARKERS="$MARKERS" ejc_backend python /tmp/cleanup_prod_qa_data.py
          else
            echo "AVISO: sem marcador seguro; limpeza de dados não executada."
          fi
          docker exec -e EJC_QA_EMAIL="$EJC_QA_EMAIL" ejc_backend python /tmp/temp_prod_qa_user.py desativar

      - name: Gate final da homologação
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          failures=[]
          api=Path('qa/homologacao/reports/homologacao_report.json')
          ia=Path('qa/homologacao/reports/ia_peca_protocolavel_report.json')
          browser=Path('frontend/tests/__out__/homologacao-live/browser_homologacao_report.json')
          if not api.exists(): failures.append('relatório H01-H15 ausente')
          else:
              r=json.loads(api.read_text())
              if r.get('resumo',{}).get('FALHA',0): failures.append(f"H01-H15: {r['resumo']['FALHA']} cenário(s) com falha")
          if not ia.exists(): failures.append('relatório IA ausente')
          else:
              r=json.loads(ia.read_text())
              if r.get('resultado') != 'PRONTA_PARA_REVISAO_E_PROTOCOLO': failures.append(f"IA: {r.get('resultado')}")
          if not browser.exists(): failures.append('relatório navegador ausente')
          else:
              r=json.loads(browser.read_text())
              s=r.get('summary',{})
              if s.get('routes_broken',0): failures.append(f"UI: {s['routes_broken']} rota(s) quebrada(s)")
              if s.get('page_errors',0): failures.append(f"UI: {s['page_errors']} erro(s) JS")
              if s.get('responsive_failures',0): failures.append(f"UI: {s['responsive_failures']} falha(s) responsivas")
          if failures:
              print('HOMOLOGAÇÃO REPROVADA/COM RESSALVAS:')
              for f in failures: print(' -', f)
              sys.exit(1)
          print('HOMOLOGAÇÃO APROVADA nos gates automatizados.')
          PY
