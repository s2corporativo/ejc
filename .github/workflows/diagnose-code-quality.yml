name: Normalize EJC Code Quality

on:
  push:
    branches:
      - chore/ejc-10-10-release-governance

permissions:
  contents: write

concurrency:
  group: normalize-code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[quality-normalized]') }}
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ejc-10-10-release-governance

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Corrigir apenas ocorrências Ruff seguras
        shell: bash
        run: |
          python -m pip install --quiet ruff
          cd backend
          python -m ruff check app --fix

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Aplicar Prettier determinístico
        shell: bash
        run: |
          cd frontend
          npm ci --silent
          npm run format

      - name: Atualizar evidências de qualidade
        shell: bash
        run: |
          mkdir -p audit/quality
          set +e
          (cd backend && python -m ruff check app --output-format=concise) > audit/quality/ruff-report.txt 2>&1
          ruff_status=$?
          echo >> audit/quality/ruff-report.txt
          echo "exit_code=${ruff_status}" >> audit/quality/ruff-report.txt
          (cd frontend && npm run format:check) > audit/quality/prettier-report.txt 2>&1
          prettier_status=$?
          echo >> audit/quality/prettier-report.txt
          echo "exit_code=${prettier_status}" >> audit/quality/prettier-report.txt
          exit 0

      - name: Publicar normalização na branch técnica
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend audit/quality
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: normalizar Ruff seguro e Prettier [quality-normalized]"
          git push origin HEAD:chore/ejc-10-10-release-governance
