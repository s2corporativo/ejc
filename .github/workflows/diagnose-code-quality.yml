name: Diagnose EJC Code Quality

on:
  push:
    branches:
      - chore/ejc-10-10-release-governance

permissions:
  contents: write

concurrency:
  group: diagnose-code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[quality-report]') }}
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ejc-10-10-release-governance

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gerar relatório Ruff
        shell: bash
        run: |
          python -m pip install --quiet ruff
          mkdir -p audit/quality
          set +e
          (cd backend && python -m ruff check app --output-format=concise) > audit/quality/ruff-report.txt 2>&1
          status=$?
          echo >> audit/quality/ruff-report.txt
          echo "exit_code=${status}" >> audit/quality/ruff-report.txt
          exit 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Gerar relatório Prettier
        shell: bash
        run: |
          cd frontend
          npm ci --silent
          set +e
          npm run format:check > ../audit/quality/prettier-report.txt 2>&1
          status=$?
          echo >> ../audit/quality/prettier-report.txt
          echo "exit_code=${status}" >> ../audit/quality/prettier-report.txt
          exit 0

      - name: Publicar relatórios na branch técnica
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/quality/ruff-report.txt audit/quality/prettier-report.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(audit): publicar diagnóstico Ruff e Prettier [quality-report]"
          git push origin HEAD:chore/ejc-10-10-release-governance
