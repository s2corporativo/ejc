name: Temporary Integrate Sala Analise V2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'feat/sala-analise-juridica-v2'
    runs-on: [self-hosted, ejc-vps]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sala-analise-juridica-v2
          fetch-depth: 0
      - name: Integrar tela e registro do módulo
        shell: bash
        run: |
          set -euo pipefail
          echo "Integração da Sala de Análise Jurídica iniciada"
          git fetch origin feat/sala-analise-juridica
          git show origin/feat/sala-analise-juridica:frontend/src/pages/SalaAnaliseJuridica.tsx > frontend/src/pages/SalaAnaliseJuridica.tsx
          python - <<'PY'
          from pathlib import Path

          page = Path('frontend/src/pages/SalaAnaliseJuridica.tsx')
          s = page.read_text()
          s = s.replace(
              'import { useCallback, useEffect, useMemo, useRef, useState } from "react";',
              'import { type ReactNode, useCallback, useEffect, useMemo, useRef, useState } from "react";',
          )
          s = s.replace('description="Converse com a IA, anexe provas, confronte versões e transforme a análise validada em caso."', 'subtitle="Converse com a IA, anexe provas, confronte versões e transforme a análise validada em caso."')
          s = s.replace('description="Crie uma sala para iniciar a investigação jurídica."', 'message="Crie uma sala para iniciar a investigação jurídica."')
          s = s.replace('description="A conversa ficará vinculada ao dossiê preliminar e às provas anexadas."', 'message="A conversa ficará vinculada ao dossiê preliminar e às provas anexadas."')
          s = s.replace('<Markdown>{message.content}</Markdown>', '<Markdown source={message.content} />')
          s = s.replace('children: React.ReactNode;', 'children: ReactNode;')
          s = s.replace('nomes_proteger: [],', 'nomes_proteger: selected.potencial_cliente ? [selected.potencial_cliente] : [],')
          page.write_text(s)

          registry = Path('frontend/src/config/moduleRegistry.tsx')
          r = registry.read_text()
          lazy_anchor = 'const RaioXProcesso = lazy(() => import("../pages/RaioXProcesso"));'
          lazy_line = lazy_anchor + '\nconst SalaAnaliseJuridica = lazy(() => import("../pages/SalaAnaliseJuridica"));'
          if 'const SalaAnaliseJuridica =' not in r:
              if lazy_anchor not in r:
                  raise SystemExit('Âncora do lazy import não encontrada')
              r = r.replace(lazy_anchor, lazy_line, 1)

          route_anchor = '  {\n    key: "raio-x-processo",\n    path: "/raio-x",'
          route = '''  {
    key: "sala-analise-juridica",
    path: "/sala-analise",
    label: "Sala de Análise Jurídica",
    description:
      "Conversa jurídica preliminar com provas, contradições, riscos e conversão validada em caso.",
    group: "Pesquisar & IA",
    icon: Sparkles,
    component: SalaAnaliseJuridica,
    roles: ROLES.juridico,
    showInNav: true,
    essential: true,
    order: 5,
    helpKey: "inteligencia",
    usesAI: true,
    sensitive: true,
    backendPrefixes: ["/api/raio-x", "/api/ai"],
  },
'''
          if 'key: "sala-analise-juridica"' not in r:
              if route_anchor not in r:
                  raise SystemExit('Âncora da rota Raio-X não encontrada')
              r = r.replace(route_anchor, route + route_anchor, 1)
          registry.write_text(r)
          PY
          cd frontend
          npm ci
          npx prettier --write src/pages/SalaAnaliseJuridica.tsx src/config/moduleRegistry.tsx
          npm run build
          cd ..
          rm .github/workflows/tmp-integrate-sala-v2.yml
          git config user.name 'EJC Automation'
          git config user.email 'actions@ejc.local'
          git add frontend/src/pages/SalaAnaliseJuridica.tsx frontend/src/config/moduleRegistry.tsx .github/workflows/tmp-integrate-sala-v2.yml
          git commit -m 'feat: adicionar Sala de Análise Jurídica como módulo independente'
          git push origin HEAD:feat/sala-analise-juridica-v2
