name: Recover self-hosted runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-selfhosted-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Recuperar runner ejc-vps via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - name: Validar configuração sem expor segredos
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$VPS_HOST" ] || { echo "::error::Secret VPS_HOST ausente."; exit 2; }
          [ -n "$VPS_USER" ] || { echo "::error::Secret VPS_USER ausente."; exit 2; }
          if [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo "::error::Nenhum método de autenticação SSH configurado (VPS_SSH_KEY ou VPS_PASSWORD)."
            exit 2
          fi
          case "${VPS_PORT:-22}" in
            ''|*[!0-9]*) echo "::error::VPS_PORT inválida."; exit 2 ;;
          esac

      - name: Instalar cliente auxiliar para autenticação por senha
        if: ${{ env.VPS_SSH_KEY == '' && env.VPS_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Preparar SSH efêmero
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ejc_runner_recovery"
          fi
          port="${VPS_PORT:-22}"
          ssh-keyscan -p "$port" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          [ -s "$HOME/.ssh/known_hosts" ] || { echo "::error::Não foi possível obter a host key da VPS."; exit 3; }

      - name: Reiniciar somente o serviço do GitHub Actions runner
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          if [ -n "$VPS_SSH_KEY" ]; then
            ssh \
              -i "$HOME/.ssh/ejc_runner_recovery" \
              -p "$port" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          # Descoberta restrita a /opt: o svc.sh escolhido roda com sudo, então o
          # diretório precisa ser confiável. Aceitar /home/*/ permitiria a qualquer
          # conta local plantar um svc.sh e escalar privilégio pelo workflow.
          # Dono aceitável: root ou a conta de serviço do runner. O instalador
          # (scripts/setup-selfhosted-runner.sh:18,132) cria RUNNER_USER — padrão
          # ghrunner — e faz chown -R do RUNNER_HOME inteiro para ele, svc.sh
          # incluído. Exigir root aqui rejeitaria o runner legítimo.
          runner_user="${RUNNER_USER:-ghrunner}"
          runner_dir=""
          for candidato in /opt/actions-runner*/; do
            [ -d "$candidato" ] || continue
            [ -x "${candidato}svc.sh" ] || continue
            [ -f "${candidato}.runner" ] || continue
            # .service não-vazio = serviço registrado; mesmo critério de
            # scripts/setup-selfhosted-runner.sh. Sem ele, svc.sh start falha.
            [ -s "${candidato}.service" ] || {
              echo "AVISO: ${candidato} sem serviço registrado (.service vazio/ausente) — ignorado." >&2
              continue
            }
            # Fonte autoritativa do dono esperado: a unit systemd registrada em
            # .service, que guarda a conta com que o serviço roda. RUNNER_USER
            # existe só no processo do instalador e não chega aqui pelo SSH, então
            # sozinho ele não serve — fica como fallback junto do padrão do repo.
            svc_nome="$(tr -d '\r\n' < "${candidato}.service" 2>/dev/null || true)"
            svc_user=""
            if [ -n "$svc_nome" ]; then
              svc_user="$(systemctl show -p User --value "$svc_nome" 2>/dev/null || true)"
            fi
            donos_ok=" root ${runner_user} ${svc_user} "
            dono="$(stat -c '%U' "$candidato" 2>/dev/null || echo '?')"
            case "$donos_ok" in
              *" $dono "*) ;;
              *)
                echo "AVISO: ${candidato} pertence a '$dono' (aceitos: root, ${runner_user}${svc_user:+, ${svc_user}}) — ignorado." >&2
                continue
                ;;
            esac
            perm="$(stat -c '%a' "$candidato" 2>/dev/null || echo '')"
            case "${perm: -2:1}${perm: -1:1}" in
              *[2367]*)
                echo "AVISO: ${candidato} com permissão $perm (escrita a grupo/outros) — ignorado." >&2
                continue
                ;;
            esac
            dono_svc="$(stat -c '%U' "${candidato}svc.sh" 2>/dev/null || echo '?')"
            case "$donos_ok" in
              *" $dono_svc "*) ;;
              *)
                echo "AVISO: ${candidato}svc.sh pertence a '$dono_svc' (aceitos: root, ${runner_user}${svc_user:+, ${svc_user}}) — ignorado." >&2
                continue
                ;;
            esac
            perm_svc="$(stat -c '%a' "${candidato}svc.sh" 2>/dev/null || echo '')"
            case "${perm_svc: -2:1}${perm_svc: -1:1}" in
              *[2367]*)
                echo "AVISO: ${candidato}svc.sh com permissão $perm_svc (escrita a grupo/outros) — ignorado." >&2
                continue
                ;;
            esac
            runner_dir="${candidato%/}"
            break
          done
          if [ -z "$runner_dir" ]; then
            echo "ERRO: nenhum runner elegível em /opt/actions-runner*. Exigido: .runner presente, .service não-vazio, svc.sh executável, e diretório e svc.sh de root ou ${runner_user}, sem escrita para grupo/outros." >&2
            ls -ld /opt/actions-runner* 2>/dev/null || true
            exit 4
          fi
          echo "Runner encontrado em: $runner_dir"
          cd "$runner_dir"
          sudo ./svc.sh status || true
          sudo ./svc.sh stop || true
          sudo ./svc.sh start
          sleep 3
          sudo ./svc.sh status
          REMOTE
          else
            SSHPASS="$VPS_PASSWORD" sshpass -e ssh \
              -p "$port" \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          # Descoberta restrita a /opt: o svc.sh escolhido roda com sudo, então o
          # diretório precisa ser confiável. Aceitar /home/*/ permitiria a qualquer
          # conta local plantar um svc.sh e escalar privilégio pelo workflow.
          # Dono aceitável: root ou a conta de serviço do runner. O instalador
          # (scripts/setup-selfhosted-runner.sh:18,132) cria RUNNER_USER — padrão
          # ghrunner — e faz chown -R do RUNNER_HOME inteiro para ele, svc.sh
          # incluído. Exigir root aqui rejeitaria o runner legítimo.
          runner_user="${RUNNER_USER:-ghrunner}"
          runner_dir=""
          for candidato in /opt/actions-runner*/; do
            [ -d "$candidato" ] || continue
            [ -x "${candidato}svc.sh" ] || continue
            [ -f "${candidato}.runner" ] || continue
            # .service não-vazio = serviço registrado; mesmo critério de
            # scripts/setup-selfhosted-runner.sh. Sem ele, svc.sh start falha.
            [ -s "${candidato}.service" ] || {
              echo "AVISO: ${candidato} sem serviço registrado (.service vazio/ausente) — ignorado." >&2
              continue
            }
            # Fonte autoritativa do dono esperado: a unit systemd registrada em
            # .service, que guarda a conta com que o serviço roda. RUNNER_USER
            # existe só no processo do instalador e não chega aqui pelo SSH, então
            # sozinho ele não serve — fica como fallback junto do padrão do repo.
            svc_nome="$(tr -d '\r\n' < "${candidato}.service" 2>/dev/null || true)"
            svc_user=""
            if [ -n "$svc_nome" ]; then
              svc_user="$(systemctl show -p User --value "$svc_nome" 2>/dev/null || true)"
            fi
            donos_ok=" root ${runner_user} ${svc_user} "
            dono="$(stat -c '%U' "$candidato" 2>/dev/null || echo '?')"
            case "$donos_ok" in
              *" $dono "*) ;;
              *)
                echo "AVISO: ${candidato} pertence a '$dono' (aceitos: root, ${runner_user}${svc_user:+, ${svc_user}}) — ignorado." >&2
                continue
                ;;
            esac
            perm="$(stat -c '%a' "$candidato" 2>/dev/null || echo '')"
            case "${perm: -2:1}${perm: -1:1}" in
              *[2367]*)
                echo "AVISO: ${candidato} com permissão $perm (escrita a grupo/outros) — ignorado." >&2
                continue
                ;;
            esac
            dono_svc="$(stat -c '%U' "${candidato}svc.sh" 2>/dev/null || echo '?')"
            case "$donos_ok" in
              *" $dono_svc "*) ;;
              *)
                echo "AVISO: ${candidato}svc.sh pertence a '$dono_svc' (aceitos: root, ${runner_user}${svc_user:+, ${svc_user}}) — ignorado." >&2
                continue
                ;;
            esac
            perm_svc="$(stat -c '%a' "${candidato}svc.sh" 2>/dev/null || echo '')"
            case "${perm_svc: -2:1}${perm_svc: -1:1}" in
              *[2367]*)
                echo "AVISO: ${candidato}svc.sh com permissão $perm_svc (escrita a grupo/outros) — ignorado." >&2
                continue
                ;;
            esac
            runner_dir="${candidato%/}"
            break
          done
          if [ -z "$runner_dir" ]; then
            echo "ERRO: nenhum runner elegível em /opt/actions-runner*. Exigido: .runner presente, .service não-vazio, svc.sh executável, e diretório e svc.sh de root ou ${runner_user}, sem escrita para grupo/outros." >&2
            ls -ld /opt/actions-runner* 2>/dev/null || true
            exit 4
          fi
          echo "Runner encontrado em: $runner_dir"
          cd "$runner_dir"
          sudo ./svc.sh status || true
          sudo ./svc.sh stop || true
          sudo ./svc.sh start
          sleep 3
          sudo ./svc.sh status
          REMOTE
          fi

      - name: Limpar material SSH efêmero
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/ejc_runner_recovery" "$HOME/.ssh/known_hosts"
