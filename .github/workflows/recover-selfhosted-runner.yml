name: Recover self-hosted runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-selfhosted-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Recuperar runner ejc-vps via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - name: Validar configuração sem expor segredos
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$VPS_HOST" ] || { echo "::error::Secret VPS_HOST ausente."; exit 2; }
          [ -n "$VPS_USER" ] || { echo "::error::Secret VPS_USER ausente."; exit 2; }
          if [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo "::error::Nenhum método de autenticação SSH configurado (VPS_SSH_KEY ou VPS_PASSWORD)."
            exit 2
          fi
          case "${VPS_PORT:-22}" in
            ''|*[!0-9]*) echo "::error::VPS_PORT inválida."; exit 2 ;;
          esac

      - name: Instalar cliente auxiliar para autenticação por senha
        if: ${{ env.VPS_SSH_KEY == '' && env.VPS_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Preparar SSH efêmero
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ejc_runner_recovery"
          fi
          port="${VPS_PORT:-22}"
          ssh-keyscan -p "$port" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          [ -s "$HOME/.ssh/known_hosts" ] || { echo "::error::Não foi possível obter a host key da VPS."; exit 3; }

      - name: Reiniciar somente o serviço do GitHub Actions runner
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          if [ -n "$VPS_SSH_KEY" ]; then
            ssh \
              -i "$HOME/.ssh/ejc_runner_recovery" \
              -p "$port" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          runner_dir=""
          for candidato in /opt/actions-runner*/ /home/*/actions-runner*/; do
            [ -x "${candidato}svc.sh" ] && [ -f "${candidato}.runner" ] || continue
            runner_dir="${candidato%/}"
            break
          done
          if [ -z "$runner_dir" ]; then
            echo "ERRO: nenhum runner configurado encontrado em /opt/actions-runner* nem /home/*/actions-runner*." >&2
            ls -1d /opt/actions-runner* 2>/dev/null || true
            exit 4
          fi
          echo "Runner encontrado em: $runner_dir"
          cd "$runner_dir"
          sudo ./svc.sh status || true
          sudo ./svc.sh stop || true
          sudo ./svc.sh start
          sleep 3
          sudo ./svc.sh status
          REMOTE
          else
            SSHPASS="$VPS_PASSWORD" sshpass -e ssh \
              -p "$port" \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          runner_dir=""
          for candidato in /opt/actions-runner*/ /home/*/actions-runner*/; do
            [ -x "${candidato}svc.sh" ] && [ -f "${candidato}.runner" ] || continue
            runner_dir="${candidato%/}"
            break
          done
          if [ -z "$runner_dir" ]; then
            echo "ERRO: nenhum runner configurado encontrado em /opt/actions-runner* nem /home/*/actions-runner*." >&2
            ls -1d /opt/actions-runner* 2>/dev/null || true
            exit 4
          fi
          echo "Runner encontrado em: $runner_dir"
          cd "$runner_dir"
          sudo ./svc.sh status || true
          sudo ./svc.sh stop || true
          sudo ./svc.sh start
          sleep 3
          sudo ./svc.sh status
          REMOTE
          fi

      - name: Limpar material SSH efêmero
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/ejc_runner_recovery" "$HOME/.ssh/known_hosts"
