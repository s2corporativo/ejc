name: Recover self-hosted runner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-selfhosted-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Recuperar runner ejc-vps via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - name: Validar configuração sem expor segredos
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$VPS_HOST" ] || { echo "::error::Secret VPS_HOST ausente."; exit 2; }
          [ -n "$VPS_USER" ] || { echo "::error::Secret VPS_USER ausente."; exit 2; }
          if [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo "::error::Nenhum método de autenticação SSH configurado (VPS_SSH_KEY ou VPS_PASSWORD)."
            exit 2
          fi
          case "${VPS_PORT:-22}" in
            ''|*[!0-9]*) echo "::error::VPS_PORT inválida."; exit 2 ;;
          esac

      - name: Instalar cliente auxiliar para autenticação por senha
        if: ${{ env.VPS_SSH_KEY == '' && env.VPS_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends sshpass >/dev/null

      - name: Preparar SSH efêmero
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          if [ -n "$VPS_SSH_KEY" ]; then
            printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/ejc_runner_recovery"
          fi
          port="${VPS_PORT:-22}"
          ssh-keyscan -p "$port" -H "$VPS_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          [ -s "$HOME/.ssh/known_hosts" ] || { echo "::error::Não foi possível obter a host key da VPS."; exit 3; }

      - name: Reiniciar somente o serviço do GitHub Actions runner
        shell: bash
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          if [ -n "$VPS_SSH_KEY" ]; then
            ssh \
              -i "$HOME/.ssh/ejc_runner_recovery" \
              -p "$port" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          # Confiança vem do diretório-pai, não de nada dentro do candidato.
          # Se /opt é de root e sem escrita para grupo/outros, nenhuma conta comum
          # consegue criar /opt/actions-runner*; logo o dono de um candidato ali foi
          # definido pelo root (o instalador faz chown -R para RUNNER_USER). Assim
          # não é preciso adivinhar a conta nem lê-la de arquivo que o próprio dono
          # controla — ler .service para decidir em quem confiar era circular.
          pai_dono="$(stat -c '%U' /opt 2>/dev/null || echo '?')"
          pai_perm="$(stat -c '%a' /opt 2>/dev/null || echo '')"
          if [ "$pai_dono" != "root" ]; then
            echo "ERRO: /opt pertence a '$pai_dono', não a root — a descoberta de runner não é confiável." >&2
            exit 5
          fi
          case "${pai_perm: -2:1}${pai_perm: -1:1}" in
            *[2367]*)
              echo "ERRO: /opt com permissão $pai_perm (escrita a grupo/outros) — a descoberta de runner não é confiável." >&2
              exit 5
              ;;
          esac
          runner_dir=""
          for candidato in /opt/actions-runner*/; do
            [ -d "$candidato" ] || continue
            [ -L "${candidato%/}" ] && { echo "AVISO: ${candidato} é symlink — ignorado." >&2; continue; }
            [ -x "${candidato}svc.sh" ] || continue
            [ -f "${candidato}.runner" ] || continue
            # .service não-vazio = serviço registrado; mesmo critério de
            # scripts/setup-selfhosted-runner.sh. Sem ele, svc.sh start falha.
            # Usado só como sinal funcional — nunca para decidir confiança.
            [ -s "${candidato}.service" ] || {
              echo "AVISO: ${candidato} sem serviço registrado (.service vazio/ausente) — ignorado." >&2
              continue
            }
            perm="$(stat -c '%a' "$candidato" 2>/dev/null || echo '')"
            case "${perm: -2:1}${perm: -1:1}" in
              *[2367]*)
                echo "AVISO: ${candidato} com permissão $perm (escrita a grupo/outros) — ignorado." >&2
                continue
                ;;
            esac
            perm_svc="$(stat -c '%a' "${candidato}svc.sh" 2>/dev/null || echo '')"
            case "${perm_svc: -2:1}${perm_svc: -1:1}" in
              *[2367]*)
                echo "AVISO: ${candidato}svc.sh com permissão $perm_svc (escrita a grupo/outros) — ignorado." >&2
                continue
                ;;
            esac
            # svc.sh precisa ser do dono do diretório ou de root: impede executar
            # arquivo de terceiro a partir de um diretório legítimo.
            dono="$(stat -c '%U' "$candidato" 2>/dev/null || echo '?')"
            dono_svc="$(stat -c '%U' "${candidato}svc.sh" 2>/dev/null || echo '?')"
            if [ "$dono_svc" != "$dono" ] && [ "$dono_svc" != root ]; then
              echo "AVISO: ${candidato}svc.sh pertence a '$dono_svc', diferente do dono do diretório ('$dono') e de root — ignorado." >&2
              continue
            fi
            runner_dir="${candidato%/}"
            break
          done
          if [ -z "$runner_dir" ]; then
            echo "ERRO: nenhum runner elegível em /opt/actions-runner*. Exigido: diretório real (não symlink), svc.sh executável, .runner presente, .service não-vazio, diretório e svc.sh sem escrita para grupo/outros, e svc.sh do mesmo dono do diretório ou de root." >&2
            ls -ld /opt/actions-runner* 2>/dev/null || true
            exit 4
          fi
          echo "Runner encontrado em: $runner_dir"
          cd "$runner_dir"
          sudo ./svc.sh status || true
          sudo ./svc.sh stop || true
          sudo ./svc.sh start
          sleep 3
          sudo ./svc.sh status
          REMOTE
          else
            SSHPASS="$VPS_PASSWORD" sshpass -e ssh \
              -p "$port" \
              -o PubkeyAuthentication=no \
              -o PreferredAuthentications=password \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          # Confiança vem do diretório-pai, não de nada dentro do candidato.
          # Se /opt é de root e sem escrita para grupo/outros, nenhuma conta comum
          # consegue criar /opt/actions-runner*; logo o dono de um candidato ali foi
          # definido pelo root (o instalador faz chown -R para RUNNER_USER). Assim
          # não é preciso adivinhar a conta nem lê-la de arquivo que o próprio dono
          # controla — ler .service para decidir em quem confiar era circular.
          pai_dono="$(stat -c '%U' /opt 2>/dev/null || echo '?')"
          pai_perm="$(stat -c '%a' /opt 2>/dev/null || echo '')"
          if [ "$pai_dono" != "root" ]; then
            echo "ERRO: /opt pertence a '$pai_dono', não a root — a descoberta de runner não é confiável." >&2
            exit 5
          fi
          case "${pai_perm: -2:1}${pai_perm: -1:1}" in
            *[2367]*)
              echo "ERRO: /opt com permissão $pai_perm (escrita a grupo/outros) — a descoberta de runner não é confiável." >&2
              exit 5
              ;;
          esac
          runner_dir=""
          for candidato in /opt/actions-runner*/; do
            [ -d "$candidato" ] || continue
            [ -L "${candidato%/}" ] && { echo "AVISO: ${candidato} é symlink — ignorado." >&2; continue; }
            [ -x "${candidato}svc.sh" ] || continue
            [ -f "${candidato}.runner" ] || continue
            # .service não-vazio = serviço registrado; mesmo critério de
            # scripts/setup-selfhosted-runner.sh. Sem ele, svc.sh start falha.
            # Usado só como sinal funcional — nunca para decidir confiança.
            [ -s "${candidato}.service" ] || {
              echo "AVISO: ${candidato} sem serviço registrado (.service vazio/ausente) — ignorado." >&2
              continue
            }
            perm="$(stat -c '%a' "$candidato" 2>/dev/null || echo '')"
            case "${perm: -2:1}${perm: -1:1}" in
              *[2367]*)
                echo "AVISO: ${candidato} com permissão $perm (escrita a grupo/outros) — ignorado." >&2
                continue
                ;;
            esac
            perm_svc="$(stat -c '%a' "${candidato}svc.sh" 2>/dev/null || echo '')"
            case "${perm_svc: -2:1}${perm_svc: -1:1}" in
              *[2367]*)
                echo "AVISO: ${candidato}svc.sh com permissão $perm_svc (escrita a grupo/outros) — ignorado." >&2
                continue
                ;;
            esac
            # svc.sh precisa ser do dono do diretório ou de root: impede executar
            # arquivo de terceiro a partir de um diretório legítimo.
            dono="$(stat -c '%U' "$candidato" 2>/dev/null || echo '?')"
            dono_svc="$(stat -c '%U' "${candidato}svc.sh" 2>/dev/null || echo '?')"
            if [ "$dono_svc" != "$dono" ] && [ "$dono_svc" != root ]; then
              echo "AVISO: ${candidato}svc.sh pertence a '$dono_svc', diferente do dono do diretório ('$dono') e de root — ignorado." >&2
              continue
            fi
            runner_dir="${candidato%/}"
            break
          done
          if [ -z "$runner_dir" ]; then
            echo "ERRO: nenhum runner elegível em /opt/actions-runner*. Exigido: diretório real (não symlink), svc.sh executável, .runner presente, .service não-vazio, diretório e svc.sh sem escrita para grupo/outros, e svc.sh do mesmo dono do diretório ou de root." >&2
            ls -ld /opt/actions-runner* 2>/dev/null || true
            exit 4
          fi
          echo "Runner encontrado em: $runner_dir"
          cd "$runner_dir"
          sudo ./svc.sh status || true
          sudo ./svc.sh stop || true
          sudo ./svc.sh start
          sleep 3
          sudo ./svc.sh status
          REMOTE
          fi

      - name: Limpar material SSH efêmero
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/ejc_runner_recovery" "$HOME/.ssh/known_hosts"
