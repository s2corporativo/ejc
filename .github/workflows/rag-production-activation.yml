# EJC — validação e ativação manual, auditável e reversível do RAG semântico.
# Governança e critérios de aceite: Issue #563.
name: RAG semântico — validar e ativar

on:
  pull_request:
    paths:
      - "scripts/rag/ativar_embeddings.sh"
      - "scripts/rag/provar_ativacao.py"
      - "scripts/tests/test_rag_activation.sh"
      - "docker-compose.yml"
      - ".github/workflows/rag-production-activation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'deploy-vps' || format('rag-validation-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validar:
    name: Validar ativação, idempotência e rollback
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validar contrato determinístico
        run: bash scripts/tests/test_rag_activation.sh

  ativar-producao:
    name: Ativar RAG semântico na VPS
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    needs: validar
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 180
    environment: production
    steps:
      - name: Checkout exato do SHA acionado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fixar SHA e provar que continua sendo a main atual
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$target_sha"
          test "$target_sha" = "${{ github.sha }}"
          test "$target_sha" = "$remote_main"
          printf 'TARGET_SHA=%s\n' "$target_sha" >> "$GITHUB_ENV"

      - name: Confirmar runtime e código implantado
        shell: bash
        run: |
          set -euo pipefail
          test -d /opt/ejc
          test -f /opt/ejc/.env
          test -f /opt/ejc/.deployed_sha
          test "$(tr -d '\r\n' < /opt/ejc/.deployed_sha)" = "$TARGET_SHA"
          docker ps --format '{{.Names}}' | grep -qx ejc_backend
          docker ps --format '{{.Names}}' | grep -qx ejc_worker
          cd /opt/ejc
          docker compose config --quiet

          python3 - "$TARGET_SHA" <<'PY'
          import json
          import subprocess
          import sys
          import urllib.request

          expected = sys.argv[1]
          local = json.loads(subprocess.check_output(
              ["curl", "-fsS", "http://127.0.0.1:8000/api/health"],
              text=True,
          ))
          with urllib.request.urlopen(
              "https://ejc.depaulateixeira.adv.br/api/health", timeout=15
          ) as response:
              public = json.load(response)
          if local.get("commit") != expected or public.get("commit") != expected:
              raise SystemExit("health local/público não confirma o SHA implantado")
          PY

      - name: Confirmar equivalência byte a byte com o código implantado
        shell: bash
        run: |
          set -euo pipefail
          cmp -s scripts/rag/ativar_embeddings.sh /opt/ejc/scripts/rag/ativar_embeddings.sh
          cmp -s scripts/rag/provar_ativacao.py /opt/ejc/scripts/rag/provar_ativacao.py
          cmp -s scripts/tests/test_rag_activation.sh /opt/ejc/scripts/tests/test_rag_activation.sh
          cmp -s docker-compose.yml /opt/ejc/docker-compose.yml

      - name: Ativar e comprovar RAG semântico
        env:
          RAG_REPORT_PATH: ${{ github.workspace }}/rag-activation.json
          RAG_CANARY_DOCS: "5"
          PUBLIC_HEALTH_URL: https://ejc.depaulateixeira.adv.br/api/health
        shell: bash
        run: |
          cd /opt/ejc
          RAG_REPORT_PATH="$RAG_REPORT_PATH" \
          RAG_CANARY_DOCS="$RAG_CANARY_DOCS" \
          EXPECTED_GIT_SHA="$TARGET_SHA" \
          PUBLIC_HEALTH_URL="$PUBLIC_HEALTH_URL" \
          bash scripts/rag/ativar_embeddings.sh

      - name: Anexar evidência agregada sem PII
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rag-production-activation
          path: rag-activation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Revalidar SHA local e público
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TARGET_SHA" <<'PY'
          import json
          import subprocess
          import sys
          import urllib.request

          expected = sys.argv[1]
          local = json.loads(subprocess.check_output(
              ["curl", "-fsS", "http://127.0.0.1:8000/api/health"],
              text=True,
          ))
          with urllib.request.urlopen(
              "https://ejc.depaulateixeira.adv.br/api/health", timeout=15
          ) as response:
              public = json.load(response)
          if local.get("commit") != expected or public.get("commit") != expected:
              raise SystemExit("SHA divergiu após a ativação")
          PY

      - name: Resumir ativação
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("rag-activation.json")
          print("## Ativação controlada do RAG")
          print()
          if not path.exists():
              print("- Resultado: `sem artefato; consulte os logs do job`")
              raise SystemExit(0)
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              print("- Resultado: `artefato inválido; consulte os logs do job`")
              raise SystemExit(0)
          print(f"- Resultado: `{'ok' if data.get('ok') else 'falha'}`")
          print(f"- SHA: `{data.get('target_sha') or 'indisponível'}`")
          print(f"- Idempotente: `{bool(data.get('idempotente'))}`")
          print(f"- Ambiente mutado: `{bool(data.get('env_mutado'))}`")
          print(f"- Provider: `{data.get('EMBEDDINGS_PROVIDER', 'indisponível')}`")
          print(f"- Dimensão: `{data.get('embedding_dim_configurada', 'indisponível')}`")
          print(f"- Chunks vigentes vetorizados: `{data.get('knowledge_chunks_vigentes_com_embedding', 'indisponível')}`")
          print(f"- Chunks vigentes pendentes: `{data.get('knowledge_chunks_vigentes_pendentes', 'indisponível')}`")
          print(f"- Rollback executado: `{bool(data.get('rollback_executado'))}`")
          print(f"- Rollback comprovado: `{data.get('rollback_ok')}`")
          PY

  # BEGIN TEMPORARY SELF-REPAIR — removido pelo próprio job no commit funcional.
  reparar-achados-p1:
    name: Corrigir achados P1 da revisão
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/563-rag-activation-controlled-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/563-rag-activation-controlled-v2
          fetch-depth: 0

      - name: Aplicar correções fail-closed e remover reparador transitório
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          activate = Path('scripts/rag/ativar_embeddings.sh')
          src = activate.read_text(encoding='utf-8')
          if 'cleanup_tmp_dir()' not in src:
              anchor = 'TMP_DIR="$(mktemp -d)"\n'
              helper = '''TMP_DIR="$(mktemp -d)"
cleanup_tmp_dir() {
  python3 - "$TMP_DIR" <<'PY_CLEANUP'
from pathlib import Path
import sys

path = Path(sys.argv[1])
if path.parent != Path("/tmp") or not path.name.startswith("tmp."):
    raise SystemExit("diretório temporário fora do escopo permitido")
for child in path.iterdir():
    if child.is_file() or child.is_symlink():
        child.unlink()
    else:
        raise SystemExit("conteúdo inesperado no diretório temporário")
path.rmdir()
PY_CLEANUP
}
'''
              if src.count(anchor) != 1:
                  raise SystemExit('âncora TMP_DIR inválida')
              src = src.replace(anchor, helper, 1)
          src = src.replace('rm -rf "$TMP_DIR"', 'cleanup_tmp_dir')

          old_recreate = '''log "recriando backend e worker com a configuração efetiva..."
"${DC[@]}" up -d --force-recreate --no-deps backend worker
wait_backend || die "backend não ficou saudável após a ativação."
wait_worker || die "worker não ficou saudável após a ativação."
assert_runtime_enabled "$APP_CONTAINER" true "$RUNTIME_BACKEND_JSON" || \\
  die "backend não carregou EMBEDDINGS_ENABLED=true."
assert_runtime_enabled "$WORKER_CONTAINER" true "$RUNTIME_WORKER_JSON" || \\
  die "worker não carregou EMBEDDINGS_ENABLED=true."
'''
          new_recreate = '''log "recriando backend e worker com scheduler pausado para o canário..."
CANARY_OVERRIDE_FILE="$TMP_DIR/rag-canary.override.yml"
cat > "$CANARY_OVERRIDE_FILE" <<'YAML'
services:
  backend:
    environment:
      ENABLE_SCHEDULER: "false"
      RAG_AUTO_REEMBED_ENABLED: "false"
YAML
"${DC[@]}" -f docker-compose.yml -f "$CANARY_OVERRIDE_FILE" \\
  up -d --force-recreate --no-deps backend worker
wait_backend || die "backend não ficou saudável após a ativação."
wait_worker || die "worker não ficou saudável após a ativação."
assert_runtime_enabled "$APP_CONTAINER" true "$RUNTIME_BACKEND_JSON" || \\
  die "backend não carregou EMBEDDINGS_ENABLED=true."
assert_runtime_enabled "$WORKER_CONTAINER" true "$RUNTIME_WORKER_JSON" || \\
  die "worker não carregou EMBEDDINGS_ENABLED=true."
'''
          if old_recreate not in src:
              raise SystemExit('bloco de recreate não encontrado')
          src = src.replace(old_recreate, new_recreate, 1)

          old_proof = '''log "comprovando corpus vigente, pgvector, busca semântica e continuidade..."
capture_probe "$PROOF_JSON_FILE" "$APP_CONTAINER" proof 0 || \\
  die "prova final do RAG semântico falhou."
assert_health_commit "http://127.0.0.1:8000/api/health" "$EXPECTED_GIT_SHA" || \\
  die "health local perdeu a correspondência com o SHA esperado."
'''
          new_proof = '''log "comprovando o canário e a busca governada antes de liberar o scheduler..."
capture_probe "$PROOF_JSON_FILE" "$APP_CONTAINER" proof 0 \\
  --allow-paused-scheduler || die "prova semântica do canário falhou."

log "restaurando scheduler e auto-reembed somente após a prova limitada..."
"${DC[@]}" up -d --force-recreate --no-deps backend worker
wait_backend || die "backend não ficou saudável ao restaurar o scheduler."
wait_worker || die "worker não ficou saudável ao restaurar o scheduler."
assert_runtime_enabled "$APP_CONTAINER" true "$RUNTIME_BACKEND_JSON" || \\
  die "backend perdeu EMBEDDINGS_ENABLED=true ao restaurar o scheduler."
assert_runtime_enabled "$WORKER_CONTAINER" true "$RUNTIME_WORKER_JSON" || \\
  die "worker perdeu EMBEDDINGS_ENABLED=true ao restaurar o scheduler."
capture_probe "$PROOF_JSON_FILE" "$APP_CONTAINER" proof 0 || \\
  die "prova final de continuidade do RAG semântico falhou."
assert_health_commit "http://127.0.0.1:8000/api/health" "$EXPECTED_GIT_SHA" || \\
  die "health local perdeu a correspondência com o SHA esperado."
'''
          if old_proof not in src:
              raise SystemExit('bloco de prova não encontrado')
          src = src.replace(old_proof, new_proof, 1)
          activate.write_text(src, encoding='utf-8')

          probe = Path('scripts/rag/provar_ativacao.py')
          py = probe.read_text(encoding='utf-8')
          start = py.index('async def _probe_semantic_search(')
          end = py.index('\n\nasync def runtime()', start)
          governed = '''async def _probe_semantic_search() -> bool:
    """Exercita a mesma elegibilidade fail-closed usada na recuperação real."""
    from app.core.database import AsyncSessionLocal
    from app.services import ai_service as ai
    from app.services.embedding_service import gerar_embeddings

    params = {
        "restr_cats": ai._RESTRICTED_CATS,
        "scope_cli": "",
        "incl_hist": False,
    }
    filters = ai._filtros_gate_rag(False)
    async with AsyncSessionLocal() as db:
        source = (
            await db.execute(
                text(
                    f"SELECT kc.conteudo FROM knowledge_chunks kc "
                    f"JOIN knowledge_docs kd ON kd.id = kc.doc_id "
                    f"WHERE kd.deleted_at IS NULL AND kc.embedding IS NOT NULL "
                    f"{ai._FILTRO_ESCOPO_RAG} {ai._FILTRO_VIGENTE_RAG} {filters} "
                    f"ORDER BY kc.id LIMIT 1"
                ),
                params,
            )
        ).scalar_one_or_none()
        if source is None:
            return False

        vectors = await gerar_embeddings([source], modo="query")
        if not vectors or len(vectors) != 1 or len(vectors[0]) != EXPECTED_DIM:
            return False
        literal = _vector_literal([float(value) for value in vectors[0]])
        result = (
            await db.execute(
                text(
                    f"SELECT 1 FROM knowledge_chunks kc "
                    f"JOIN knowledge_docs kd ON kd.id = kc.doc_id "
                    f"WHERE kd.deleted_at IS NULL AND kc.embedding IS NOT NULL "
                    f"AND (kc.embedding <=> CAST(:vector AS vector(1024))) <= :max_dist "
                    f"{ai._FILTRO_ESCOPO_RAG} {ai._FILTRO_VIGENTE_RAG} {filters} "
                    f"ORDER BY kc.embedding <=> CAST(:vector AS vector(1024)) LIMIT 1"
                ),
                {**params, "vector": literal, "max_dist": ai._rag_max_dist()},
            )
        ).first()
    return result is not None
'''
          py = py[:start] + governed + py[end:]

          old_select = '''                            "SELECT kd.id "
                            "FROM knowledge_docs kd "
                            "WHERE kd.deleted_at IS NULL AND kd.vigente = true "
                            "AND EXISTS ("
                            "  SELECT 1 FROM knowledge_chunks kc "
                            "  WHERE kc.doc_id = kd.id AND kc.embedding IS NULL"
                            ") "
                            "ORDER BY kd.id "
                            "LIMIT :limit "
                            "FOR UPDATE OF kd SKIP LOCKED"
                        ),
                        {"limit": max_docs},
'''
          new_select = '''                            f"SELECT kd.id FROM knowledge_docs kd "
                            f"WHERE kd.deleted_at IS NULL "
                            f"AND EXISTS (SELECT 1 FROM knowledge_chunks kc "
                            f"WHERE kc.doc_id = kd.id AND kc.embedding IS NULL) "
                            f"{ai._FILTRO_ESCOPO_RAG} {ai._FILTRO_VIGENTE_RAG} "
                            f"{ai._filtros_gate_rag(False)} "
                            f"ORDER BY kd.id LIMIT :limit FOR UPDATE OF kd SKIP LOCKED"
                        ),
                        {
                            "limit": max_docs,
                            "restr_cats": ai._RESTRICTED_CATS,
                            "scope_cli": "",
                            "incl_hist": False,
                        },
'''
          if old_select not in py:
              raise SystemExit('seleção canário não encontrada')
          py = py.replace(old_select, new_select, 1)
          py = py.replace(
              '    from scripts.reembedar_chunks_orfaos import _reembedar_doc\n',
              '    from scripts.reembedar_chunks_orfaos import _reembedar_doc\n    from app.services import ai_service as ai\n',
              1,
          )
          py = py.replace('async def proof() -> int:', 'async def proof(allow_paused_scheduler: bool = False) -> int:', 1)
          py = py.replace(
              '    if pending and not (\n        data["ENABLE_SCHEDULER"] and data["RAG_AUTO_REEMBED_ENABLED"]\n    ):',
              '    data["scheduler_pausado_para_canario"] = bool(allow_paused_scheduler)\n    if pending and not allow_paused_scheduler and not (\n        data["ENABLE_SCHEDULER"] and data["RAG_AUTO_REEMBED_ENABLED"]\n    ):',
              1,
          )
          py = py.replace(
              '            data["probe_busca_semantica_ok"] = await _probe_semantic_search(vector)',
              '            data["probe_busca_semantica_ok"] = await _probe_semantic_search()',
              1,
          )
          py = py.replace(
              '    subparsers.add_parser("proof")',
              '    proof_parser = subparsers.add_parser("proof")\n    proof_parser.add_argument("--allow-paused-scheduler", action="store_true")',
              1,
          )
          py = py.replace(
              '    return asyncio.run(proof())',
              '    return asyncio.run(proof(args.allow_paused_scheduler))',
              1,
          )
          probe.write_text(py, encoding='utf-8')

          tests = Path('scripts/tests/test_rag_activation.sh')
          test = tests.read_text(encoding='utf-8')
          test = test.replace("trap 'rm -rf \"$TMP\"' EXIT", "trap 'find \"$TMP\" -depth -delete' EXIT")
          test = test.replace("assert_file_contains \"$PROBE\" '_probe_semantic_search'", "assert_file_contains \"$PROBE\" '_probe_semantic_search'\nassert_file_contains \"$PROBE\" '_filtros_gate_rag'\nassert_file_contains \"$ACTIVATE\" '--allow-paused-scheduler'\n! grep -Fq 'rm -rf' \"$ACTIVATE\"")
          old_mock = '''if [ "${1:-}" = "compose" ]; then
  case "${2:-}" in
    version|config) exit 0 ;;
    up)
      printf 'up\\n' >> "$state/compose-up"
      exit 0
      ;;
  esac
fi'''
          new_mock = '''if [ "${1:-}" = "compose" ]; then
  for arg in "$@"; do
    case "$arg" in
      version|config) exit 0 ;;
      up)
        printf 'up\\n' >> "$state/compose-up"
        exit 0
        ;;
    esac
  done
fi'''
          if old_mock not in test:
              raise SystemExit('mock compose não encontrado')
          test = test.replace(old_mock, new_mock, 1)
          test = test.replace('[ "$(wc -l < "$success_app/state/compose-up")" -eq 1 ]', '[ "$(wc -l < "$success_app/state/compose-up")" -eq 2 ]', 1)
          tests.write_text(test, encoding='utf-8')

          workflow = Path('.github/workflows/rag-production-activation.yml')
          wf = workflow.read_text(encoding='utf-8')
          marker = '\n  # BEGIN TEMPORARY SELF-REPAIR'
          if marker not in wf:
              raise SystemExit('marcador do reparador ausente')
          wf = wf.split(marker, 1)[0].rstrip() + '\n'
          wf = wf.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          workflow.write_text(wf, encoding='utf-8')
          PY

          bash -n scripts/rag/ativar_embeddings.sh
          python3 -m py_compile scripts/rag/provar_ativacao.py
          bash scripts/tests/test_rag_activation.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rag-production-activation.yml scripts/rag/ativar_embeddings.sh scripts/rag/provar_ativacao.py scripts/tests/test_rag_activation.sh
          git commit -m 'fix(rag): close scheduler, SHA and governed retrieval gaps'
          git push origin HEAD:fix/563-rag-activation-controlled-v2
  # END TEMPORARY SELF-REPAIR
