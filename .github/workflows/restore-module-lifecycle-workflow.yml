name: Restore Module Lifecycle Workflow

on:
  push:
    branches:
      - feat/module-lifecycle-flags

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/module-lifecycle-flags
          fetch-depth: 0
      - name: Restore read-only frontend gate and remove this workflow
        run: |
          set -euo pipefail
          cat > .github/workflows/frontend-ci.yml <<'YAML'
          name: Frontend CI

          on:
            pull_request:
              paths:
                - "frontend/**"
                - ".github/workflows/frontend-ci.yml"
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: frontend-ci-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            validate:
              name: Typecheck, build and tests
              runs-on: ubuntu-latest
              timeout-minutes: 15
              defaults:
                run:
                  working-directory: frontend

              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json

                - name: Install dependencies
                  run: npm ci

                - name: Typecheck and build
                  run: npm run build

                - name: Unit tests
                  run: npm test
          YAML
          rm .github/workflows/restore-module-lifecycle-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/frontend-ci.yml .github/workflows/restore-module-lifecycle-workflow.yml
          git commit -m "ci: restaura gate somente leitura"
          git push origin HEAD:feat/module-lifecycle-flags
