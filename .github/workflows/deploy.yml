name: Deploy VPS

# Deploy via Git: o runner do GitHub faz SSH na VPS (Contabo) e atualiza a stack.
# Dispara manualmente (workflow_dispatch) — inclusive via API/assistente — ou ao
# fazer push nesta branch de deploy. Requer os secrets do repositório (abaixo).
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   VPS_HOST     IP ou domínio da VPS (ex.: 203.0.113.10)
#   VPS_USER     usuário SSH (ex.: root ou deploy)
#   VPS_SSH_KEY  chave PRIVADA SSH (conteúdo do arquivo id_ed25519) com acesso à VPS
#   VPS_PORT     (opcional) porta SSH — default 22
#   VPS_PATH     (opcional) caminho do repo na VPS — default ~/ejc
#
# Pré-requisito na VPS (uma única vez): Docker + Compose instalados e o .env
# criado (rode `bash scripts/deploy-vps.sh` no 1º deploy para gerar o .env com
# os segredos). Depois disto, cada disparo deste workflow atualiza a stack.

on:
  workflow_dispatch:
  push:
    branches: [claude/ejc-design-overhaul-2t4pb1]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'scripts/deploy-vps.sh'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            REPO_URL="https://github.com/${{ github.repository }}.git"
            BRANCH="claude/ejc-design-overhaul-2t4pb1"
            DIR="${{ secrets.VPS_PATH }}"
            DIR="${DIR:-$HOME/ejc}"

            if [ ! -d "$DIR/.git" ]; then
              echo "== Clonando o repositório em $DIR =="
              git clone "$REPO_URL" "$DIR"
            fi
            cd "$DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if [ ! -f .env ]; then
              echo "ERRO: .env não existe em $DIR."
              echo "Rode UMA vez na VPS: bash scripts/deploy-vps.sh (cria o .env com segredos e faz o 1º up)."
              exit 1
            fi

            echo "== docker compose up -d --build =="
            docker compose up -d --build
            docker compose ps
