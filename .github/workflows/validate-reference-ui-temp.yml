name: Validate Reference UI (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-reference-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting of reference UI changes only
        run: >-
          npx prettier --check
          src/components/LayoutReference.tsx
          src/components/SidebarWeekCalendar.tsx
          src/pages/DashboardUltra.tsx
          src/pages/DashboardUltra.test.tsx
          src/pages/AssistenteIA.tsx
          src/App.tsx
          src/main.tsx
          src/styles/ejc-reference-2026.css

      - name: Dashboard regression tests
        run: npx vitest run src/pages/DashboardUltra.test.tsx src/pages/Dashboard.test.tsx

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npx vite build

      - name: Dependency audit
        run: npm audit --audit-level=high
