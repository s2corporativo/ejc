name: Validate Reference UI (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-reference-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Node 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format reference UI changes
        run: >-
          npx prettier --write
          src/components/LayoutReference.tsx
          src/components/SidebarWeekCalendar.tsx
          src/pages/DashboardUltra.tsx
          src/pages/DashboardUltra.test.tsx
          src/pages/AssistenteIA.tsx
          src/App.tsx
          src/main.tsx
          src/styles/ejc-reference-2026.css

      - name: Commit formatting if needed
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/components/LayoutReference.tsx \
            frontend/src/components/SidebarWeekCalendar.tsx \
            frontend/src/pages/DashboardUltra.tsx \
            frontend/src/pages/DashboardUltra.test.tsx \
            frontend/src/pages/AssistenteIA.tsx \
            frontend/src/App.tsx \
            frontend/src/main.tsx \
            frontend/src/styles/ejc-reference-2026.css
          if git diff --cached --quiet; then
            echo "Reference UI files already formatted."
          else
            git commit -m "style(frontend): formatar arquivos do redesign de referência"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Check formatting of reference UI changes only
        run: >-
          npx prettier --check
          src/components/LayoutReference.tsx
          src/components/SidebarWeekCalendar.tsx
          src/pages/DashboardUltra.tsx
          src/pages/DashboardUltra.test.tsx
          src/pages/AssistenteIA.tsx
          src/App.tsx
          src/main.tsx
          src/styles/ejc-reference-2026.css

      - name: Dashboard regression tests
        run: npx vitest run src/pages/DashboardUltra.test.tsx src/pages/Dashboard.test.tsx

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npx vite build

      - name: Dependency audit
        run: npm audit --audit-level=high
