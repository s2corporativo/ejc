name: Apply Temporary 2FA Disable On PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/apply-temporary-2fa-disable-on-pr.yml
      - backend/app/core/config.py
      - backend/app/core/auth_middleware.py
      - backend/app/routers/auth.py
      - backend/tests/test_2fa_temporarily_disabled.py
      - docs/SECURITY_2FA_TEMPORARY_DISABLE.md
      - .env.example

permissions:
  contents: write

concurrency:
  group: apply-temporary-2fa-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/apply-temporary-2fa-disable-20260722'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Configure Git identity
        run: |
          git config user.name "EJC Engineering Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Apply reversible kill switch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "TWO_FACTOR_AUTH_ENABLED" backend/app/core/config.py; then
            echo "Kill switch já aplicado; nenhuma nova alteração necessária."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Esperado exatamente um trecho em {path}; encontrado: {count}"
                  )
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "backend/app/core/config.py",
              '    REQUIRE_2FA_ROLES: str = "superadmin,admin,socio"\n'
              '    TWO_FACTOR_SETUP_TOKEN_EXPIRE_MINUTES: int = 15\n\n'
              '    @property\n'
              '    def require_2fa_roles_list(self) -> List[str]:\n'
              '        return [r.strip().lower() for r in self.REQUIRE_2FA_ROLES.split(",") if r.strip()]\n',
              '    # Kill switch temporário e reversível. False desativa tanto a exigência\n'
              '    # por papel quanto a validação TOTP no login, sem apagar segredos.\n'
              '    TWO_FACTOR_AUTH_ENABLED: bool = False\n'
              '    REQUIRE_2FA_ROLES: str = "superadmin,admin,socio"\n'
              '    TWO_FACTOR_SETUP_TOKEN_EXPIRE_MINUTES: int = 15\n\n'
              '    @property\n'
              '    def require_2fa_roles_list(self) -> List[str]:\n'
              '        if not self.TWO_FACTOR_AUTH_ENABLED:\n'
              '            return []\n'
              '        return [r.strip().lower() for r in self.REQUIRE_2FA_ROLES.split(",") if r.strip()]\n',
          )
          replace_once(
              "backend/app/routers/auth.py",
              '    if not role_value:\n'
              '        return False\n'
              '    return role_value.strip().lower() in settings.require_2fa_roles_list\n',
              '    if not settings.TWO_FACTOR_AUTH_ENABLED or not role_value:\n'
              '        return False\n'
              '    return role_value.strip().lower() in settings.require_2fa_roles_list\n',
          )
          replace_once(
              "backend/app/routers/auth.py",
              '    # ── 3. TOTP (se habilitado) ──────────────────────────────────────\n'
              '    if user.totp_enabled:\n',
              '    # ── 3. TOTP (se habilitado globalmente e pelo usuário) ───────────\n'
              '    if settings.TWO_FACTOR_AUTH_ENABLED and user.totp_enabled:\n',
          )
          replace_once(
              "backend/app/core/auth_middleware.py",
              '        if payload.get("two_factor_setup_required") and not payload.get(\n'
              '            "pwd_change_required"\n'
              '        ):\n',
              '        if (\n'
              '            settings.TWO_FACTOR_AUTH_ENABLED\n'
              '            and payload.get("two_factor_setup_required")\n'
              '            and not payload.get("pwd_change_required")\n'
              '        ):\n',
          )
          replace_once(
              ".env.example",
              'ACCESS_TOKEN_EXPIRE_HOURS=2\n',
              'ACCESS_TOKEN_EXPIRE_HOURS=2\n'
              '# 2FA temporariamente desativado; reativação por flag, sem apagar segredos.\n'
              'TWO_FACTOR_AUTH_ENABLED=false\n'
              'REQUIRE_2FA_ROLES=superadmin,admin,socio\n',
          )

          Path("backend/tests/test_2fa_temporarily_disabled.py").write_text(
              '''"""Regressão do kill switch temporário de 2FA."""

from app.core.config import Settings
from app.routers import auth


def test_2fa_desativado_por_default():
    cfg = Settings(_env_file=None)
    assert cfg.TWO_FACTOR_AUTH_ENABLED is False
    assert cfg.require_2fa_roles_list == []


def test_papel_nao_exige_2fa_quando_kill_switch_desligado(monkeypatch):
    cfg = Settings(
        _env_file=None,
        TWO_FACTOR_AUTH_ENABLED=False,
        REQUIRE_2FA_ROLES="superadmin,admin,socio",
    )
    monkeypatch.setattr(auth, "settings", cfg)
    assert auth._papel_exige_2fa("superadmin") is False


def test_reativacao_preserva_politica_por_papel(monkeypatch):
    cfg = Settings(
        _env_file=None,
        TWO_FACTOR_AUTH_ENABLED=True,
        REQUIRE_2FA_ROLES="superadmin,socio",
    )
    monkeypatch.setattr(auth, "settings", cfg)
    assert auth._papel_exige_2fa("superadmin") is True
    assert auth._papel_exige_2fa("advogado") is False
''',
              encoding="utf-8",
          )

          Path("docs/SECURITY_2FA_TEMPORARY_DISABLE.md").write_text(
              '''# Desativação temporária do 2FA

## Estado

O 2FA é controlado por `TWO_FACTOR_AUTH_ENABLED`. Enquanto a flag estiver
`false`, o login não exige código TOTP, os papéis internos não são direcionados
à configuração obrigatória e o middleware não limita a sessão ao setup.

## Preservação e rollback

Nenhum segredo TOTP é apagado e nenhuma migration é necessária. Para reativar:

1. definir `TWO_FACTOR_AUTH_ENABLED=true` no ambiente;
2. revisar `REQUIRE_2FA_ROLES`;
3. reiniciar o backend;
4. homologar login, refresh, setup e logout.

Enquanto desativado, permanecem senha forte, rate limit, refresh token rotativo,
detecção de replay e trilha de auditoria.
''',
              encoding="utf-8",
          )
          PY

      - name: Validate and push functional change
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/app backend/tests/test_2fa_temporarily_disabled.py
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git add backend/app/core/config.py backend/app/core/auth_middleware.py \
            backend/app/routers/auth.py backend/tests/test_2fa_temporarily_disabled.py \
            docs/SECURITY_2FA_TEMPORARY_DISABLE.md .env.example
          git commit -m "security(auth): desativar 2FA temporariamente com kill switch"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
