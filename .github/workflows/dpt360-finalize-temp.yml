name: DPT360 Finalize Temp

on:
  push:
    branches: [feat/910-dpt360-wave1]

permissions:
  contents: write

concurrency:
  group: dpt360-finalize-temp
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/910-dpt360-wave1
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Consolidar implementação DPT 360 com baixo conflito
        shell: bash
        run: |
          set -euo pipefail

          # O DPT é empilhado sobre #907. Restauramos o registry e seu teste
          # exatamente da base para não carregar regravações concorrentes.
          git checkout origin/feat/904-areas-workspaces -- \
            frontend/src/config/moduleRegistry.tsx \
            frontend/src/config/moduleRegistry.test.ts

          cat > frontend/src/config/registerDpt360.tsx <<'EOF'
          import { lazy } from "react";
          import { BriefcaseBusiness } from "lucide-react";
          import { ROLES, STAFF_ROUTES, type ModuleRoute } from "./moduleRegistry";

          const Dpt360Workspace = lazy(() => import("../pages/dpt360/Dpt360Workspace"));

          const common = {
            label: "DPT Empresarial 360",
            description: "Cockpit de inteligência, prevenção e gestão jurídica empresarial.",
            group: "Pesquisar & IA",
            icon: BriefcaseBusiness,
            component: Dpt360Workspace,
            roles: ROLES.compliance,
            showInNav: false,
            status: "hidden" as const,
            helpKey: "dpt360",
            sensitive: true,
            usesAI: true,
            backendPrefixes: ["/api/clients", "/api/cases", "/api/deadlines"],
          } satisfies Omit<ModuleRoute, "key" | "path">;

          const DPT_ROUTES: ModuleRoute[] = [
            {
              ...common,
              key: "dpt360",
              path: "/dpt360",
              showInNav: true,
              essential: true,
              status: "active",
              order: 1,
            },
            { ...common, key: "dpt360-empresas", path: "/dpt360/empresas" },
            {
              ...common,
              key: "dpt360-company-detail",
              path: "/dpt360/empresas/:clientId",
              label: "Empresa 360",
              description: "Visão jurídica empresarial do cliente pessoa jurídica.",
            },
            { ...common, key: "dpt360-diagnostico", path: "/dpt360/diagnostico" },
            { ...common, key: "dpt360-radar", path: "/dpt360/radar" },
            { ...common, key: "dpt360-inteligencia", path: "/dpt360/inteligencia" },
            { ...common, key: "dpt360-ferramentas", path: "/dpt360/ferramentas" },
            { ...common, key: "dpt360-casos", path: "/dpt360/casos" },
            { ...common, key: "dpt360-obrigacoes", path: "/dpt360/obrigacoes" },
            { ...common, key: "dpt360-biblioteca", path: "/dpt360/biblioteca" },
            { ...common, key: "dpt360-relatorios", path: "/dpt360/relatorios" },
          ];

          for (const route of DPT_ROUTES) {
            if (!STAFF_ROUTES.some((current) => current.key === route.key || current.path === route.path)) {
              STAFF_ROUTES.push(route);
            }
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/App.tsx')
          text = path.read_text()
          import_line = 'import "./config/registerDpt360";\n'
          if import_line not in text:
              # O import é apenas side-effect de registro e roda antes do render.
              anchor = 'import { Suspense } from "react";\n'
              if anchor in text:
                  text = text.replace(anchor, anchor + import_line, 1)
              else:
                  # fallback conservador: primeira linha de imports
                  text = import_line + text
          path.write_text(text)
          PY

          cd frontend
          npx prettier --write \
            src/App.tsx \
            src/config/registerDpt360.tsx \
            src/pages/dpt360/Dpt360Workspace.tsx \
            src/pages/dpt360/model.ts \
            src/pages/dpt360/model.test.ts

          npm test -- src/config/internalLinks.test.tsx src/pages/dpt360/model.test.ts
          npm test
          npm run build
          cd ..
          git diff --check

          # Nenhum artefato operacional temporário pode entrar no PR final.
          rm -f \
            .github/workflows/dpt360-fix-temp.yml \
            .github/workflows/dpt360-finalize-temp.yml \
            .github/dpt360-trigger.txt \
            .github/dpt360-finalize-trigger.txt

          git status --short

      - name: Commitar estado final limpo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração a consolidar."
            exit 0
          fi
          git commit -m "feat(dpt360): consolidar Onda 1 com registro modular"
          git push origin HEAD:feat/910-dpt360-wave1
