name: Fix Navigation Contracts

on:
  push:
    branches:
      - chore/ejc-10-10-release-governance

permissions:
  contents: write

concurrency:
  group: fix-navigation-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[nav-contracts-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ejc-10-10-release-governance

      - name: Aplicar correções pontuais e idempotentes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path("frontend/src/config/moduleRegistry.tsx")
          text = registry.read_text(encoding="utf-8")
          old = '''    component: KnowledgeHub,
              showInNav: true,
              order: 20,'''.replace("              ", "    ")
          new = '''    component: KnowledgeHub,
              showInNav: false,
              status: "legacy",
              order: 20,'''.replace("              ", "    ")
          if old in text:
              registry.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Trecho do Knowledge Hub não encontrado")

          integrity = Path("frontend/src/config/routeIntegrity.test.ts")
          text = integrity.read_text(encoding="utf-8")
          if '"/ramos/:slug"' not in text:
              marker = '''  "/clientes/:clientId/dossie", // alias removido de STAFF_ROUTES; redireciona para /clientes/:clientId
          ] as const;'''.replace("          ]", "]")
              replacement = '''  "/clientes/:clientId/dossie", // alias removido de STAFF_ROUTES; redireciona para /clientes/:clientId
                "/ramos/:slug", // alias legado; redireciona para /areas-de-atuacao/:slug
              ] as const;'''.replace("      \"/ramos", "  \"/ramos").replace("              ]", "]")
              if marker not in text:
                  raise SystemExit("Bloco de redirects dinâmicos não encontrado")
              integrity.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
          PY

      - name: Publicar correção para validação pelo CI oficial
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/config/moduleRegistry.tsx frontend/src/config/routeIntegrity.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(frontend): ocultar rota legada do menu [nav-contracts-fixed]"
          git push origin HEAD:chore/ejc-10-10-release-governance
