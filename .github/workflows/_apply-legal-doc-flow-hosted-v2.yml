name: Apply legal document flow hardening hosted v2

on:
  push:
    branches:
      - fix/legal-doc-flow-total
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-legal-doc-flow-hardening-hosted-v2-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/legal-doc-flow-total')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/legal-doc-flow-total
          fetch-depth: 0
      - name: Extract and execute reviewed deterministic patcher
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          import subprocess
          import sys
          from pathlib import Path

          source = Path('.github/workflows/_apply-legal-doc-flow-fix.yml').read_text(encoding='utf-8')
          match = re.search(
              r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 --decode \| gzip --decompress",
              source,
          )
          if not match:
              raise SystemExit('Payload determinístico não encontrado')

          patcher = Path('scripts/maintenance/apply_legal_doc_flow_fix.py')
          patcher.parent.mkdir(parents=True, exist_ok=True)
          patcher.write_bytes(gzip.decompress(base64.b64decode(match.group(1))))

          patcher_source = patcher.read_text(encoding='utf-8')

          regex_old = "new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          regex_new = "new_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if patcher_source.count(regex_old) != 1:
              raise SystemExit('Assinatura de replace_regex_once inesperada')
          patcher_source = patcher_source.replace(regex_old, regex_new)

          lock_old = '''"""        select(LegalDoc).where(
            LegalDoc.id == doc_id, LegalDoc.deleted_at.is_(None)
        )
    ).scalar_one_or_none()"""'''
          lock_current = '''"""        select(LegalDoc).where(
            LegalDoc.id == doc_id, LegalDoc.deleted_at.is_(None)
        )
    )).scalar_one_or_none()"""'''
          lock_replacement_old = '''"""        select(LegalDoc).where(
            LegalDoc.id == doc_id, LegalDoc.deleted_at.is_(None)
        ).with_for_update()
    ).scalar_one_or_none()"""'''
          lock_replacement_current = '''"""        select(LegalDoc).where(
            LegalDoc.id == doc_id, LegalDoc.deleted_at.is_(None)
        ).with_for_update()
    )).scalar_one_or_none()"""'''
          if patcher_source.count(lock_old) != 1:
              raise SystemExit('Assinatura antiga do lock atualizar inesperada')
          if patcher_source.count(lock_replacement_old) != 1:
              raise SystemExit('Assinatura nova do lock atualizar inesperada')
          patcher_source = patcher_source.replace(lock_old, lock_current)
          patcher_source = patcher_source.replace(
              lock_replacement_old, lock_replacement_current
          )

          patcher.write_text(patcher_source, encoding='utf-8')
          subprocess.run([sys.executable, '-m', 'py_compile', str(patcher)], check=True)
          subprocess.run([sys.executable, str(patcher)], check=True)
          PY
      - name: Compile changed Python modules
        run: |
          python3 -m compileall -q \
            backend/app/routers/legal_docs.py \
            backend/app/routers/ai.py \
            backend/app/services/validador_juridico_service.py \
            backend/tests/test_legal_doc_flow_contract.py \
            backend/tests/test_legal_doc_ai_log_vinculo_dblevel.py \
            qa/homologacao/run_fluxo_legal_doc_e2e.py
      - name: Commit final corrections and remove temporary machinery
        shell: bash
        run: |
          rm -f scripts/maintenance/apply_legal_doc_flow_fix.py
          rm -f scripts/maintenance/sitecustomize.py
          rm -rf scripts/maintenance/__pycache__
          rm -f scripts/maintenance/.trigger-legal-doc-flow
          rmdir scripts/maintenance 2>/dev/null || true
          rm -f .github/workflows/_apply-legal-doc-flow-fix.yml
          rm -f .github/workflows/_apply-legal-doc-flow-selfhosted.yml
          rm -f .github/workflows/_apply-legal-doc-flow-hosted-v2.yml
          git show origin/main:.github/workflows/ejc-release-gate.yml > .github/workflows/ejc-release-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden validation approval and PDF flow'
          git push origin HEAD:fix/legal-doc-flow-total
