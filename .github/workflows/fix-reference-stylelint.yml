name: Fix Reference Stylelint

on:
  push:
    branches:
      - feature/reference-design-systemwide-20260817
    paths:
      - .github/workflows/fix-reference-stylelint.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/reference-design-systemwide-20260817

      - name: Apply Stylelint-safe value
        run: |
          sed -i 's/text-rendering: optimizeLegibility;/text-rendering: optimizelegibility;/' frontend/src/styles/ejc-reference-systemwide.css

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Correção já aplicada."
            exit 0
          fi
          git config user.name "EJC UI Fixer"
          git config user.email "ui-fixer@ejc.local"
          git add frontend/src/styles/ejc-reference-systemwide.css
          git commit -m "style(ui): corrigir valor text-rendering para lint"
          git push origin HEAD:feature/reference-design-systemwide-20260817
