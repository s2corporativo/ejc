name: Alembic Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/alembic-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose alembic and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ejc_user
          POSTGRES_PASSWORD: ejc_pass
          POSTGRES_DB: ejc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ejc_user -d ejc_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://ejc_user:ejc_pass@localhost:5432/ejc_db
      DATABASE_URL_SYNC: postgresql://ejc_user:ejc_pass@localhost:5432/ejc_db
      SCHEMA_CHECK_DATABASE_URL: postgresql://ejc_user:ejc_pass@localhost:5432/ejc_db
      APP_ENV: development
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências mínimas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Criar extensões
        run: |
          PGPASSWORD=ejc_pass psql -h localhost -U ejc_user -d ejc_db \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Diagnosticar árvore Alembic
        id: tree
        continue-on-error: true
        run: |
          set +e
          {
            echo "=== HEADS ==="
            python -m alembic heads
            echo "=== HISTORY ==="
            python -m alembic history --verbose
          } > /tmp/alembic-tree.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Aplicar migrations
        id: upgrade
        continue-on-error: true
        run: |
          set +e
          python -m alembic upgrade head > /tmp/alembic-upgrade.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Rodar testes unitários com saída capturada
        id: unit
        continue-on-error: true
        run: |
          set +e
          RUN_DB_TESTS=0 python -m pytest tests -q > /tmp/pytest-unit.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Rodar testes com banco real com saída capturada
        id: dbtests
        continue-on-error: true
        run: |
          set +e
          RUN_DB_TESTS=1 python -m pytest tests -q > /tmp/pytest-db.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Publicar diagnóstico completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejc-backend-diagnostic
          path: |
            /tmp/alembic-tree.log
            /tmp/alembic-upgrade.log
            /tmp/pytest-unit.log
            /tmp/pytest-db.log
          if-no-files-found: warn
          retention-days: 3

      - name: Falhar se alguma validação falhou
        if: always()
        run: |
          tree_status="${{ steps.tree.outputs.status }}"
          upgrade_status="${{ steps.upgrade.outputs.status }}"
          unit_status="${{ steps.unit.outputs.status }}"
          dbtests_status="${{ steps.dbtests.outputs.status }}"
          echo "tree_status=${tree_status:-missing}"
          echo "upgrade_status=${upgrade_status:-missing}"
          echo "unit_status=${unit_status:-missing}"
          echo "dbtests_status=${dbtests_status:-missing}"
          test "${tree_status:-1}" = "0" \
            -a "${upgrade_status:-1}" = "0" \
            -a "${unit_status:-1}" = "0" \
            -a "${dbtests_status:-1}" = "0"
