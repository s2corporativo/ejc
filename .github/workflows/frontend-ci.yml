name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect module lifecycle
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}"
          git checkout -B "${HEAD_BRANCH}" "origin/${HEAD_BRANCH}"
          python - <<'PY'
          from pathlib import Path
          import re

          # 1. Register model in Alembic metadata.
          models = Path("backend/app/models/__init__.py")
          models_text = models.read_text(encoding="utf-8-sig")
          model_import = "from app.models.system_module_setting import SystemModuleSetting  # noqa\n"
          if model_import not in models_text:
              models_text = models_text.rstrip() + "\n" + model_import
              models.write_text(models_text, encoding="utf-8")

          # 2. Include the dedicated router in main.py.
          main = Path("backend/app/main.py")
          main_text = main.read_text(encoding="utf-8-sig")
          if "module_settings" not in main_text:
              if "    system_modules,\n" in main_text:
                  main_text = main_text.replace(
                      "    system_modules,\n",
                      "    system_modules,\n    module_settings,\n",
                      1,
                  )
              elif "from app.routers import system_modules" in main_text:
                  main_text = main_text.replace(
                      "from app.routers import system_modules",
                      "from app.routers import system_modules, module_settings",
                      1,
                  )
              elif "system_modules," in main_text:
                  main_text = main_text.replace(
                      "system_modules,", "system_modules, module_settings,", 1
                  )
              else:
                  raise SystemExit("Import marker for system_modules not found")

              match = re.search(
                  r"^(?P<indent>\s*)(?P<app>[A-Za-z_][A-Za-z0-9_]*)\.include_router\(system_modules\.router,\s*prefix=\"/api\"\)\s*$",
                  main_text,
                  flags=re.MULTILINE,
              )
              if not match:
                  raise SystemExit("include_router(system_modules.router) not found")
              insertion = (
                  match.group(0)
                  + "\n"
                  + match.group("indent")
                  + match.group("app")
                  + '.include_router(module_settings.router, prefix="/api")'
              )
              main_text = main_text[: match.start()] + insertion + main_text[match.end() :]
              main.write_text(main_text, encoding="utf-8")

          # 3. Apply lifecycle to menu and routed content.
          layout = Path("frontend/src/components/Layout.tsx")
          layout_text = layout.read_text(encoding="utf-8")
          gate_import = 'import ModuleLifecycleGate from "./ModuleLifecycleGate";\n'
          store_import = 'import { useModuleLifecycleStore } from "../stores/moduleLifecycle";\n'
          helper_import = 'import { filterModulesByLifecycle } from "../lib/moduleLifecycle";\n'
          marker = 'import OnboardingTour from "./OnboardingTour";\n'
          if gate_import not in layout_text:
              if marker not in layout_text:
                  raise SystemExit("OnboardingTour import marker not found")
              layout_text = layout_text.replace(
                  marker,
                  marker + gate_import + store_import + helper_import,
                  1,
              )

          auth_marker = "  const { user, updateUser } = useAuth();\n"
          lifecycle_state = (
              "  const lifecycleSettings = useModuleLifecycleStore(\n"
              "    (state) => state.settings,\n"
              "  );\n"
          )
          if lifecycle_state not in layout_text:
              if auth_marker not in layout_text:
                  raise SystemExit("Layout auth marker not found")
              layout_text = layout_text.replace(
                  auth_marker, auth_marker + lifecycle_state, 1
              )

          old_visible = (
              "  const visible = useMemo(\n"
              "    () => getNavigationModules(user?.role),\n"
              "    [user?.role],\n"
              "  );\n"
          )
          new_visible = (
              "  const visible = useMemo(\n"
              "    () =>\n"
              "      filterModulesByLifecycle(\n"
              "        getNavigationModules(user?.role),\n"
              "        lifecycleSettings,\n"
              "      ),\n"
              "    [user?.role, lifecycleSettings],\n"
              "  );\n"
          )
          if old_visible in layout_text:
              layout_text = layout_text.replace(old_visible, new_visible, 1)
          elif new_visible not in layout_text:
              raise SystemExit("Visible navigation block not found")

          outlet = "<Outlet />"
          wrapped = "<ModuleLifecycleGate><Outlet /></ModuleLifecycleGate>"
          if wrapped not in layout_text:
              if outlet not in layout_text:
                  raise SystemExit("Layout Outlet not found")
              layout_text = layout_text.replace(outlet, wrapped, 1)
          layout.write_text(layout_text, encoding="utf-8")

          # 4. Replace static module inventory in Settings with lifecycle manager.
          settings = Path("frontend/src/pages/Configuracoes.tsx")
          settings_text = settings.read_text(encoding="utf-8")
          component_import = 'import ModuleLifecycleSettings from "../components/ModuleLifecycleSettings";\n'
          import_marker = 'import NotificationPreferences from "../components/NotificationPreferences";\n'
          if component_import not in settings_text:
              if import_marker not in settings_text:
                  raise SystemExit("NotificationPreferences import marker not found")
              settings_text = settings_text.replace(
                  import_marker, import_marker + component_import, 1
              )

          settings_text = settings_text.replace(
              'import {\n  canRoleAccessPath,\n  getModuleCatalog,\n  type ModuleStatus,\n} from "../config/moduleRegistry";\n',
              'import { canRoleAccessPath } from "../config/moduleRegistry";\n',
              1,
          )
          settings_text = re.sub(
              r"\nconst STATUS_LABEL: Record<ModuleStatus, string> = \{.*?\n\};\n\nconst STATUS_CLASS: Record<ModuleStatus, string> = \{.*?\n\};\n",
              "\n",
              settings_text,
              count=1,
              flags=re.DOTALL,
          )
          settings_text = settings_text.replace(
              "\n  const modules = getModuleCatalog();\n", "\n", 1
          )

          start_marker = '      {tab === "modulos" && isAdmin && (\n'
          end_marker = '      {tab === "integracoes" && isAdmin && <IntegrationHealthPanel />}\n'
          replacement = '      {tab === "modulos" && isAdmin && <ModuleLifecycleSettings />}\n\n'
          if start_marker in settings_text:
              start = settings_text.index(start_marker)
              end = settings_text.index(end_marker, start)
              settings_text = settings_text[:start] + replacement + settings_text[end:]
          elif replacement not in settings_text:
              raise SystemExit("Static modules settings block not found")
          settings.write_text(settings_text, encoding="utf-8")
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/app/main.py backend/app/models/__init__.py frontend/src/components/Layout.tsx frontend/src/pages/Configuracoes.tsx
            git commit -m "feat(modules): conecta lifecycle ao sistema"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test
