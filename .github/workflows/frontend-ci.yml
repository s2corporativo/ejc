name: Frontend CI

# Gatilho de PR removido: o job frontend-build do ci.yml roda o MESMO
# typecheck+build+vitest em todo PR — este workflow duplicava ~5 min de
# runner por push com frontend (cota de Actions em repositório privado).
# Mantido só o disparo manual para depuração isolada do frontend.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test
