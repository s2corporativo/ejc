name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply deterministic partner withdrawals alias
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}"
          git checkout -B "${HEAD_BRANCH}" "origin/${HEAD_BRANCH}"
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/config/moduleRegistry.tsx")
          text = path.read_text(encoding="utf-8")
          old = '    to: "/financeiro?tab=societaria",\n    reason: "Saques de sócios foram consolidados na gestão societária.",'
          new = '    to: "/financeiro?tab=societaria&sub=saques",\n    reason: "Saques de sócios foram consolidados na gestão societária.",'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Alias esperado de saques não foi encontrado")
          PY
          if ! git diff --quiet -- frontend/src/config/moduleRegistry.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/src/config/moduleRegistry.tsx
            git commit -m "fix(routes): direciona saques para subaba societária"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test
