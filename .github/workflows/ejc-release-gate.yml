name: EJC Release Gate

# Gate P0 no runner SELF-HOSTED: executa automaticamente em todo PR e em cada
# atualização da main, além de permitir execução manual. O objetivo é impedir
# que conflitos, segredos, CORS inseguro, resíduos críticos, backup em claro ou
# rollback quebrado avancem sem evidência auditável.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ejc-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-guard:
    name: P0 guard — conflitos e segredos
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Executar gate P0 com diagnóstico
        shell: bash
        run: |
          set +e
          : > ci_guard.log

          {
            echo "[EJC CI] Iniciando diagnóstico P0"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "github_sha=${GITHUB_SHA}"
            echo "github_ref=${GITHUB_REF}"
            echo "github_ref_name=${GITHUB_REF_NAME}"
            echo
            echo "[EJC CI] Executando scripts/ci_guard.sh"
            bash scripts/ci_guard.sh
          } > ci_guard.log 2>&1

          status=$?
          cat ci_guard.log

          {
            echo "## EJC Release Gate — P0"
            echo
            echo "Exit code: ${status}"
            echo
            echo '```text'
            tail -n 180 ci_guard.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${status}"

      - name: Provar backup canônico cifrado
        shell: bash
        run: |
          chmod +x scripts/tests/test_backup_wrapper.sh
          bash scripts/tests/test_backup_wrapper.sh | tee backup-wrapper-test.log

      - name: Provar política de migration e rollback de imagens
        shell: bash
        run: |
          chmod +x scripts/tests/test_deploy_rollback.sh
          bash scripts/tests/test_deploy_rollback.sh | tee deploy-rollback-test.log

      - name: Publicar diagnóstico P0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-guard-log
          path: |
            ci_guard.log
            backup-wrapper-test.log
            deploy-rollback-test.log
          if-no-files-found: warn
          retention-days: 7

  # Os gates P1 permanecem no ci.yml para evitar duplicidade de tempo de runner:
  # backend completo com PostgreSQL/pgvector, evals offline, frontend, lint,
  # auditorias de dependências, typecheck, testes e build.
