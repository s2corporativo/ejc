name: EJC Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  p0-guard:
    name: P0 guard — conflitos e segredos
    runs-on: ubuntu-latest
    steps:
      - name: Executar gate P0 com diagnóstico
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set +e
          : > ci_guard.log

          {
            echo "[EJC CI] Iniciando diagnóstico P0"
            echo "repository=${REPOSITORY}"
            echo "event=${EVENT_NAME}"
            echo "ref_sha=${REF_SHA}"
            echo "pr_number=${PR_NUMBER:-}"
            echo
            echo "[EJC CI] Checkout manual"
            git init .
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
            git fetch --depth=1 origin "${REF_SHA}"
            git checkout --force FETCH_HEAD
            echo
            echo "[EJC CI] Executando scripts/ci_guard.sh"
            bash scripts/ci_guard.sh
          } > ci_guard.log 2>&1

          status=$?
          cat ci_guard.log

          {
            echo "## EJC Release Gate — P0"
            echo
            echo "Exit code: ${status}"
            echo
            echo '```text'
            tail -n 180 ci_guard.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${EVENT_NAME}" == "pull_request" && -n "${PR_NUMBER:-}" ]]; then
            python3 - <<'PY' > comment_payload.json
import json
from pathlib import Path
log = Path('ci_guard.log').read_text(encoding='utf-8', errors='replace')
if len(log) > 6000:
    log = log[-6000:]
body = "## EJC Release Gate — diagnóstico P0\n\n" + "```text\n" + log + "\n```"
print(json.dumps({"body": body}, ensure_ascii=False))
PY
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d @comment_payload.json || true
          fi

          exit "${status}"

  backend-smoke:
    name: P1 backend — deps e compile
    runs-on: ubuntu-latest
    needs: p0-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependências nativas mínimas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmagic1 \
            poppler-utils \
            tesseract-ocr \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0

      - name: Instalar dependências backend
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile smoke backend
        run: python -m compileall -q backend/app

  frontend-build:
    name: P1 frontend — build
    runs-on: ubuntu-latest
    needs: p0-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
