name: EJC Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'

permissions:
  contents: read

jobs:
  p0-guard:
    name: P0 guard — conflitos e segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar gate P0
        run: bash scripts/ci_guard.sh

  backend-smoke:
    name: P1 backend — deps, compile e governança jurídica
    runs-on: ubuntu-latest
    needs: p0-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependências nativas mínimas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmagic1 \
            poppler-utils \
            tesseract-ocr \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0

      - name: Instalar dependências backend
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile smoke backend
        run: python -m compileall -q backend/app

      - name: Governança do gold set jurídico
        working-directory: backend
        run: |
          set -o pipefail
          python -m app.eval.gold_governance | tee ../gold-governance-report.txt

      - name: Resumo da maturidade jurídica da IA
        if: always()
        run: |
          {
            echo "## Gold set jurídico — governança"
            echo
            echo '```text'
            cat gold-governance-report.txt 2>/dev/null || true
            echo '```'
            echo
            echo "Este check valida proveniência e deixa explícita cobertura zero quando não há corpus humano."
            echo "Certificação jurídica ampla é um workflow separado e fail-closed."
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-build:
    name: P1 frontend — build
    runs-on: ubuntu-latest
    needs: p0-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências frontend
        working-directory: frontend
        run: npm ci

      - name: Formatação frontend com diff diagnóstico
        working-directory: frontend
        run: |
          if ! npm run format:check; then
            npx prettier --write src/pages/Prazos.tsx
            echo "::group::Diff sugerido pelo Prettier"
            git diff -- src/pages/Prazos.tsx
            echo "::endgroup::"
            exit 1
          fi

      - name: Build frontend
        working-directory: frontend
        run: npm run build
