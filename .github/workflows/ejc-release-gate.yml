name: EJC Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'

permissions:
  contents: read

jobs:
  p0-guard:
    name: P0 guard — conflitos e segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manual
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${REF_SHA}"
          git checkout --force FETCH_HEAD

      - name: Executar gate P0
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci_guard.sh 2>&1 | tee ci_guard.log

      - name: Publicar log P0
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-guard-log
          path: ci_guard.log
          if-no-files-found: ignore

  backend-smoke:
    name: P1 backend — deps e compile
    runs-on: ubuntu-latest
    needs: p0-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependências nativas mínimas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmagic1 \
            poppler-utils \
            tesseract-ocr \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0

      - name: Instalar dependências backend
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile smoke backend
        run: python -m compileall -q backend/app

  frontend-build:
    name: P1 frontend — build
    runs-on: ubuntu-latest
    needs: p0-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
