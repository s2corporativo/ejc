name: EJC Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ejc-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-guard:
    name: P0 guard — conflitos e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Executar gate P0 com diagnóstico
        shell: bash
        run: |
          set +e
          : > ci_guard.log

          {
            echo "[EJC CI] Iniciando diagnóstico P0"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "github_sha=${GITHUB_SHA}"
            echo "github_ref=${GITHUB_REF}"
            echo "github_ref_name=${GITHUB_REF_NAME}"
            echo
            echo "[EJC CI] Executando scripts/ci_guard.sh"
            bash scripts/ci_guard.sh
          } > ci_guard.log 2>&1

          status=$?
          cat ci_guard.log

          {
            echo "## EJC Release Gate — P0"
            echo
            echo "Exit code: ${status}"
            echo
            echo '```text'
            tail -n 180 ci_guard.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${status}"

      - name: Publicar diagnóstico P0
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-guard-log
          path: ci_guard.log
          retention-days: 7

  backend-smoke:
    name: P1 backend — deps e compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: p0-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependências nativas mínimas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmagic1 \
            poppler-utils \
            tesseract-ocr \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libcairo2 \
            libgdk-pixbuf-2.0-0

      - name: Instalar dependências backend
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile smoke backend
        run: python -m compileall -q backend/app

  frontend-build:
    name: P1 frontend — build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: p0-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
