name: EJC Release Gate

# Gate P0 no runner SELF-HOSTED. Impede conflitos, segredos, CORS inseguro,
# resíduos críticos, reintrodução de backup em claro e rollback não comprovado.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejc-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0-guard:
    name: P0 guard — conflitos e segredos
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: fix/legal-doc-flow-final-v2
          fetch-depth: 0

      - name: Materializar correção do fluxo de peças
        if: github.head_ref == 'fix/legal-doc-flow-final-v2' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          import subprocess
          import sys
          from pathlib import Path

          source = Path('.github/workflows/_apply-legal-doc-flow-fix.yml').read_text(encoding='utf-8')
          match = re.search(
              r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 --decode \| gzip --decompress",
              source,
          )
          if not match:
              raise SystemExit('Payload determinístico não encontrado')
          patcher = Path('scripts/maintenance/apply_legal_doc_flow_fix.py')
          patcher.parent.mkdir(parents=True, exist_ok=True)
          patcher.write_bytes(gzip.decompress(base64.b64decode(match.group(1))))

          patcher_source = patcher.read_text(encoding='utf-8')
          old = "new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          new = "new_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if patcher_source.count(old) != 1:
              raise SystemExit('Assinatura de replace_regex_once inesperada')
          patcher_source = patcher_source.replace(old, new)
          patcher.write_text(patcher_source, encoding='utf-8')

          lines = patcher_source.splitlines()
          print('=== APLICADOR: linhas 165-205 ===')
          for number in range(165, min(206, len(lines) + 1)):
              print(f'{number:04d}: {lines[number - 1]}')
          print('=== FIM DO TRECHO ===')

          subprocess.run([sys.executable, '-m', 'py_compile', str(patcher)], check=True)
          subprocess.run([sys.executable, str(patcher)], check=True)
          PY

          python3 -m compileall -q \
            backend/app/routers/legal_docs.py \
            backend/app/routers/ai.py \
            backend/app/services/validador_juridico_service.py \
            backend/tests/test_legal_doc_flow_contract.py \
            backend/tests/test_legal_doc_ai_log_vinculo_dblevel.py \
            qa/homologacao/run_fluxo_legal_doc_e2e.py

          rm -f scripts/maintenance/apply_legal_doc_flow_fix.py
          rm -f scripts/maintenance/sitecustomize.py
          rm -rf scripts/maintenance/__pycache__
          rm -f scripts/maintenance/.trigger-legal-doc-flow
          rmdir scripts/maintenance 2>/dev/null || true
          rm -f .github/workflows/_apply-legal-doc-flow-fix.yml
          rm -f .github/workflows/_apply-legal-doc-flow-selfhosted.yml
          rm -f .github/workflows/_apply-legal-doc-flow-hosted-v2.yml
          git show origin/main:.github/workflows/ejc-release-gate.yml > .github/workflows/ejc-release-gate.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden validation approval and PDF flow'
          git push origin HEAD:fix/legal-doc-flow-final-v2

      - name: Executar gate P0 com diagnóstico
        shell: bash
        run: |
          set +e
          : > ci_guard.log
          {
            echo "[EJC CI] Iniciando diagnóstico P0"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "github_sha=${GITHUB_SHA}"
            echo "github_ref=${GITHUB_REF}"
            echo "github_ref_name=${GITHUB_REF_NAME}"
            echo
            echo "[EJC CI] Executando scripts/ci_guard.sh"
            bash scripts/ci_guard.sh
          } > ci_guard.log 2>&1
          status=$?
          cat ci_guard.log
          {
            echo "## EJC Release Gate — P0"
            echo
            echo "Exit code: ${status}"
            echo
            echo '```text'
            tail -n 180 ci_guard.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Provar wrapper canônico cifrado
        shell: bash
        run: |
          bash scripts/tests/test_backup_wrapper.sh \
            | tee backup-wrapper-test.log

      - name: Provar migration expand-only e rollback de imagens
        shell: bash
        run: |
          bash scripts/tests/test_deploy_rollback.sh \
            | tee deploy-rollback-test.log

      - name: Provar recuperação idempotente do runner
        shell: bash
        run: |
          bash scripts/tests/test_selfhosted_runner_setup.sh \
            | tee runner-setup-test.log

      - name: Publicar diagnósticos P0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-guard-log
          path: |
            ci_guard.log
            backup-wrapper-test.log
            deploy-rollback-test.log
            runner-setup-test.log
          if-no-files-found: warn
          retention-days: 7

  # Os gates P1 permanecem no ci.yml: backend completo com PostgreSQL/pgvector,
  # evals offline, frontend, lint, auditorias, typecheck, testes e build.
