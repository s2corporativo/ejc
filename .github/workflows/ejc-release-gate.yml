name: EJC Release Gate

# Gate P0 no runner SELF-HOSTED: executa automaticamente em todo PR e em cada
# atualização da main, além de permitir execução manual. O objetivo é impedir
# que conflitos, segredos, CORS inseguro ou resíduos críticos avancem sem
# evidência auditável.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejc-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-navigation-contract:
    name: Correção pontual do contrato de navegação
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/ejc-10-10-release-governance' }}
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ejc-10-10-release-governance

      - name: Ocultar Knowledge Hub legado do menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/config/moduleRegistry.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''    component: KnowledgeHub,
              showInNav: true,
              order: 20,'''.replace("              ", "    ")
          new = '''    component: KnowledgeHub,
              showInNav: false,
              status: "legacy",
              order: 20,'''.replace("              ", "    ")
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Trecho do Knowledge Hub não encontrado")
          PY

      - name: Publicar correção na branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/config/moduleRegistry.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(frontend): ocultar Knowledge Hub legado do menu [nav-contracts-fixed]"
          git push origin HEAD:chore/ejc-10-10-release-governance

  p0-guard:
    name: P0 guard — conflitos e segredos
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Executar gate P0 com diagnóstico
        shell: bash
        run: |
          set +e
          : > ci_guard.log

          {
            echo "[EJC CI] Iniciando diagnóstico P0"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "github_sha=${GITHUB_SHA}"
            echo "github_ref=${GITHUB_REF}"
            echo "github_ref_name=${GITHUB_REF_NAME}"
            echo
            echo "[EJC CI] Executando scripts/ci_guard.sh"
            bash scripts/ci_guard.sh
          } > ci_guard.log 2>&1

          status=$?
          cat ci_guard.log

          {
            echo "## EJC Release Gate — P0"
            echo
            echo "Exit code: ${status}"
            echo
            echo '```text'
            tail -n 180 ci_guard.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          exit "${status}"

      - name: Publicar diagnóstico P0
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p0-guard-log
          path: ci_guard.log
          retention-days: 7

  # Os gates P1 permanecem no ci.yml para evitar duplicidade de tempo de runner:
  # backend completo com PostgreSQL/pgvector, evals offline, frontend, lint,
  # auditorias de dependências, typecheck, testes e build.
