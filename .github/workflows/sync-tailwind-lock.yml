name: Sync Main into EJC 10/10 Branch

on:
  push:
    branches:
      - chore/ejc-10-10-release-governance

permissions:
  contents: write

concurrency:
  group: sync-main-10-10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[main-synced]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ejc-10-10-release-governance
          fetch-depth: 0

      - name: Incorporar a main e resolver apenas conflitos conhecidos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge --no-ff origin/main -m "chore: sincronizar main na governança 10/10 [main-synced]"; then
            git push origin HEAD:chore/ejc-10-10-release-governance
            exit 0
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          for path in "${conflicts[@]}"; do
            case "$path" in
              frontend/src/lib/api.ts|frontend/src/config/routeIntegrity.test.ts)
                git checkout --theirs -- "$path"
                git add "$path"
                ;;
              *)
                echo "Conflito não autorizado: $path" >&2
                git merge --abort
                exit 1
                ;;
            esac
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Ainda existem conflitos não resolvidos" >&2
            exit 1
          fi

          git commit -m "chore: sincronizar main na governança 10/10 [main-synced]"
          git push origin HEAD:chore/ejc-10-10-release-governance
