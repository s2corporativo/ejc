name: Sync Tailwind PostCSS Lockfile

on:
  push:
    branches:
      - chore/ejc-10-10-release-governance

permissions:
  contents: write

concurrency:
  group: sync-tailwind-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[tailwind-lock-synced]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ejc-10-10-release-governance

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar plugin oficial do Tailwind 4 para PostCSS
        working-directory: frontend
        run: >-
          npm install --save-dev --save-exact
          @tailwindcss/postcss@4.3.2 --ignore-scripts

      - name: Atualizar configuração PostCSS
        run: |
          cat > frontend/postcss.config.js <<'EOF'
          export default {
            plugins: {
              "@tailwindcss/postcss": {},
              autoprefixer: {},
            },
          };
          EOF

      - name: Publicar lockfile reproduzível
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json frontend/postcss.config.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(frontend): configurar PostCSS do Tailwind 4 [tailwind-lock-synced]"
          git push origin HEAD:chore/ejc-10-10-release-governance
