        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências frontend
        working-directory: frontend
        run: npm ci

      - name: Formatar somente a allowlist frontend
        working-directory: frontend
        run: |
          npx prettier --write \
            src/components/Layout.tsx \
            src/components/SidebarWeek.tsx \
            src/components/SidebarWeek.test.tsx \
            src/components/header/OfficeLinks.tsx \
            src/config/office.ts \
            src/content/dailyMessages.ts \
            src/content/dailyMessages.test.ts \
            src/pages/DashboardModern.tsx \
            src/styles/ejc-shell-v2-refinements.css

      - name: Validar frontend completo
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint:eslint
          npm run test -- --reporter=dot
          npm run build
          npm audit --audit-level=high

      - name: Verificar allowlist do diff
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/allowlist <<'EOF'
          backend/app/routers/agenda_eventos.py
          backend/app/routers/cases.py
          backend/app/routers/deadlines.py
          docs/auditoria/EXECUCAO_AUDITORIA_DESIGN_2026-08-05.md
          docs/design/RESTILIZACAO_EJC_V2.md
          frontend/src/components/Layout.tsx
          frontend/src/components/SidebarWeek.test.tsx
          frontend/src/components/SidebarWeek.tsx
          frontend/src/components/header/OfficeLinks.tsx
          frontend/src/config/office.ts
          frontend/src/content/dailyMessages.test.ts
          frontend/src/content/dailyMessages.ts
          frontend/src/pages/DashboardModern.tsx
          frontend/src/styles/ejc-shell-v2-refinements.css
          EOF
          git diff --name-only | sort > /tmp/changed
          diff -u /tmp/allowlist /tmp/changed

      - name: Empacotar somente arquivos validados
        run: |
          tar -czf /tmp/review-fixes.tgz \
            backend/app/routers/agenda_eventos.py \
            backend/app/routers/cases.py \
            backend/app/routers/deadlines.py \
            docs/auditoria/EXECUCAO_AUDITORIA_DESIGN_2026-08-05.md \
            docs/design/RESTILIZACAO_EJC_V2.md \
            frontend/src/components/Layout.tsx \
            frontend/src/components/SidebarWeek.test.tsx \
            frontend/src/components/SidebarWeek.tsx \
            frontend/src/components/header/OfficeLinks.tsx \
            frontend/src/config/office.ts \
            frontend/src/content/dailyMessages.test.ts \
            frontend/src/content/dailyMessages.ts \
            frontend/src/pages/DashboardModern.tsx \
            frontend/src/styles/ejc-shell-v2-refinements.css

      - name: Publicar artefato validado
        uses: actions/upload-artifact@v7
        with:
          name: correcoes-revisao-design
          path: /tmp/review-fixes.tgz
          retention-days: 1

  publicar:
    name: Publicar somente o artefato validado
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exclusivo para publicação
        uses: actions/checkout@v7
        with:
          ref: codex/auditoria-final-design-20260805
          fetch-depth: 0

      - name: Baixar artefato validado
        uses: actions/download-artifact@v8
        with:
          name: correcoes-revisao-design
          path: /tmp/correcoes

      - name: Aplicar allowlist e publicar
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf /tmp/correcoes/review-fixes.tgz | sed 's#/$##' | sort > /tmp/archive-files
          cat > /tmp/allowlist <<'EOF'
          backend/app/routers/agenda_eventos.py
          backend/app/routers/cases.py
          backend/app/routers/deadlines.py
          docs/auditoria/EXECUCAO_AUDITORIA_DESIGN_2026-08-05.md
          docs/design/RESTILIZACAO_EJC_V2.md
          frontend/src/components/Layout.tsx
          frontend/src/components/SidebarWeek.test.tsx
          frontend/src/components/SidebarWeek.tsx
          frontend/src/components/header/OfficeLinks.tsx
          frontend/src/config/office.ts
          frontend/src/content/dailyMessages.test.ts
          frontend/src/content/dailyMessages.ts
          frontend/src/pages/DashboardModern.tsx
          frontend/src/styles/ejc-shell-v2-refinements.css
          EOF
          diff -u /tmp/allowlist /tmp/archive-files
          tar -xzf /tmp/correcoes/review-fixes.tgz
          git diff --name-only | sort > /tmp/changed
          diff -u /tmp/allowlist /tmp/changed
          git add --pathspec-from-file=/tmp/allowlist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: atender revisão funcional e acessível do design"
          git push origin HEAD:codex/auditoria-final-design-20260805
