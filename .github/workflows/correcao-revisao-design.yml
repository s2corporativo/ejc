  const start = Date.UTC(date.getUTCFullYear(), 0, 0);
  const current = Date.UTC(
    date.getUTCFullYear(),
    date.getUTCMonth(),
    date.getUTCDate(),
  );
  const dayOfYear = Math.floor((current - start) / 86_400_000);
  return DAILY_MESSAGES[dayOfYear % DAILY_MESSAGES.length];
}
'''
          new_daily = '''function datePartsInTimezone(date: Date, timeZone: string) {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).formatToParts(date);
  const values = Object.fromEntries(parts.map((part) => [part.type, part.value]));
  return {
    year: Number(values.year),
    month: Number(values.month),
    day: Number(values.day),
  };
}

export function getDailyMessage(date = new Date()): DailyMessage {
  const { year, month, day } = datePartsInTimezone(
    date,
    OFFICE_CONFIG.timezone,
  );
  const start = Date.UTC(year, 0, 0);
  const current = Date.UTC(year, month - 1, day);
  const dayOfYear = Math.floor((current - start) / 86_400_000);
  return DAILY_MESSAGES[dayOfYear % DAILY_MESSAGES.length];
}
