              'className="ejc-mobile-brand-link flex h-11 w-20 shrink-0 items-center justify-center rounded-xl bg-white px-2 md:hidden"',
              1,
          )
          text = text.replace(
              '"ejc-shell-sidebar fixed bottom-0 left-0 top-0 z-50 flex-col transition-all",',
              '"ejc-shell-sidebar fixed bottom-0 left-0 top-0 z-50 flex-col overflow-y-auto transition-all",',
              1,
          )
          text = text.replace(
              '<nav className="ejc-sidebar-scroll flex-1 overflow-y-auto px-3 py-3">',
              '<nav className="ejc-sidebar-scroll min-h-24 flex-1 overflow-y-auto px-3 py-3">',
              1,
