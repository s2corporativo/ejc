name: Correção controlada da revisão do design

on:
  push:
    branches: [codex/auditoria-final-design-20260805]
    paths:
      - .github/workflows/correcao-revisao-design.yml

permissions:
  contents: read

concurrency:
  group: correcao-controlada-revisao-design
  cancel-in-progress: true

jobs:
  validar:
    name: Aplicar patch e validar sem permissão de escrita
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout sem credenciais persistidas
        uses: actions/checkout@v7
        with:
          ref: codex/auditoria-final-design-20260805
          fetch-depth: 0
          persist-credentials: false

      - name: Aplicar correções verificadas da revisão
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Trecho esperado não encontrado em {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

