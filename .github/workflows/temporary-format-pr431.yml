name: Temporary Format PR 431

on:
  push:
    branches:
      - claude/ejc-legal-system-evaluation-acrug6
    paths:
      - .github/workflows/temporary-format-pr431.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-format-pr431
  cancel-in-progress: false

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: claude/ejc-legal-system-evaluation-acrug6
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Format only the failing file
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/pages/RaioXProcesso.tsx
          npx prettier --check src/pages/RaioXProcesso.tsx

      - name: Commit formatted file and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "EJC Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/temporary-format-pr431.yml
          git add frontend/src/pages/RaioXProcesso.tsx .github/workflows/temporary-format-pr431.yml
          if git diff --cached --quiet; then
            echo "No formatting change was needed."
            exit 0
          fi
          git commit -m "style(frontend): aplicar Prettier no Raio-X"
          git push origin HEAD:claude/ejc-legal-system-evaluation-acrug6
