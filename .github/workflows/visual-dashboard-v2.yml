name: Visual QA Dashboard v2

on:
  push:
    branches:
      - claude/ejc-restilizacao-v2-clean
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-dashboard-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Instalar Playwright somente no runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Validar build
        run: npm run build

      - name: Iniciar preview local
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ejc-preview.log 2>&1 &
          for tentativa in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ejc-preview.log
          exit 1

      - name: Capturar dashboard em seis larguras
        run: npx playwright test tests/visual/dashboard-v2.spec.ts --reporter=line

      - name: Publicar evidências visuais
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-v2-screenshots
          path: frontend/test-results/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Anexar relatório do preview em caso de falha
        if: failure()
        run: cat /tmp/ejc-preview.log || true
