name: Temp Format PR 475

on:
  pull_request:
    paths:
      - frontend/src/pages/SalaAnaliseJuridica.tsx
      - .github/workflows/_temp-format-pr475.yml

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências e aplicar Prettier
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/pages/SalaAnaliseJuridica.tsx
      - name: Commitar somente a formatação comprovada
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/src/pages/SalaAnaliseJuridica.tsx; then
            echo "Arquivo já formatado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/SalaAnaliseJuridica.tsx
          git commit -m "style(frontend): aplicar Prettier na Sala de Análise"
          git push origin "HEAD:${{ github.head_ref }}"
