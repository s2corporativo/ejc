name: Temp Format PR 475

on:
  pull_request:
    paths:
      - frontend/src/pages/SalaAnaliseJuridica.tsx
      - .github/workflows/_temp-format-pr475.yml

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências e aplicar Prettier
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/pages/SalaAnaliseJuridica.tsx
      - name: Publicar arquivo formatado
        uses: actions/upload-artifact@v7
        with:
          name: sala-analise-prettier
          path: frontend/src/pages/SalaAnaliseJuridica.tsx
          if-no-files-found: error
          retention-days: 1
