name: Temp Format PR 475

on:
  push:
    branches:
      - fix/p0-sala-conversao-seguranca-20260725

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-sala-conversao-seguranca-20260725
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências e aplicar Prettier
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/pages/SalaAnaliseJuridica.tsx
      - name: Remover executor temporário e publicar correção
        run: |
          git rm .github/workflows/_temp-format-pr475.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/SalaAnaliseJuridica.tsx
          git commit -m 'style(frontend): aplicar Prettier na Sala de Análise'
          git push origin HEAD:fix/p0-sala-conversao-seguranca-20260725
