name: Diagnose Production Backend

on:
  push:
    branches:
      - diagnostic/prod-backend-20260817
    paths:
      - .github/workflows/diagnose-production-backend.yml

permissions:
  contents: read

concurrency:
  group: diagnose-production-backend
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - name: Checkout diagnóstico
        uses: actions/checkout@v7

      - name: Estado seguro do runtime
        shell: bash
        run: |
          set -euo pipefail
          echo "container=ejc_backend"
          docker ps -a --filter name='^/ejc_backend$' --format 'status={{.Status}} image={{.Image}} names={{.Names}}'
          docker inspect ejc_backend --format 'restart_count={{.RestartCount}} image_ref={{.Config.Image}} state_status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} oom_killed={{.State.OOMKilled}} dead={{.State.Dead}} exit_code={{.State.ExitCode}} error={{json .State.Error}} started_at={{.State.StartedAt}} finished_at={{.State.FinishedAt}}' || true
          docker image inspect ejc-backend --format 'image_created={{.Created}} image_id={{.Id}}' || true
          if docker inspect ejc_backend --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' >/tmp/health-status 2>/dev/null; then
            printf 'health=%s\n' "$(cat /tmp/health-status)"
          fi
          if (cd /opt/ejc && docker compose config --quiet); then
            echo 'compose_config=ok'
          else
            echo 'compose_config=error'
          fi

      - name: Configuração operacional não sensível do backend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          env = json.loads(subprocess.check_output([
              "docker", "inspect", "ejc_backend", "--format", "{{json .Config.Env}}"
          ], text=True))
          wanted = {"APP_ENV", "RUN_MIGRATIONS", "GIT_SHA"}
          values = {}
          for item in env:
              if "=" not in item:
                  continue
              key, value = item.split("=", 1)
              if key in wanted:
                  values[key] = value
          for key in sorted(wanted):
              print(f"{key.lower()}={values.get(key, '<ausente>')}")
          PY

      - name: Classificar ciclo atual sem expor logs
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/ejc-backend-recent.log"
          docker logs --tail 800 ejc_backend >"$raw" 2>&1 || true
          python3 - "$raw" <<'PY'
          import re, sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors="replace")
          marker = text.rfind("[entrypoint]")
          current = text[marker:] if marker >= 0 else text[-12000:]
          print(f"current_cycle_bytes={len(current.encode(errors='ignore'))}")
          for label, pattern in {
              "runs_migrations": r"RUN_MIGRATIONS ativo",
              "skips_migrations": r"pulando migrations",
              "seed_admin": r"Semeando usuário admin",
              "starts_uvicorn": r"Iniciando uvicorn",
              "alembic_upgrade": r"alembic upgrade head",
              "assertion": r"AssertionError",
              "undefined_table": r"UndefinedTable|relation .* does not exist",
              "undefined_column": r"UndefinedColumn|column .* does not exist",
              "programming_error": r"ProgrammingError",
              "operational_error": r"OperationalError",
          }.items():
              print(f"current_{label}={len(re.findall(pattern, current, flags=re.I))}")
          relations = set(re.findall(r'relation ["\']([A-Za-z0-9_.-]+)["\'] does not exist', current, re.I))
          columns = set(re.findall(r'column ["\']?([A-Za-z_][A-Za-z0-9_.]*)["\']? does not exist', current, re.I))
          print("current_missing_relations=" + ",".join(sorted(relations)) if relations else "current_missing_relations=none")
          print("current_missing_columns=" + ",".join(sorted(columns)) if columns else "current_missing_columns=none")
          # Assinaturas técnicas sanitizadas; sem SQL, parâmetros ou valores de negócio.
          signatures = set()
          for line in current.splitlines():
              if "sqlalchemy.exc." in line or "asyncpg.exceptions." in line or "alembic.util.exc." in line:
                  line = re.sub(r"https?://\S+", "[URL]", line)
                  line = re.sub(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+", "[EMAIL]", line)
                  line = re.sub(r"\[[^\]]*parameters[^\]]*\]", "[PARAMS]", line, flags=re.I)
                  signatures.add(line[:500])
          for idx, line in enumerate(sorted(signatures)[:8], start=1):
              print(f"error_signature_{idx}={line}")
          PY

      - name: Estado Alembic e schema essencial via worker saudável
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i ejc_worker python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          import os
          from urllib.parse import urlparse

          url = os.environ["DATABASE_URL_SYNC"]
          parsed = urlparse(url)
          print(f"database_host={parsed.hostname or 'none'}")
          print(f"database_name={(parsed.path or '/').lstrip('/') or 'none'}")
          engine = create_engine(url)
          with engine.connect() as conn:
              print("current_database=" + str(conn.execute(text("SELECT current_database()" )).scalar_one()))
              versions = [str(row[0]) for row in conn.execute(text("SELECT version_num FROM alembic_version ORDER BY version_num"))]
              print("alembic_versions=" + ",".join(versions))
              schemas = inspect(conn).get_schema_names()
              for schema in sorted(schemas):
                  if schema.startswith("pg_") or schema == "information_schema":
                      continue
                  names = set(inspect(conn).get_table_names(schema=schema))
                  print(f"schema_{schema}_table_count={len(names)}")
                  if "users" in names:
                      print(f"users_table_schema={schema}")
                  if "knowledge_chunks" in names:
                      print(f"knowledge_chunks_table_schema={schema}")
              public_names = set(inspect(conn).get_table_names(schema="public"))
              print("public_users_exists=" + str("users" in public_names).lower())
              print("public_knowledge_chunks_exists=" + str("knowledge_chunks" in public_names).lower())
          PY

      - name: Dependências de infraestrutura visíveis
        shell: bash
        run: |
          set -euo pipefail
          for c in ejc_db ejc_redis ejc_worker ejc_frontend ejc_backend; do
            if docker inspect "$c" >/dev/null 2>&1; then
              docker inspect "$c" --format "${c}: status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} oom={{.State.OOMKilled}} exit={{.State.ExitCode}} restart_count={{.RestartCount}}"
            else
              echo "${c}: ausente"
            fi
          done
