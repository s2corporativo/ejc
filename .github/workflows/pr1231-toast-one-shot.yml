name: PR1231 toast one-shot

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix/1199-client-document-isolation-v4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/1199-client-document-isolation-v4
          fetch-depth: 0
      - name: Corrigir API do toast de forma fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/Clientes.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'toast.warning('
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'esperado exatamente 1 toast.warning, encontrados {count}')
          path.write_text(text.replace(old, 'toast.info(', 1), encoding='utf-8')
          PY
      - name: Remover executor e publicar correcao
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1231-toast-one-shot.yml
          git config user.name "s2corporativo"
          git config user.email "258954056+s2corporativo@users.noreply.github.com"
          git add -- frontend/src/pages/Clientes.tsx .github/workflows/pr1231-toast-one-shot.yml
          git diff --cached --check
          git commit -m "fix(frontend): usar API suportada do toast"
          git push origin HEAD:fix/1199-client-document-isolation-v4
