name: Prettier Diagnostic Temporary

on:
  pull_request:
    paths:
      - 'frontend/src/pages/Prazos.tsx'
      - '.github/workflows/prettier-diagnostic-temporary.yml'

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Mostrar diff exato do Prettier
        run: |
          npx prettier --write src/pages/Prazos.tsx
          git diff -- src/pages/Prazos.tsx
          test -z "$(git diff -- src/pages/Prazos.tsx)"
