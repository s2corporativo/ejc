name: Finalize P0 Lifecycle Cleanup

on:
  push:
    branches:
      - fix/ci-readonly-cleanup

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-readonly-cleanup
          fetch-depth: 0

      - name: Apply deterministic P0 cleanup and self-remove
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8-sig")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          # 1. Corrige a cadeia Alembic: a migration 080 nunca entrou em main.
          migration_path = "backend/alembic/versions/081_system_module_settings.py"
          migration = read(migration_path)
          migration = migration.replace(
              'Revises: 080_notification_preferences',
              'Revises: 079_client_hash_partial_deleted',
              1,
          )
          migration = migration.replace(
              'down_revision = "080_notification_preferences"',
              'down_revision = "079_client_hash_partial_deleted"',
              1,
          )
          write(migration_path, migration)

          # 2. Registra o router de lifecycle no FastAPI.
          main_path = "backend/app/main.py"
          main = read(main_path)
          import_marker = "from app.routers import system_modules\n"
          import_line = "from app.routers import module_settings\n"
          if import_line not in main:
              if import_marker not in main:
                  raise SystemExit("system_modules import marker not found")
              main = main.replace(import_marker, import_marker + import_line, 1)

          include_marker = (
              "app.include_router(system_modules.router, prefix=API)  "
              "# Mapa de Módulos — governança modular\n"
          )
          include_line = (
              "app.include_router(module_settings.router, prefix=API)  "
              "# Lifecycle auditável dos módulos\n"
          )
          if include_line not in main:
              if include_marker not in main:
                  raise SystemExit("system_modules include marker not found")
              main = main.replace(include_marker, include_marker + include_line, 1)
          write(main_path, main)

          # 3. Registra o model no metadata do Alembic.
          models_path = "backend/app/models/__init__.py"
          models = read(models_path)
          model_import = (
              "from app.models.system_module_setting import "
              "SystemModuleSetting  # noqa\n"
          )
          if model_import not in models:
              models = models.rstrip() + "\n" + model_import
          write(models_path, models)

          # 4. Conecta lifecycle ao menu e ao conteúdo roteado.
          layout_path = "frontend/src/components/Layout.tsx"
          layout = read(layout_path)
          marker = 'import OnboardingTour from "./OnboardingTour";\n'
          additions = (
              'import ModuleLifecycleGate from "./ModuleLifecycleGate";\n'
              'import { useModuleLifecycleStore } from "../stores/moduleLifecycle";\n'
              'import { filterModulesByLifecycle } from "../lib/moduleLifecycle";\n'
          )
          if 'import ModuleLifecycleGate from "./ModuleLifecycleGate";\n' not in layout:
              if marker not in layout:
                  raise SystemExit("OnboardingTour import marker not found")
              layout = layout.replace(marker, marker + additions, 1)

          user_marker = "  const user = useAuth((state) => state.user);\n"
          lifecycle_state = (
              "  const lifecycleSettings = useModuleLifecycleStore(\n"
              "    (state) => state.settings,\n"
              "  );\n"
          )
          if lifecycle_state not in layout:
              if user_marker not in layout:
                  raise SystemExit("Layout user marker not found")
              layout = layout.replace(user_marker, user_marker + lifecycle_state, 1)

          old_visible = (
              "  const visible = useMemo(\n"
              "    () => getNavigationModules(user?.role),\n"
              "    [user?.role],\n"
              "  );\n"
          )
          new_visible = (
              "  const visible = useMemo(\n"
              "    () =>\n"
              "      filterModulesByLifecycle(\n"
              "        getNavigationModules(user?.role),\n"
              "        lifecycleSettings,\n"
              "      ),\n"
              "    [user?.role, lifecycleSettings],\n"
              "  );\n"
          )
          if old_visible in layout:
              layout = layout.replace(old_visible, new_visible, 1)
          elif new_visible not in layout:
              raise SystemExit("visible navigation block not found")

          outlet = "<Outlet />"
          wrapped = "<ModuleLifecycleGate><Outlet /></ModuleLifecycleGate>"
          if wrapped not in layout:
              if outlet not in layout:
                  raise SystemExit("Layout Outlet not found")
              layout = layout.replace(outlet, wrapped, 1)
          write(layout_path, layout)

          # 5. Substitui inventário estático pelo gestor auditável de lifecycle.
          settings_path = "frontend/src/pages/Configuracoes.tsx"
          settings = read(settings_path)
          import_marker = (
              'import IntegrationHealthPanel from '
              '"../components/IntegrationHealthPanel";\n'
          )
          component_import = (
              'import ModuleLifecycleSettings from '
              '"../components/ModuleLifecycleSettings";\n'
          )
          if component_import not in settings:
              if import_marker not in settings:
                  raise SystemExit("IntegrationHealthPanel import marker not found")
              settings = settings.replace(
                  import_marker, import_marker + component_import, 1
              )

          settings = settings.replace(
              'import {\n'
              '  canRoleAccessPath,\n'
              '  getModuleCatalog,\n'
              '  type ModuleStatus,\n'
              '} from "../config/moduleRegistry";\n',
              'import { canRoleAccessPath } from "../config/moduleRegistry";\n',
              1,
          )
          settings = re.sub(
              r"\nconst STATUS_LABEL: Record<ModuleStatus, string> = \{.*?\n\};"
              r"\n\nconst STATUS_CLASS: Record<ModuleStatus, string> = \{.*?\n\};\n",
              "\n",
              settings,
              count=1,
              flags=re.DOTALL,
          )
          settings = settings.replace("\n  const modules = getModuleCatalog();\n", "\n", 1)

          start_marker = '      {tab === "modulos" && isAdmin && (\n'
          end_marker = (
              '      {tab === "integracoes" && isAdmin && '
              '<IntegrationHealthPanel />}\n'
          )
          replacement = (
              '      {tab === "modulos" && isAdmin && '
              '<ModuleLifecycleSettings />}\n\n'
          )
          if start_marker in settings:
              start = settings.index(start_marker)
              end = settings.index(end_marker, start)
              settings = settings[:start] + replacement + settings[end:]
          elif replacement not in settings:
              raise SystemExit("static module settings block not found")
          write(settings_path, settings)
          PY

          rm -f .github/workflows/ci-readonly-kick.yml
          rm -f .github/workflows/restore-module-lifecycle-workflow.yml
          rm -f scripts/finalize_ci_readonly_cleanup.py
          rm -f .github/workflows/ci-readonly-finalize.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restaura cadeia Alembic e conclui lifecycle dos módulos"
          git push origin HEAD:fix/ci-readonly-cleanup
