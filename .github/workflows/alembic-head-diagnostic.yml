name: Alembic Head Diagnostic

on:
  pull_request:
    paths:
      - "backend/alembic/versions/**"
      - ".github/workflows/alembic-head-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Detect migration heads without importing application
        id: detect
        continue-on-error: true
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          revisions = {}
          referenced = set()
          parse_errors = []
          for path in Path("backend/alembic/versions").glob("*.py"):
              try:
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except Exception as exc:
                  parse_errors.append(f"{path.name}: {type(exc).__name__}: {exc}")
                  continue
              values = {}
              for node in tree.body:
                  if isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      for target in targets:
                          if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                              try:
                                  values[target.id] = ast.literal_eval(node.value)
                              except Exception as exc:
                                  parse_errors.append(
                                      f"{path.name}:{target.id}: {type(exc).__name__}: {exc}"
                                  )
              revision = values.get("revision")
              down = values.get("down_revision")
              if not revision:
                  parse_errors.append(f"{path.name}: revision não detectada")
                  continue
              revisions[revision] = path.name
              if isinstance(down, str):
                  referenced.add(down)
              elif isinstance(down, (tuple, list)):
                  referenced.update(item for item in down if isinstance(item, str))

          heads = sorted(set(revisions) - referenced)
          lines = [
              f"migration_count={len(revisions)}",
              f"head_count={len(heads)}",
          ]
          lines.extend(f"head={head} file={revisions[head]}" for head in heads)
          if parse_errors:
              lines.append(f"parse_error_count={len(parse_errors)}")
              lines.extend(f"parse_error={error}" for error in parse_errors)
          Path("alembic-head.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          if len(heads) != 1 or parse_errors:
              raise SystemExit("Alembic diagnostic requires review")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alembic-head-diagnostic
          path: alembic-head.txt
          if-no-files-found: error
          retention-days: 1
      - name: Enforce single clean head
        if: steps.detect.outcome != 'success'
        run: exit 1
