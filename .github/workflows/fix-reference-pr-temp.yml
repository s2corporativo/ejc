name: Fix Reference PR (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-and-verify:
    if: github.head_ref == 'feat/reference-dashboard-systemwide-20260816'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Node 22.22.2
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Format contextual action component
        working-directory: frontend
        run: npx prettier --write src/pages/CasoDetalhe/CaseDocumentActions.tsx

      - name: Targeted frontend regression tests
        working-directory: frontend
        run: |
          npx vitest run \
            src/stores/cadastroManual.test.ts \
            src/pages/CasoDetalhe/TabDocumentos.test.tsx \
            src/pages/CasoDetalhe/TabDocumentos.contexto.test.tsx \
            --reporter=dot

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Verify formatting
        working-directory: frontend
        run: npm run format:check

      - name: Commit verified frontend formatting
        shell: bash
        run: |
          set -euo pipefail
          git add frontend/src/pages/CasoDetalhe/CaseDocumentActions.tsx
          if git diff --cached --quiet; then
            echo 'No frontend formatting corrections pending.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(frontend): formatar ações contextuais do caso'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
