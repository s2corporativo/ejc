name: Architecture Inventory — Phase 0

on:
  workflow_dispatch:
  push:
    branches:
      - agent/organizacao-padronizacao-rotas-fluxos
    paths:
      - "scripts/generate_architecture_inventory.py"
      - "scripts/refine_architecture_inventory.py"
      - "scripts/tests/test_generate_architecture_inventory.py"
      - "scripts/tests/test_refine_architecture_inventory.py"
      - "config/architecture_inventory_overrides.json"
      - "backend/app/**"
      - "backend/alembic/versions/**"
      - "frontend/src/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/generate_architecture_inventory.py"
      - "scripts/refine_architecture_inventory.py"
      - "scripts/tests/test_generate_architecture_inventory.py"
      - "scripts/tests/test_refine_architecture_inventory.py"
      - "config/architecture_inventory_overrides.json"
      - "backend/app/**"
      - "backend/alembic/versions/**"
      - "frontend/src/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: architecture-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-pr431:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 431
    name: Finalize PR 431 atomically
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch duplicate guard and strict scenario status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          run_path = Path("qa/homologacao/run_homologacao.py")
          run_source = run_path.read_text(encoding="utf-8")
          old_run = '''            executaveis = [
                          passo for passo in resultado.passos if passo.status != BLOQUEADO
                      ]
                      if not resultado.passos or not executaveis:
                          resultado.status = BLOQUEADO
                      elif any(passo.status == FALHA for passo in executaveis):
                          resultado.status = FALHA
                      else:
                          resultado.status = PASS
          '''
          new_run = '''            executaveis = [
                          passo for passo in resultado.passos if passo.status != BLOQUEADO
                      ]
                      capacidades_ausentes = (
                          set(cenario.get("requisitos", [])) - self.caps
                      )
                      if capacidades_ausentes or not resultado.passos or not executaveis:
                          resultado.status = BLOQUEADO
                      elif any(passo.status == FALHA for passo in executaveis):
                          resultado.status = FALHA
                      elif any(passo.status == BLOQUEADO for passo in resultado.passos):
                          resultado.status = BLOQUEADO
                      else:
                          resultado.status = PASS
          '''
          if old_run not in run_source:
              raise SystemExit("anchor executar() não encontrado")
          run_path.write_text(run_source.replace(old_run, new_run, 1), encoding="utf-8")

          cases_path = Path("backend/app/routers/cases.py")
          cases_source = cases_path.read_text(encoding="utf-8")
          old_cases = '''    if not client:
                  raise HTTPException(status_code=422, detail="Cliente não encontrado")

              # `honorarios` (FASE 2) NÃO é coluna de Case — vira proposta vigente abaixo.
          '''
          new_cases = '''    if not client:
                  raise HTTPException(status_code=422, detail="Cliente não encontrado")

              # Idempotência concorrente: o mesmo cliente e número processual não
              # podem criar dois casos ativos. O advisory lock serializa requisições
              # simultâneas; a comparação normaliza CNJ mascarado e texto administrativo.
              if payload.numero_processo:
                  from app.services.validators_service import normalizar_cnj

                  numero = payload.numero_processo.strip()
                  digitos_cnj = normalizar_cnj(numero)
                  numero_chave = digitos_cnj if len(digitos_cnj) == 20 else numero.casefold()
                  await db.execute(
                      text("SELECT pg_advisory_xact_lock(hashtext(:chave))"),
                      {"chave": f"case_duplicate:{payload.client_id}:{numero_chave}"},
                  )
                  if len(digitos_cnj) == 20:
                      numero_igual = (
                          sqlfunc.regexp_replace(Case.numero_processo, r"\\D", "", "g")
                          == digitos_cnj
                      )
                  else:
                      numero_igual = (
                          sqlfunc.lower(sqlfunc.trim(Case.numero_processo))
                          == numero.casefold()
                      )
                  caso_existente = (
                      await db.execute(
                          select(Case.id).where(
                              Case.client_id == payload.client_id,
                              Case.deleted_at.is_(None),
                              numero_igual,
                          ).limit(1)
                      )
                  ).scalar_one_or_none()
                  if caso_existente:
                      raise HTTPException(
                          status_code=409,
                          detail="Já existe caso ativo para este cliente e número processual",
                      )

              # `honorarios` (FASE 2) NÃO é coluna de Case — vira proposta vigente abaixo.
          '''
          if old_cases not in cases_source:
              raise SystemExit("anchor de criação de caso não encontrado")
          cases_path.write_text(
              cases_source.replace(old_cases, new_cases, 1),
              encoding="utf-8",
          )

          Path("backend/tests/test_case_duplicate_guard.py").write_text(
              '''from pathlib import Path\n\n\ndef test_case_creation_has_concurrent_duplicate_guard():\n    source = (Path(__file__).parents[1] / "app/routers/cases.py").read_text(encoding="utf-8")\n    assert "pg_advisory_xact_lock" in source\n    assert "case_duplicate:" in source\n    assert "Já existe caso ativo para este cliente e número processual" in source\n    assert "Case.client_id == payload.client_id" in source\n    assert "Case.deleted_at.is_(None)" in source\n''',
              encoding="utf-8",
          )

          Path("backend/tests/test_homologacao_matrix.py").write_text(
              '''from __future__ import annotations\n\nimport importlib.util\nimport sys\nfrom pathlib import Path\n\n\nROOT = Path(__file__).parents[2]\nSCRIPT = ROOT / "qa/homologacao/run_homologacao.py"\nSPEC = importlib.util.spec_from_file_location("ejc_homologacao", SCRIPT)\nassert SPEC and SPEC.loader\nMODULE = importlib.util.module_from_spec(SPEC)\nsys.modules[SPEC.name] = MODULE\nSPEC.loader.exec_module(MODULE)\n\n\ndef test_matrix_is_semantically_strict():\n    matrix = MODULE.carregar_matriz()\n    assert MODULE.validar_matriz(matrix) == []\n    for scenario in matrix["cenarios"]:\n        for step in scenario.get("passos", []):\n            if step["tipo"] == "happy":\n                assert all(200 <= code < 300 for code in step["expected"])\n            if step["tipo"] == "idempotencia":\n                assert 201 not in step["expected"]\n\n\ndef test_runtime_fixtures_are_unique_and_not_persisted_in_matrix():\n    matrix = MODULE.carregar_matriz()\n    first, first_marker = MODULE.preparar_fixtures(matrix)\n    second, second_marker = MODULE.preparar_fixtures(matrix)\n    assert first_marker != second_marker\n    assert first["fixtures"]["cliente_pf"]["cpf"].isdigit()\n    assert len(first["fixtures"]["cliente_pf"]["cpf"]) == 11\n    assert first_marker in first["fixtures"]["cliente_pf"]["nome"]\n    assert matrix["fixtures"]["cliente_pf"]["nome"] == "HOMOLOG-FICTICIO PLACEHOLDER"\n\n\ndef _executor_with_statuses(*statuses):\n    executor = MODULE.Executor.__new__(MODULE.Executor)\n    executor.caps = {"stack"}\n    pending = list(statuses)\n    executor.executar_passo = lambda step, matrix: MODULE.PassoResult(\n        nome=step["nome"],\n        tipo=step["tipo"],\n        actor=step["actor"],\n        method=step["method"],\n        path=step["path"],\n        status=pending.pop(0),\n        status_code=200,\n        expected=step["expected"],\n    )\n    return executor\n\n\ndef _matrix(requisitos):\n    return {\n        "cenarios": [\n            {\n                "id": "H99",\n                "titulo": "Portal",\n                "dimensao": "Segurança",\n                "requisitos": requisitos,\n                "passos": [\n                    {\n                        "nome": "positivo",\n                        "tipo": "happy",\n                        "actor": "staff",\n                        "method": "GET",\n                        "path": "/api/health",\n                        "expected": [200],\n                        "requires": ["stack"],\n                    },\n                    {\n                        "nome": "negativo",\n                        "tipo": "negativo",\n                        "actor": "portal",\n                        "method": "GET",\n                        "path": "/api/cases",\n                        "expected": [403],\n                        "requires": ["stack", "portal"],\n                    },\n                ],\n            }\n        ]\n    }\n\n\ndef test_missing_scenario_capability_blocks_result():\n    executor = _executor_with_statuses(MODULE.PASS, MODULE.PASS)\n    assert executor.executar(_matrix(["stack", "portal"]))[0].status == MODULE.BLOQUEADO\n\n\ndef test_any_blocked_declared_step_blocks_result():\n    executor = _executor_with_statuses(MODULE.PASS, MODULE.BLOQUEADO)\n    assert executor.executar(_matrix(["stack"]))[0].status == MODULE.BLOQUEADO\n''',
              encoding="utf-8",
          )
          PY

      - name: Validate Python contracts
        run: |
          python3 -m py_compile qa/homologacao/run_homologacao.py backend/app/routers/cases.py
          python3 qa/homologacao/run_homologacao.py --validate

      - name: Apply project Prettier to Raio-X
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/pages/RaioXProcesso.tsx
          npx prettier --check src/pages/RaioXProcesso.tsx

      - name: Restore workflow and commit product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EJC Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/architecture-inventory.yml
          git add \
            .github/workflows/architecture-inventory.yml \
            qa/homologacao/run_homologacao.py \
            backend/app/routers/cases.py \
            backend/tests/test_case_duplicate_guard.py \
            backend/tests/test_homologacao_matrix.py \
            frontend/src/pages/RaioXProcesso.tsx
          git commit -m "fix(go-live): idempotência de casos e homologação rigorosa"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  inventory:
    name: Generate complete architecture inventory
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Validate Python runtime
        run: python3 --version
      - name: Test inventory pipeline
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest \
            scripts.tests.test_generate_architecture_inventory \
            scripts.tests.test_refine_architecture_inventory \
            -v 2>&1 | tee architecture-test.log
      - name: Publish test diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-test-log
          path: architecture-test.log
          if-no-files-found: warn
          retention-days: 7
      - name: Generate raw inventory
        run: |
          python3 scripts/generate_architecture_inventory.py \
            --output "$RUNNER_TEMP/ejc-architecture-inventory" \
            --check
      - name: Refine mounts and duplicate families
        run: |
          python3 scripts/refine_architecture_inventory.py \
            --output "$RUNNER_TEMP/ejc-architecture-inventory" \
            --check
      - name: Publish summary
        run: cat "$RUNNER_TEMP/ejc-architecture-inventory/README.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete inventory
        uses: actions/upload-artifact@v7
        with:
          name: ejc-architecture-inventory
          path: ${{ runner.temp }}/ejc-architecture-inventory
          if-no-files-found: error
          retention-days: 30
