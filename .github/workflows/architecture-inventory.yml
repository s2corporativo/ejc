name: Architecture Inventory — Phase 0

on:
  workflow_dispatch:
  push:
    branches:
      - agent/organizacao-padronizacao-rotas-fluxos
    paths:
      - "scripts/generate_architecture_inventory.py"
      - "scripts/refine_architecture_inventory.py"
      - "scripts/tests/test_generate_architecture_inventory.py"
      - "scripts/tests/test_refine_architecture_inventory.py"
      - "config/architecture_inventory_overrides.json"
      - "backend/app/**"
      - "backend/alembic/versions/**"
      - "frontend/src/**"
      - ".github/workflows/architecture-inventory.yml"
  pull_request:
    paths:
      - "scripts/generate_architecture_inventory.py"
      - "scripts/refine_architecture_inventory.py"
      - "scripts/tests/test_generate_architecture_inventory.py"
      - "scripts/tests/test_refine_architecture_inventory.py"
      - "config/architecture_inventory_overrides.json"
      - "backend/app/**"
      - "backend/alembic/versions/**"
      - "frontend/src/**"
      - ".github/workflows/architecture-inventory.yml"

permissions:
  contents: write

concurrency:
  group: architecture-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-api:
    name: Format API client with repository Prettier
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'chore/ejc-10-10-release-governance' }}
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ejc-10-10-release-governance
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Aplicar Prettier oficial apenas ao arquivo apontado pelo gate
        working-directory: frontend
        run: |
          npm ci
          npx prettier src/lib/api.ts --write
      - name: Publicar correção determinística
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/api.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(frontend): formatar cliente API com Prettier"
          git push origin HEAD:chore/ejc-10-10-release-governance

  inventory:
    name: Generate complete architecture inventory
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate Python runtime
        run: python3 --version

      - name: Test inventory pipeline
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest \
            scripts.tests.test_generate_architecture_inventory \
            scripts.tests.test_refine_architecture_inventory \
            -v 2>&1 | tee architecture-test.log

      - name: Publish test diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-test-log
          path: architecture-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Generate raw inventory
        run: |
          python3 scripts/generate_architecture_inventory.py \
            --output "$RUNNER_TEMP/ejc-architecture-inventory" \
            --check

      - name: Refine mounts and duplicate families
        run: |
          python3 scripts/refine_architecture_inventory.py \
            --output "$RUNNER_TEMP/ejc-architecture-inventory" \
            --check

      - name: Publish summary
        run: cat "$RUNNER_TEMP/ejc-architecture-inventory/README.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete inventory
        uses: actions/upload-artifact@v7
        with:
          name: ejc-architecture-inventory
          path: ${{ runner.temp }}/ejc-architecture-inventory
          if-no-files-found: error
          retention-days: 30
