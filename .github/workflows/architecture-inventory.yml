name: Architecture Inventory — Phase 0

on:
  workflow_dispatch:
  push:
    branches:
      - agent/organizacao-padronizacao-rotas-fluxos
    paths:
      - "scripts/generate_architecture_inventory.py"
      - "scripts/refine_architecture_inventory.py"
      - "scripts/tests/test_generate_architecture_inventory.py"
      - "scripts/tests/test_refine_architecture_inventory.py"
      - "config/architecture_inventory_overrides.json"
      - "backend/app/**"
      - "backend/alembic/versions/**"
      - "frontend/src/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/generate_architecture_inventory.py"
      - "scripts/refine_architecture_inventory.py"
      - "scripts/tests/test_generate_architecture_inventory.py"
      - "scripts/tests/test_refine_architecture_inventory.py"
      - "config/architecture_inventory_overrides.json"
      - "backend/app/**"
      - "backend/alembic/versions/**"
      - "frontend/src/**"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: architecture-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-pr431:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 431
    name: Apply project Prettier and restore workflow
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply project formatter
        working-directory: frontend
        run: |
          npm ci
          npx prettier --write src/pages/RaioXProcesso.tsx
          npx prettier --check src/pages/RaioXProcesso.tsx

      - name: Restore workflow files and commit only formatting
        run: |
          set -euo pipefail
          git config user.name "EJC Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/architecture-inventory.yml
          rm -f .github/workflows/temporary-format-pr431.yml
          git add frontend/src/pages/RaioXProcesso.tsx \
            .github/workflows/architecture-inventory.yml \
            .github/workflows/temporary-format-pr431.yml
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "style(frontend): aplicar Prettier no Raio-X"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  inventory:
    name: Generate complete architecture inventory
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate Python runtime
        run: python3 --version

      - name: Test inventory pipeline
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest \
            scripts.tests.test_generate_architecture_inventory \
            scripts.tests.test_refine_architecture_inventory \
            -v 2>&1 | tee architecture-test.log

      - name: Publish test diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-test-log
          path: architecture-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Generate raw inventory
        run: |
          python3 scripts/generate_architecture_inventory.py \
            --output "$RUNNER_TEMP/ejc-architecture-inventory" \
            --check

      - name: Refine mounts and duplicate families
        run: |
          python3 scripts/refine_architecture_inventory.py \
            --output "$RUNNER_TEMP/ejc-architecture-inventory" \
            --check

      - name: Publish summary
        run: cat "$RUNNER_TEMP/ejc-architecture-inventory/README.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete inventory
        uses: actions/upload-artifact@v7
        with:
          name: ejc-architecture-inventory
          path: ${{ runner.temp }}/ejc-architecture-inventory
          if-no-files-found: error
          retention-days: 30
