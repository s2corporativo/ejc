name: One-time frontend security refresh

# Workflow temporário e restrito à branch/PR de integração. Ele existe apenas
# para gerar um lockfile reproduzível no runner oficial, sem edição manual de
# hashes. O filtro pelo próprio arquivo impede recursão após o commit gerado.
on:
  push:
    branches: [codex/auditoria-final-design-20260805]
    paths:
      - .github/workflows/refresh-frontend-security-lock.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/refresh-frontend-security-lock.yml

permissions:
  contents: write

concurrency:
  group: one-time-frontend-security-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Migrar React Router e regenerar lockfile com segurança
    if: github.head_ref == 'codex/auditoria-final-design-20260805' || github.ref_name == 'codex/auditoria-final-design-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout da branch de integração
        uses: actions/checkout@v7
        with:
          ref: codex/auditoria-final-design-20260805
          fetch-depth: 0

      - name: Instalar Node 22.22
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Migrar imports declarativos para react-router
        shell: bash
        run: |
          set -euo pipefail
          find frontend/src frontend/tests -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 \
            | xargs -0 sed -i -E "s/from ([\"'])react-router-dom\1/from \"react-router\"/g"
          if grep -R -n -E "from ['\"]react-router-dom['\"]" frontend/src frontend/tests; then
            echo "Imports legados permaneceram após a migração" >&2
            exit 1
          fi

      - name: Atualizar dependências e lockfile sem force
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm pkg delete dependencies.react-router-dom
          npm pkg set dependencies.react-router="8.3.0"
          npm pkg set engines.node=">=22.22.0"
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts

      - name: Alinhar imagem de build do frontend
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/FROM node:20-slim AS build/FROM node:22.22-slim AS build/' frontend/Dockerfile
          grep -q 'FROM node:22.22-slim AS build' frontend/Dockerfile

      - name: Instalação reproduzível
        working-directory: frontend
        run: npm ci

      - name: Formatar alterações mecânicas
        working-directory: frontend
        run: npm run format

      - name: Lint, testes, build e auditoria
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run format:check
          npm run lint:eslint
          npm run test -- --reporter=dot
          npm run build
          npm audit --audit-level=high

      - name: Registrar atualização validada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json frontend/Dockerfile \
            frontend/src frontend/tests
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "fix(frontend): atualizar router e dependências vulneráveis"
          git push origin HEAD:codex/auditoria-final-design-20260805
