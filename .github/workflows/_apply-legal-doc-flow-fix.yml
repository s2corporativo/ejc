name: Apply legal document flow hardening

on:
  push:
    branches:
      - fix/legal-doc-flow-total

permissions:
  contents: write

concurrency:
  group: apply-legal-doc-flow-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legal-doc-flow-total
          fetch-depth: 0
      - name: Materialize deterministic patcher
        shell: bash
        run: |
          mkdir -p scripts/maintenance
          printf '%s' '' | base64 --decode | gzip --decompress > scripts/maintenance/apply_legal_doc_flow_fix.py
          python -m py_compile scripts/maintenance/apply_legal_doc_flow_fix.py
      - name: Apply source and regression changes
        run: python scripts/maintenance/apply_legal_doc_flow_fix.py
      - name: Compile changed Python modules
        run: |
          python -m compileall -q \
            backend/app/routers/legal_docs.py \
            backend/app/routers/ai.py \
            backend/app/services/validador_juridico_service.py \
            backend/tests/test_legal_doc_flow_contract.py \
            backend/tests/test_legal_doc_ai_log_vinculo_dblevel.py \
            qa/homologacao/run_fluxo_legal_doc_e2e.py
      - name: Commit hardened flow
        shell: bash
        run: |
          rm -f scripts/maintenance/apply_legal_doc_flow_fix.py
          rmdir scripts/maintenance 2>/dev/null || true
          rm -f .github/workflows/_apply-legal-doc-flow-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden validation approval and PDF flow'
          git push origin HEAD:fix/legal-doc-flow-total
