name: Fix Premium Responsive Test Temp

on:
  push:
    branches:
      - refactor/ejc-premium-gold-graphite-20260805

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ejc-premium-gold-graphite-20260805
          fetch-depth: 0

      - name: Corrigir seletor do botão interno do drawer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/tests/premium-dashboard-responsividade.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''    const closeButtons = page.getByRole("button", { name: "Fechar menu" });
    if ((await closeButtons.count()) > 0) await closeButtons.first().click();'''
          new = '''    const drawerCloseButton = sidebar.getByRole("button", {
      name: "Fechar menu",
    });
    if ((await drawerCloseButton.count()) > 0) await drawerCloseButton.click();'''
          if old not in text:
              raise SystemExit("marcador do fechamento do drawer não encontrado")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit da correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/tests/premium-dashboard-responsividade.mjs
          git commit -m "fix(test): fecha drawer pelo botao interno"
          git push origin HEAD:refactor/ejc-premium-gold-graphite-20260805
