name: Temporary Prettier PR451

on:
  push:
    branches:
      - feat/fase-1-navegacao-canonica-caso

permissions:
  contents: write

concurrency:
  group: tmp-prettier-pr451
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/fase-1-navegacao-canonica-caso

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Format target
        working-directory: frontend
        run: npx prettier --write src/components/__tests__/CaseContextBar.test.tsx

      - name: Commit formatted file
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/__tests__/CaseContextBar.test.tsx
          git commit -m "style(frontend): aplicar prettier no teste de navegação"
          git push origin HEAD:feat/fase-1-navegacao-canonica-caso
