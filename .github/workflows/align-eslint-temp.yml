name: Align ESLint Metadata (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  align-eslint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Align manifest and lock root metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for file in [Path('frontend/package.json'), Path('frontend/package-lock.json')]:
              text = file.read_text(encoding='utf-8')
              old = '"@typescript-eslint/parser": "^8.64.0"'
              new = '"@typescript-eslint/parser": "^8.66.0"'
              if old in text:
                  text = text.replace(old, new, 1)
                  file.write_text(text, encoding='utf-8')
              elif new not in text:
                  raise SystemExit(f'parser metadata não encontrada em {file}')
          PY

      - name: Commit alignment if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Metadata já alinhada."
          else
            git commit -m "chore(frontend): alinhar metadata do typescript-eslint"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Node 22.22.2
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint redesigned TypeScript files
        working-directory: frontend
        run: >-
          npx eslint
          src/components/LayoutReference.tsx
          src/components/SidebarWeekCalendar.tsx
          src/pages/DashboardUltra.tsx
          src/pages/DashboardUltra.test.tsx
          src/pages/AssistenteIA.tsx
          src/App.tsx
          src/main.tsx

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npx vite build
