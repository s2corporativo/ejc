name: Apply legal document flow hardening final

on:
  push:
    branches:
      - fix/legal-doc-flow-final-v2
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: apply-legal-doc-flow-final-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/legal-doc-flow-final-v2')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/legal-doc-flow-final-v2
          fetch-depth: 0
      - name: Materializar aplicador determinístico revisado
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          import subprocess
          import sys
          from pathlib import Path

          source = Path('.github/workflows/_apply-legal-doc-flow-fix.yml').read_text(encoding='utf-8')
          match = re.search(
              r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 --decode \| gzip --decompress",
              source,
          )
          if not match:
              raise SystemExit('Payload determinístico não encontrado')

          patcher = Path('scripts/maintenance/apply_legal_doc_flow_fix.py')
          patcher.parent.mkdir(parents=True, exist_ok=True)
          patcher.write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          patcher_source = patcher.read_text(encoding='utf-8')

          regex_old = "new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)"
          regex_new = "new_text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)"
          if patcher_source.count(regex_old) != 1:
              raise SystemExit('Assinatura de replace_regex_once inesperada')
          patcher_source = patcher_source.replace(regex_old, regex_new)

          patcher_lines = patcher_source.splitlines()

          # Compatibilidade estrita para os locks. O parser legado do aplicador
          # inclui o exportar_docx no bloco do Documento Único e, por isso,
          # encontra duas consultas idênticas. A primeira é sempre a consulta
          # da peça principal do endpoint e é a única que deve receber o lock.
          replace_defs = [
              index
              for index, line in enumerate(patcher_lines)
              if line.startswith('def replace_once(')
          ]
          if len(replace_defs) != 1:
              raise SystemExit(f'Definição replace_once inesperada: {len(replace_defs)}')
          count_index = next(
              (
                  index
                  for index in range(replace_defs[0] + 1, replace_defs[0] + 10)
                  if patcher_lines[index].strip() == 'count = text.count(old)'
              ),
              None,
          )
          if count_index is None:
              raise SystemExit('Contagem de replace_once não encontrada')
          compat_lines = [
              '    if label == "lock documento_unico_impressao" and count == 2:',
              '        return text.replace(old, new, 1)',
              '    if count == 0 and label.startswith("lock "):',
              '        old_variant = old.replace("\\n    ).scalar_one_or_none()", "\\n    )).scalar_one_or_none()")',
              '        new_variant = new.replace("\\n    ).scalar_one_or_none()", "\\n    )).scalar_one_or_none()")',
              '        variant_count = text.count(old_variant)',
              '        if old_variant != old and variant_count == 1:',
              '            return text.replace(old_variant, new_variant, 1)',
          ]
          patcher_lines[count_index + 1 : count_index + 1] = compat_lines

          # O regex imediatamente anterior já corrige o endpoint atualizar;
          # remove apenas o fallback legado duplicado desse mesmo lock.
          labels = [
              index
              for index, line in enumerate(patcher_lines)
              if '"lock atualizar",' in line
          ]
          if len(labels) != 1:
              raise SystemExit(f'Fallback lock atualizar inesperado: {len(labels)}')
          label_index = labels[0]
          start = next(
              (
                  index
                  for index in range(label_index, max(-1, label_index - 20), -1)
                  if patcher_lines[index].strip() == 'block = replace_once('
              ),
              None,
          )
          end = next(
              (
                  index
                  for index in range(label_index + 1, min(len(patcher_lines), label_index + 6))
                  if patcher_lines[index].strip() == ')'
              ),
              None,
          )
          if start is None or end is None or not start < label_index < end:
              raise SystemExit(
                  f'Limites do fallback lock atualizar inválidos: start={start}, label={label_index}, end={end}'
              )
          del patcher_lines[start : end + 1]
          patcher_source = '\n'.join(patcher_lines) + '\n'

          patcher.write_text(patcher_source, encoding='utf-8')
          subprocess.run([sys.executable, '-m', 'py_compile', str(patcher)], check=True)
          subprocess.run([sys.executable, str(patcher)], check=True)
          PY
      - name: Compilar módulos alterados
        run: |
          python3 -m compileall -q \
            backend/app/routers/legal_docs.py \
            backend/app/routers/ai.py \
            backend/app/services/validador_juridico_service.py \
            backend/tests/test_legal_doc_flow_contract.py \
            backend/tests/test_legal_doc_ai_log_vinculo_dblevel.py \
            qa/homologacao/run_fluxo_legal_doc_e2e.py
      - name: Gravar correção funcional e remover mecanismo temporário
        shell: bash
        run: |
          rm -f scripts/maintenance/apply_legal_doc_flow_fix.py
          rm -f scripts/maintenance/sitecustomize.py
          rm -rf scripts/maintenance/__pycache__
          rm -f scripts/maintenance/.trigger-legal-doc-flow
          rmdir scripts/maintenance 2>/dev/null || true
          rm -f .github/workflows/_apply-legal-doc-flow-fix.yml
          rm -f .github/workflows/_apply-legal-doc-flow-hosted-final.yml
          git show origin/main:.github/workflows/ejc-release-gate.yml > .github/workflows/ejc-release-gate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden validation approval and PDF flow'
          git push origin HEAD:fix/legal-doc-flow-final-v2
