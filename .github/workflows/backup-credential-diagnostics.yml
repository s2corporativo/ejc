name: Backup Credential Diagnostics

on:
  push:
    branches:
      - diagnostic/prod-backend-20260817
    paths:
      - .github/workflows/backup-credential-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Diagnosticar service account e mounts sem conteúdo sensível
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          env = json.loads(subprocess.check_output([
              "docker", "inspect", "ejc_worker", "--format", "{{json .Config.Env}}"
          ], text=True))
          values = dict(item.split("=", 1) for item in env if "=" in item)
          path = values.get("BACKUP_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE", "").strip()
          print("service_account_file_configured=" + str(bool(path)).lower())
          if path:
              print("service_account_container_basename=" + os.path.basename(path))
              print("service_account_container_dir=" + os.path.dirname(path))
          mounts = json.loads(subprocess.check_output([
              "docker", "inspect", "ejc_worker", "--format", "{{json .Mounts}}"
          ], text=True))
          destinations = sorted(str(m.get("Destination") or "") for m in mounts)
          print("worker_mount_destinations=" + ",".join(destinations))
          covered = any(path == d or (d and path.startswith(d.rstrip("/") + "/")) for d in destinations) if path else False
          print("service_account_path_covered_by_mount=" + str(covered).lower())
          PY

          docker exec -i ejc_worker python - <<'PY'
          import os
          path = os.environ.get("BACKUP_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE", "").strip()
          print("service_account_exists_in_worker=" + str(bool(path and os.path.isfile(path))).lower())
          print("service_account_readable_in_worker=" + str(bool(path and os.path.isfile(path) and os.access(path, os.R_OK))).lower())
          PY

          for candidate in /run/secrets/ejc-backup-drive.json /opt/ejc/secrets/ejc-backup-drive.json /opt/ejc/ejc-backup-drive.json; do
            if sudo test -f "$candidate"; then
              echo "host_candidate_present=$(basename "$candidate")@$(dirname "$candidate")"
            fi
          done

      - name: Diagnosticar remote rclone sem imprimir token ou credencial
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f /opt/ejc/docker-compose.yml run --rm --no-deps -T backend python - <<'PY'
          import configparser, json, os, subprocess
          from pathlib import Path

          remote_spec = os.environ.get("BACKUP_RCLONE_REMOTE", "").strip()
          remote_name = remote_spec.split(":", 1)[0] if ":" in remote_spec else remote_spec
          print("rclone_remote_configured=" + str(bool(remote_name)).lower())
          try:
              version = subprocess.check_output(["rclone", "version"], text=True, stderr=subprocess.STDOUT).splitlines()[0]
          except Exception:
              version = "unavailable"
          print("rclone_version=" + version)
          try:
              conf_path = subprocess.check_output(["rclone", "config", "file"], text=True, stderr=subprocess.STDOUT).splitlines()[-1].strip()
          except Exception:
              conf_path = "/root/.config/rclone/rclone.conf"
          conf = Path(conf_path)
          print("rclone_config_exists=" + str(conf.is_file()).lower())
          print("rclone_config_writable=" + str(conf.is_file() and os.access(conf, os.W_OK)).lower())
          if conf.is_file() and remote_name:
              parser = configparser.RawConfigParser()
              parser.read(conf)
              exists = parser.has_section(remote_name)
              print("selected_remote_section_exists=" + str(exists).lower())
              if exists:
                  remote_type = parser.get(remote_name, "type", fallback="unknown")
                  print("selected_remote_type=" + remote_type)
                  token_raw = parser.get(remote_name, "token", fallback="").strip()
                  print("selected_remote_token_present=" + str(bool(token_raw)).lower())
                  if token_raw:
                      try:
                          token = json.loads(token_raw)
                          print("selected_remote_token_json_valid=true")
                          print("selected_remote_refresh_token_present=" + str(bool(token.get("refresh_token"))).lower())
                          print("selected_remote_expiry_present=" + str(bool(token.get("expiry"))).lower())
                          if token.get("expiry"):
                              print("selected_remote_expiry=" + str(token.get("expiry")))
                      except Exception:
                          print("selected_remote_token_json_valid=false")
          PY
