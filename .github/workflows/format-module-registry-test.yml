name: Format Module Registry Test

on:
  push:
    branches:
      - chore/ejc-10-10-release-governance

permissions:
  contents: write

concurrency:
  group: format-module-registry-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/ejc-10-10-release-governance

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Formatar teste com o Prettier oficial do projeto
        working-directory: frontend
        run: |
          npm ci --silent
          npx prettier --write src/config/moduleRegistry.test.ts

      - name: Publicar formatação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/config/moduleRegistry.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(frontend): formatar teste do registry [prettier-fixed]"
          git push origin HEAD:chore/ejc-10-10-release-governance
