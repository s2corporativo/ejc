          dossie_path = "frontend/src/pages/DossieCliente.tsx"
          dossie = read(dossie_path)
          start = dossie.index("  const [carregandoPecas, setCarregandoPecas]")
          end = dossie.index("  const baixarPeca = async", start)
          dossie = dossie[:start] + '''  const [carregandoPecas, setCarregandoPecas] = useState(false);
  const [erroPecas, setErroPecas] = useState("");

  const carregarPecasAdmissao = useCallback(async () => {
    if (!clientId) return;
    setCarregandoPecas(true);
    setErroPecas("");
    try {
      const r = await api.get(`/clients/${clientId}/pecas-geradas`);
      setPecasAdmissao(Array.isArray(r.data) ? r.data : []);
    } catch {
      // Não converte indisponibilidade/403/429 em "lista vazia": preservar o
      // último dado conhecido e deixar o operador tentar novamente.
      setErroPecas("Não foi possível carregar os documentos de admissão.");
    } finally {
      setCarregandoPecas(false);
    }
  }, [clientId]);

  useEffect(() => {
    void carregarPecasAdmissao();
  }, [carregarPecasAdmissao]);

''' + dossie[end:]

          start = dossie.index("  const aprovarPeca = async")
          end = dossie.index("  const [editOpen", start)
          dossie = dossie[:start] + dossie[end:]

          marker = '          {/* Documentos de Admissão — peças geradas no cadastro do cliente */}\n'
          if dossie.count(marker) != 1:
              raise SystemExit("DossieCliente: marcador de documentos de admissão não encontrado")
          dossie = dossie.replace(
              marker,
              marker + '''          {erroPecas && (
            <div className="card mb-4 px-4 py-3 flex items-center justify-between gap-3">
              <p className="text-sm text-danger-700">{erroPecas}</p>
              <button
                type="button"
                onClick={() => void carregarPecasAdmissao()}
                className="text-xs font-medium text-navy border border-bronze-pale rounded px-2.5 py-1 hover:bg-bronze-50"
              >
                Tentar novamente
              </button>
            </div>
          )}
          {carregandoPecas && pecasAdmissao.length === 0 && (
            <div className="card mb-4 px-4 py-3 text-sm text-slate-500">
              Carregando documentos de admissão…
            </div>
          )}
''',
              1,
          )
          old_status = '''                  const ehAprovada =
                    p.status === "aprovada" || p.status === "aprovado";
'''
          new_status = '''                  const podeRevisar = ![
                    "aprovada",
                    "final",
                    "protocolada",
                  ].includes(p.status);
'''
          if dossie.count(old_status) != 1:
              raise SystemExit("DossieCliente: cálculo ehAprovada não encontrado")
          dossie = dossie.replace(old_status, new_status, 1)
          old_button = '''                      {!ehAprovada && (
                        <button
                          onClick={() => aprovarPeca(p.id)}
                          disabled={aprovandoId === p.id}
                          title="Aprovar após revisão (exige validação jurídica)"
                          className="text-xs font-medium text-navy border border-bronze-pale rounded px-2.5 py-1 hover:bg-bronze-50 disabled:opacity-50"
                        >
                          {aprovandoId === p.id ? "Aprovando..." : "Aprovar"}
                        </button>
                      )}
'''
          new_button = '''                      {podeRevisar && (
                        <Link
                          to="/pecas"
                          title="Abrir o fluxo de conferência e assinatura"
                          className="text-xs font-medium text-navy border border-bronze-pale rounded px-2.5 py-1 hover:bg-bronze-50"
                        >
                          Revisar e assinar
                        </Link>
                      )}
'''
          if dossie.count(old_button) != 1:
