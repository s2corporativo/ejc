name: Apply Security P0 on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/security-rbac-pii-p0'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-rbac-pii-p0
      - name: Execute versioned deterministic patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-security-p0.yml').read_text(encoding='utf-8')
          start = workflow.index("python - <<'PY'\n") + len("python - <<'PY'\n")
          end = workflow.index("\n          PY", start)
          raw = workflow[start:end]
          code = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          )
          exec(compile(code, 'apply-security-p0', 'exec'))
          PY
          rm -f .github/workflows/apply-security-p0.yml
          rm -f .github/workflows/apply-security-p0-pr.yml
          rm -f .github/workflows/diagnose-security-p0.yml
          rm -f scripts/.security-p0-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): restringe CRM e ownership de documentos avulsos"
          git push origin HEAD:fix/security-rbac-pii-p0
