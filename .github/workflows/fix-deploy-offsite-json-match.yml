name: Fix Deploy Offsite JSON Match

# Workflow temporário: remove-se após aplicar e validar o patch.
on:
  push:
    branches:
      - fix/backup-rclone-runtime-20260817
    paths:
      - .github/workflows/fix-deploy-offsite-json-match.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/backup-rclone-runtime-20260817

      - name: Corrigir match e executar regressões de continuidade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/deploy_vps_safe.sh')
          text = path.read_text()
          old_false = '''if printf '%s' "$BACKUP_SAIDA" | grep -q '"offsite_ok": false'; then'''
          new_false = '''if printf '%s' "$BACKUP_SAIDA" | grep -Eq '"offsite_ok"[[:space:]]*:[[:space:]]*false'; then'''
          old_true = '''if ! printf '%s' "$BACKUP_SAIDA" | grep -q '"offsite_ok": true'; then'''
          new_true = '''if ! printf '%s' "$BACKUP_SAIDA" | grep -Eq '"offsite_ok"[[:space:]]*:[[:space:]]*true'; then'''
          if old_false not in text or old_true not in text:
              raise SystemExit('padrões offsite esperados não encontrados')
          path.write_text(text.replace(old_false, new_false, 1).replace(old_true, new_true, 1))
          PY
          bash scripts/tests/test_backup_wrapper.sh
          bash scripts/tests/test_deploy_rollback.sh
          bash -n scripts/backup.sh scripts/deploy_vps_safe.sh

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EJC Continuity Fix"
          git config user.email "continuity-fix@ejc.local"
          git add scripts/deploy_vps_safe.sh
          git commit -m "fix(deploy): aceitar JSON offsite compacto sem perder fail-closed"
          git push origin HEAD:fix/backup-rclone-runtime-20260817
