name: DPT360 Fix Temp

on:
  push:
    branches: [feat/910-dpt360-wave1]

permissions:
  contents: write

concurrency:
  group: dpt360-fix-temp
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/910-dpt360-wave1
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Registrar rota dinâmica e formatar escopo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/config/moduleRegistry.tsx')
          text = path.read_text()
          if 'path: "/dpt360/empresas/:clientId"' not in text:
              marker = '''  // Entrada Única (Bloco 3, docs/DESENHO_BLOCO3_TELAS.md): porta de entrada\n'''
              if marker not in text:
                  raise SystemExit('marcador de inserção DPT 360 não encontrado')
              block = '''  // Empresa 360 possui rota dinâmica explícita para que guards de integridade\n  // reconheçam links canônicos /dpt360/empresas/:clientId. O wildcard segue\n  // atendendo as demais subrotas internas do mesmo workspace.\n  {\n    key: "dpt360-company-detail",\n    path: "/dpt360/empresas/:clientId",\n    label: "Empresa 360",\n    description: "Visão jurídica empresarial do cliente pessoa jurídica.",\n    group: "Pesquisar & IA",\n    icon: BriefcaseBusiness,\n    component: Dpt360Workspace,\n    roles: ROLES.compliance,\n    showInNav: false,\n    status: "hidden",\n    helpKey: "dpt360",\n    sensitive: true,\n    usesAI: true,\n    backendPrefixes: ["/api/clients", "/api/cases", "/api/deadlines"],\n  },\n'''
              text = text.replace(marker, block + marker, 1)
          text = text.replace(
              'reason: "Despesas foi incorporado ao workspace financeiro."',
              'reason: "Despesas foram incorporadas ao workspace financeiro."',
          )
          text = text.replace(
              'reason: "Jurimetria foi incorporado ao workspace de Inteligência Jurídica."',
              'reason: "Jurimetria foi incorporada ao workspace de Inteligência Jurídica."',
          )
          path.write_text(text)
          PY
          cd frontend
          npx prettier --write \
            src/config/moduleRegistry.tsx \
            src/config/moduleRegistry.test.ts \
            src/pages/dpt360/Dpt360Workspace.tsx \
            src/pages/dpt360/model.ts \
            src/pages/dpt360/model.test.ts
          npm test -- src/config/moduleRegistry.test.ts src/config/internalLinks.test.tsx src/pages/dpt360/model.test.ts
          git diff --check

      - name: Commitar correção na própria branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/src/config/moduleRegistry.tsx frontend/src/config/moduleRegistry.test.ts frontend/src/pages/dpt360; then
            echo "Nenhuma alteração adicional necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/config/moduleRegistry.tsx frontend/src/config/moduleRegistry.test.ts frontend/src/pages/dpt360
          git commit -m "fix(dpt360): registrar Empresa 360 e formatar workspace"
          git push origin HEAD:feat/910-dpt360-wave1
