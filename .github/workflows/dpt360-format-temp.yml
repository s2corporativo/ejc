name: DPT360 Format Temp

on:
  push:
    branches: [feat/910-dpt360-wave1]

permissions:
  contents: write

concurrency:
  group: dpt360-format-temp
  cancel-in-progress: false

# Workflow efêmero: será removido assim que o commit de formatação for gerado.
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/910-dpt360-wave1
          fetch-depth: 0

      - name: Instalar Node 22.22
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Corrigir somente o escopo DPT 360
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/config/moduleRegistry.tsx')
          text = path.read_text()
          text = text.replace(
              'reason: "Despesas foi incorporado ao workspace financeiro."',
              'reason: "Despesas foram incorporadas ao workspace financeiro."',
          )
          text = text.replace(
              'reason: "Jurimetria foi incorporado ao workspace de Inteligência Jurídica."',
              'reason: "Jurimetria foi incorporada ao workspace de Inteligência Jurídica."',
          )
          path.write_text(text)
          PY
          cd frontend
          npx prettier --write \
            src/config/moduleRegistry.tsx \
            src/pages/dpt360/Dpt360Workspace.tsx \
            src/pages/dpt360/model.ts
          git diff --check

      - name: Commitar formatação na própria branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            frontend/src/config/moduleRegistry.tsx \
            frontend/src/pages/dpt360/Dpt360Workspace.tsx \
            frontend/src/pages/dpt360/model.ts; then
            echo "Nenhuma alteração de formatação necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/config/moduleRegistry.tsx \
            frontend/src/pages/dpt360/Dpt360Workspace.tsx \
            frontend/src/pages/dpt360/model.ts
          git commit -m "style(dpt360): aplicar Prettier no workspace empresarial"
          git push origin HEAD:feat/910-dpt360-wave1
