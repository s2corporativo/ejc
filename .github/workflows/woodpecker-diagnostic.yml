name: Woodpecker Diagnostic 1556

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woodpecker-diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'diag/woodpecker-failure-1556'
    name: diag / backend
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ejc_user
          POSTGRES_PASSWORD: ejc_pass
          POSTGRES_DB: ejc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ejc_user -d ejc_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://ejc_user:ejc_pass@127.0.0.1:5432/ejc_db
      DATABASE_URL_SYNC: postgresql://ejc_user:ejc_pass@127.0.0.1:5432/ejc_db
      SCHEMA_CHECK_DATABASE_URL: postgresql://ejc_user:ejc_pass@127.0.0.1:5432/ejc_db
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependências nativas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends jq libmagic1 poppler-utils tesseract-ocr libpango-1.0-0 libpangocairo-1.0-0 libcairo2 postgresql-client
      - name: Dependências Python
        working-directory: backend
        run: pip install --quiet -r requirements.txt
      - name: Ruff
        working-directory: backend
        run: ruff check app
      - name: Compileall
        working-directory: backend
        run: python -m compileall app -q
      - name: Alembic heads
        working-directory: backend
        run: python -m alembic heads
      - name: Alembic upgrade head
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Gates estruturais
        working-directory: backend
        run: pytest tests/test_alembic_single_head.py tests/test_rotas_registro_explicito.py -q
      - name: Pytest completo
        working-directory: backend
        run: pytest tests -q

  frontend:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'diag/woodpecker-failure-1556'
    name: diag / frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Testes
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  ops-contracts:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'diag/woodpecker-failure-1556'
    name: diag / ops-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe bash e Python
        run: |
          bash -n scripts/backup.sh scripts/backup/ativar_backup.sh scripts/deploy_vps_safe.sh scripts/deploy_workflow_transaction.sh scripts/tests/test_backup_wrapper.sh scripts/tests/test_deploy_rollback.sh infra/host-automation/woodpecker-approved-sha.sh infra/host-automation/ejc-deploy-approved.sh infra/host-automation/install.sh infra/host-automation/install-ejc-deploy.sh infra/host-automation/tests/test_gate.sh infra/selfhosted/bootstrap.sh
          python -m py_compile scripts/check_migration_compatibility.py
      - name: Backup wrapper
        run: bash scripts/tests/test_backup_wrapper.sh
      - name: Deploy rollback
        run: bash scripts/tests/test_deploy_rollback.sh
      - name: Gate do host
        run: bash infra/host-automation/tests/test_gate.sh

  security-sast:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'diag/woodpecker-failure-1556'
    name: diag / semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Semgrep 1.176.0
        run: docker run --rm --entrypoint sh -v "$PWD:/src" -w /src semgrep/semgrep:1.176.0 -c 'semgrep scan --config=auto --error .'

  security-vulnerabilities:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'diag/woodpecker-failure-1556'
    name: diag / trivy-vuln
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerabilities
        run: docker run --rm --entrypoint sh -v "$PWD:/src" -w /src aquasec/trivy:0.74.0 -c 'trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .'

  security-misconfig-audit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'diag/woodpecker-failure-1556'
    name: diag / trivy-misconfig
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Trivy misconfig (não bloqueante, como Woodpecker)
        run: docker run --rm --entrypoint sh -v "$PWD:/src" -w /src aquasec/trivy:0.74.0 -c 'trivy fs --scanners misconfig --severity HIGH,CRITICAL --exit-code 0 .'

  security-secrets:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'diag/woodpecker-failure-1556'
    name: diag / gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm --entrypoint sh -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.1 -c 'gitleaks git . --redact --verbose --exit-code 1'
