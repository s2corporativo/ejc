name: Centralize Brand Logo Temp

on:
  push:
    branches:
      - refactor/ejc-premium-gold-graphite-20260805

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/ejc-premium-gold-graphite-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Centralizar caminho da logomarca
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              "frontend/src/components/Layout.tsx": [
                  (
                      'import api, { logout } from "../lib/api";\n\n// Logomarca HD com fundo transparente (nunca a versão JPG com fundo)\nconst BRAND_LOGO = "/brand/logo-hd.png";\n',
                      'import api, { logout } from "../lib/api";\nimport { officeBranding } from "../config/officeBranding";\n',
                  ),
                  ('src={BRAND_LOGO}', 'src={officeBranding.logoPath}'),
              ],
              "frontend/src/pages/LoginModern.tsx": [
                  (
                      'import { canRoleAccessPath } from "../config/moduleRegistry";\n\n// Logomarca HD com fundo transparente (nunca a versão JPG com fundo)\nconst BRAND_LOGO = "/brand/logo-hd.png";\n',
                      'import { canRoleAccessPath } from "../config/moduleRegistry";\nimport { officeBranding } from "../config/officeBranding";\n',
                  ),
                  ('src={BRAND_LOGO}', 'src={officeBranding.logoPath}'),
              ],
              "frontend/src/components/PortalLayout.tsx": [
                  (
                      'import { useAuth } from "../stores/auth";\n\n// Logomarca HD com fundo transparente (nunca a versão JPG com fundo)\nconst BRAND_LOGO = "/brand/logo-hd.png";\n',
                      'import { useAuth } from "../stores/auth";\nimport { officeBranding } from "../config/officeBranding";\n',
                  ),
                  ('src={BRAND_LOGO}', 'src={officeBranding.logoPath}'),
              ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"marcador não encontrado em {filename}: {old[:80]!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

          cd frontend
          npx prettier --write \
            src/components/Layout.tsx \
            src/components/PortalLayout.tsx \
            src/pages/LoginModern.tsx

      - name: Validar alterações
        working-directory: frontend
        run: |
          npm run lint
          npm run lint:eslint

      - name: Commit da centralização
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            frontend/src/components/Layout.tsx \
            frontend/src/components/PortalLayout.tsx \
            frontend/src/pages/LoginModern.tsx
          git commit -m "fix(frontend): usa logo configuravel em todos os shells"
          git push origin HEAD:refactor/ejc-premium-gold-graphite-20260805
