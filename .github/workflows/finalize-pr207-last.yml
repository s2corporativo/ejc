name: Finalize PR 207 Last Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.number == 207
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-rbac-pii-p0
      - name: Normalize nullable document input and self-remove
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/routers/search.py")
          text = path.read_text(encoding="utf-8")
          old = "digitos = normalizar_documento(q)"
          new = "digitos = normalizar_documento(q) or \"\""
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit("search normalization marker not found")
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/diagnose-pr207-db-final.yml
          rm -f .github/workflows/finalize-pr207-last.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(search): trata entrada documental não numérica como vazia"
          git push origin HEAD:fix/security-rbac-pii-p0
