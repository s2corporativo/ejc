name: Architecture Refactor — Wave 2 Processes

on:
  push:
    branches:
      - agent/ejc-refatoracao-processos
    paths:
      - "scripts/apply_architecture_refactor_wave2_processes.py"
      - ".github/workflows/architecture-refactor-wave2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: architecture-refactor-wave2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply Case and Process separation
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply deterministic codemod
        run: python3 scripts/apply_architecture_refactor_wave2_processes.py

      - name: Validate generated Python syntax
        run: |
          python3 -m py_compile \
            backend/app/schemas/process.py \
            backend/app/repositories/process_repository.py \
            backend/app/services/processo_service.py \
            backend/app/routers/processes.py \
            backend/tests/test_process_contracts.py

      - name: Validate patch
        id: patch
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --check
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit applied refactor
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "EJC Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "refactor(processos): separar router, serviço e repositório"
          git push origin HEAD:${GITHUB_REF_NAME}
