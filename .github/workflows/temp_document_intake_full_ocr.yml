name: Temporary document intake full OCR patch

on:
  pull_request:
    branches:
      - fix/document-intake-full-ocr-20260720

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Aplicar correção e teste de regressão
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          documents = Path('backend/app/routers/documents.py')
          text = documents.read_text(encoding='utf-8')
          old = '''                texto_documento=ocr_text[:4000],\n                scope_client_id=(caso.client_id if caso else None),  # A2: RAG restrito ao cliente\n'''
          new = '''                # O serviço monta o dossiê jurídico e sanitiza a PII; o chamador\n                # deve transmitir o OCR integral, sem perder meio ou final.\n                texto_documento=ocr_text,\n                scope_client_id=(caso.client_id if caso else None),  # A2: RAG restrito ao cliente\n'''
          if old not in text:
              raise SystemExit('âncora do corte de 4.000 caracteres não encontrada')
          documents.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('backend/tests/test_documents_full_ocr_hook.py')
          test_path.write_text('''from types import SimpleNamespace\n\nimport pytest\n\nfrom app.core import database\nfrom app.models import ai_log\nfrom app.routers import documents\nfrom app.services import analise_estrategica\n\n\nclass _Result:\n    def fetchone(self):\n        return SimpleNamespace(\n            titulo="Caso de teste",\n            area="civel",\n            numero_processo="",\n            client_id="cliente-1",\n        )\n\n\nclass _FakeSession:\n    def __init__(self):\n        self.added = []\n\n    async def __aenter__(self):\n        return self\n\n    async def __aexit__(self, exc_type, exc, tb):\n        return False\n\n    async def execute(self, *_args, **_kwargs):\n        return _Result()\n\n    def add(self, value):\n        self.added.append(value)\n\n    async def commit(self):\n        return None\n\n\n@pytest.mark.asyncio\nasync def test_hook_de_upload_envia_ocr_integral_para_analise(monkeypatch):\n    capturado = {}\n\n    async def _analisar_caso(**kwargs):\n        capturado.update(kwargs)\n        return {"sumario_fatos": "minuta"}\n\n    monkeypatch.setattr(database, "AsyncSessionLocal", lambda: _FakeSession())\n    monkeypatch.setattr(analise_estrategica, "analisar_caso", _analisar_caso)\n    monkeypatch.setattr(ai_log, "AILog", lambda **kwargs: kwargs)\n\n    ocr_longo = (\n        "INICIO DOS FATOS\\n"\n        + "A" * 7000\n        + "\\nPEDIDOS E PROVAS NO MEIO\\n"\n        + "B" * 7000\n        + "\\nFINAL COM PRAZO E DOCUMENTOS FALTANTES"\n    )\n\n    await documents._analisar_doc_bg(\n        case_id="caso-1",\n        ocr_text=ocr_longo,\n        doc_id="doc-1",\n        user_id="usuario-1",\n    )\n\n    assert capturado["texto_documento"] == ocr_longo\n    assert len(capturado["texto_documento"]) > 14_000\n    assert "PEDIDOS E PROVAS NO MEIO" in capturado["texto_documento"]\n    assert capturado["case_id"] == "caso-1"\n    assert capturado["scope_client_id"] == "cliente-1"\n''', encoding='utf-8')

          for transient in (
              Path('.github/workflows/temp_document_intake_full_ocr.yml'),
              Path('.tmp-trigger-document-intake-full-ocr'),
          ):
              if transient.exists():
                  transient.unlink()
          PY

      - name: Commitar patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(intake): enviar OCR integral à análise estratégica"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
