name: Temporary Format Sala Analise

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate-v2:
    runs-on: [self-hosted, ejc-vps]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sala-analise-juridica-v2
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar módulo independente
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/sala-analise-juridica
          git show origin/feat/sala-analise-juridica:frontend/src/pages/SalaAnaliseJuridica.tsx > frontend/src/pages/SalaAnaliseJuridica.tsx
          git show origin/feat/sala-analise-juridica:scripts/integrate_sala_v2.py | python -
          rm -f .github/workflows/tmp-integrate-sala-v2.yml
          cd frontend
          npm ci
          npx prettier --write src/pages/SalaAnaliseJuridica.tsx src/config/moduleRegistry.tsx src/config/moduleRegistry.test.ts
      - name: Validar build
        id: build
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../sala-build.log
      - name: Publicar diagnóstico do build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sala-build-diagnostico
          path: sala-build.log
          if-no-files-found: warn
          retention-days: 2
      - name: Persistir integração na branch v2
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EJC Automation'
          git config user.email 'actions@ejc.local'
          git add frontend/src/pages/SalaAnaliseJuridica.tsx frontend/src/config/moduleRegistry.tsx frontend/src/config/moduleRegistry.test.ts .github/workflows/tmp-integrate-sala-v2.yml
          if git diff --cached --quiet; then
            echo 'Integração já aplicada'
            exit 0
          fi
          git commit -m 'feat: adicionar Sala de Análise Jurídica como módulo independente'
          git push origin HEAD:feat/sala-analise-juridica-v2
