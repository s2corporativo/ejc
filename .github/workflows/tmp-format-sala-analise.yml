name: Temporary Format Sala Analise

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: [self-hosted, ejc-vps]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Formatar arquivo
        working-directory: frontend
        run: npx prettier --write src/pages/SalaAnaliseJuridica.tsx
      - name: Publicar arquivo formatado
        uses: actions/upload-artifact@v7
        with:
          name: sala-analise-formatada
          path: frontend/src/pages/SalaAnaliseJuridica.tsx
          retention-days: 1
