name: One-shot Verdelimp data recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verdelimp-data-recovery-20260821.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: one-shot-verdelimp-data-recovery-20260821
  cancel-in-progress: false

jobs:
  recover:
    name: Recuperar cadastros Verdelimp pelo backup pré-deploy
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 45
    env:
      APP_DIR: /opt/verdelimp-erp
      SNAPSHOT_DB: /opt/backups/verdelimp/verdelimp_2026-08-21_02-35-49.sql.gz
      SNAPSHOT_UPLOADS: /opt/backups/verdelimp/uploads_2026-08-21_02-35-49.tar.gz
      SNAPSHOT_MANIFEST: /opt/backups/verdelimp/manifest_2026-08-21_02-35-49.sha256
      RECOVERY_MARKER: /opt/verdelimp-erp/.data-recovery-20260821.done

    steps:
      - name: Pré-voo e backup integral do estado atual
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n true
          sudo test -d "$APP_DIR/.git"
          sudo test -f "$SNAPSHOT_DB"
          sudo test -f "$SNAPSHOT_UPLOADS"
          sudo test -f "$SNAPSHOT_MANIFEST"

          if sudo test -f "$RECOVERY_MARKER"; then
            echo "::error::A recuperação one-shot já foi executada."
            sudo cat "$RECOVERY_MARKER" || true
            exit 1
          fi

          sudo -n env APP_DIR="$APP_DIR" bash <<'ROOT'
          set -Eeuo pipefail
          cd "$APP_DIR"
          sha256sum -c /opt/backups/verdelimp/manifest_2026-08-21_02-35-49.sha256
          gzip -t /opt/backups/verdelimp/verdelimp_2026-08-21_02-35-49.sql.gz
          tar -tzf /opt/backups/verdelimp/uploads_2026-08-21_02-35-49.tar.gz >/dev/null
          echo "Criando backup integral do estado atual antes da recuperação..."
          APP_DIR="$APP_DIR" bash deploy/contabo/backup.sh "$APP_DIR"
          ROOT

      - name: Comparar identidades do snapshot com o banco atual
        id: compare
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n env RUN_ID="$GITHUB_RUN_ID" APP_DIR="$APP_DIR" bash <<'ROOT'
          set -Eeuo pipefail
          cd "$APP_DIR"
          DB_USER="$(docker compose exec -T db printenv POSTGRES_USER | tr -d '\r')"
          DB_NAME="$(docker compose exec -T db printenv POSTGRES_DB | tr -d '\r')"
          TEST_DB="verdelimp_recovery_probe_${RUN_ID}"
          REPORT="/tmp/verdelimp-recovery-${RUN_ID}.txt"
          DEFICITS="/tmp/verdelimp-recovery-tables-${RUN_ID}.txt"
          UNSAFE="/tmp/verdelimp-recovery-unsafe-${RUN_ID}.txt"
          WORK="$(mktemp -d)"

          cleanup() {
            set +e
            rm -rf "$WORK"
            docker compose exec -T db dropdb --if-exists -U "$DB_USER" "$TEST_DB" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose exec -T db dropdb --if-exists -U "$DB_USER" "$TEST_DB" >/dev/null 2>&1 || true
          docker compose exec -T db createdb -U "$DB_USER" "$TEST_DB"
          gunzip -c /opt/backups/verdelimp/verdelimp_2026-08-21_02-35-49.sql.gz \
            | docker compose exec -T db psql -v ON_ERROR_STOP=1 -U "$DB_USER" "$TEST_DB" >/dev/null

          identity_columns() {
            local db="$1" table="$2"
            docker compose exec -T db psql -At -U "$DB_USER" "$db" -v tbl="$table" <<'SQL' | tr -d '\r'
          SELECT string_agg(format('%I', a.attname), ',' ORDER BY u.ord)
          FROM pg_index i
          JOIN LATERAL unnest(i.indkey) WITH ORDINALITY AS u(attnum, ord) ON true
          JOIN pg_attribute a ON a.attrelid = i.indrelid AND a.attnum = u.attnum
          WHERE i.indrelid = to_regclass(format('public.%I', :'tbl'))
            AND i.indisunique
            AND i.indpred IS NULL
            AND i.indexprs IS NULL
            AND i.indisvalid
          GROUP BY i.indexrelid, i.indisprimary
          ORDER BY i.indisprimary DESC, i.indexrelid
          LIMIT 1;
          SQL
          }

          table_exists() {
            local db="$1" table="$2"
            docker compose exec -T db psql -At -U "$DB_USER" "$db" -v tbl="$table" <<'SQL' | tr -d '\r'
          SELECT CASE WHEN to_regclass(format('public.%I', :'tbl')) IS NULL THEN 0 ELSE 1 END;
          SQL
          }

          row_count() {
            local db="$1" table="$2"
            docker compose exec -T db psql -At -U "$DB_USER" "$db" -v tbl="$table" <<'SQL' | tr -d '\r'
          SELECT count(*) FROM public.:"tbl";
          SQL
          }

          export_keys() {
            local db="$1" table="$2" cols="$3" out="$4"
            docker compose exec -T db psql -At -U "$DB_USER" "$db" -v tbl="$table" -v cols="$cols" <<'SQL' \
              | tr -d '\r' | sort -u > "$out"
          SELECT jsonb_build_array(:cols)::text FROM public.:"tbl" ORDER BY 1;
          SQL
          }

          : > "$DEFICITS"
          : > "$UNSAFE"
          : > "$REPORT"
          echo "TABELA|BACKUP|ATUAL|CHAVES_AUSENTES" >> "$REPORT"

          TOTAL_MISSING=0
          DEFICIT_TABLES=0
          UNSAFE_TABLES=0
          TABLES="$(docker compose exec -T db psql -At -U "$DB_USER" "$TEST_DB" -c \
            "SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename;" | tr -d '\r')"

          while IFS= read -r T; do
            [ -n "$T" ] || continue
            case "$T" in
              _prisma_migrations|User|Role|UserRole|Account|Session|VerificationToken|AuditLog|LoginAttempt|PasswordResetToken)
                continue
                ;;
            esac

            B="$(row_count "$TEST_DB" "$T")"
            if [ "$(table_exists "$DB_NAME" "$T")" != "1" ]; then
              if [ "${B:-0}" -gt 0 ]; then
                echo "schema_ausente:$T" >> "$UNSAFE"
                UNSAFE_TABLES=$((UNSAFE_TABLES + 1))
                echo "$T|$B|AUSENTE|INDETERMINADO" >> "$REPORT"
              fi
              continue
            fi

            C="$(row_count "$DB_NAME" "$T")"
            SNAP_ID="$(identity_columns "$TEST_DB" "$T")"
            CUR_ID="$(identity_columns "$DB_NAME" "$T")"

            if [ "${B:-0}" -eq 0 ]; then
              echo "$T|0|$C|0" >> "$REPORT"
              continue
            fi

            if [ -z "$SNAP_ID" ] || [ -z "$CUR_ID" ]; then
              echo "sem_identidade_estavel:$T" >> "$UNSAFE"
              UNSAFE_TABLES=$((UNSAFE_TABLES + 1))
              echo "$T|$B|$C|INDETERMINADO" >> "$REPORT"
              continue
            fi

            if [ "$SNAP_ID" != "$CUR_ID" ]; then
              echo "identidade_alterada:$T" >> "$UNSAFE"
              UNSAFE_TABLES=$((UNSAFE_TABLES + 1))
              echo "$T|$B|$C|INDETERMINADO" >> "$REPORT"
              continue
            fi

            export_keys "$TEST_DB" "$T" "$SNAP_ID" "$WORK/${T}.backup.keys"
            export_keys "$DB_NAME" "$T" "$CUR_ID" "$WORK/${T}.current.keys"
            MISSING="$(comm -23 "$WORK/${T}.backup.keys" "$WORK/${T}.current.keys" | wc -l | tr -d ' ')"

            if [ "${MISSING:-0}" -gt 0 ]; then
              printf '%s\n' "$T" >> "$DEFICITS"
              TOTAL_MISSING=$((TOTAL_MISSING + MISSING))
              DEFICIT_TABLES=$((DEFICIT_TABLES + 1))
            fi
            echo "$T|$B|$C|$MISSING" >> "$REPORT"
          done <<< "$TABLES"

          echo "TOTAL_CHAVES_AUSENTES=$TOTAL_MISSING" >> "$REPORT"
          echo "TABELAS_COM_CHAVES_AUSENTES=$DEFICIT_TABLES" >> "$REPORT"
          echo "TABELAS_SEM_COMPARACAO_SEGURA=$UNSAFE_TABLES" >> "$REPORT"
          cat "$REPORT"

          install -o root -g root -m 600 "$REPORT" "/opt/backups/verdelimp/recovery_compare_${RUN_ID}.txt"
          install -o root -g root -m 600 "$DEFICITS" "/opt/backups/verdelimp/recovery_tables_${RUN_ID}.txt"
          install -o root -g root -m 600 "$UNSAFE" "/opt/backups/verdelimp/recovery_unsafe_${RUN_ID}.txt"
          printf '%s\n' "$TOTAL_MISSING" > "/tmp/verdelimp-recovery-total-${RUN_ID}.txt"

          if [ "$UNSAFE_TABLES" -gt 0 ]; then
            echo "ERRO: $UNSAFE_TABLES tabela(s) não puderam ser comparadas com identidade estável; recuperação automática interrompida." >&2
            cat "$UNSAFE" >&2
            exit 1
          fi
          ROOT

          TOTAL="$(sudo cat "/tmp/verdelimp-recovery-total-${GITHUB_RUN_ID}.txt")"
          echo "total_deficit=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Chaves do snapshot ausentes no banco atual: $TOTAL"

      - name: Reintegrar somente linhas ausentes do snapshot
        id: restore
        if: ${{ steps.compare.outputs.total_deficit != '0' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n env RUN_ID="$GITHUB_RUN_ID" APP_DIR="$APP_DIR" bash <<'ROOT'
          set -Eeuo pipefail
          cd "$APP_DIR"
          DB_USER="$(docker compose exec -T db printenv POSTGRES_USER | tr -d '\r')"
          DB_NAME="$(docker compose exec -T db printenv POSTGRES_DB | tr -d '\r')"
          TEST_DB="verdelimp_recovery_merge_${RUN_ID}"
          TABLE_FILE="/opt/backups/verdelimp/recovery_tables_${RUN_ID}.txt"
          WORK="$(mktemp -d)"
          APP_STOPPED=false

          cleanup() {
            set +e
            rm -rf "$WORK"
            docker compose exec -T db dropdb --if-exists -U "$DB_USER" "$TEST_DB" >/dev/null 2>&1 || true
            if [ "$APP_STOPPED" = "true" ]; then docker compose start app >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT

          identity_columns() {
            local db="$1" table="$2"
            docker compose exec -T db psql -At -U "$DB_USER" "$db" -v tbl="$table" <<'SQL' | tr -d '\r'
          SELECT string_agg(format('%I', a.attname), ',' ORDER BY u.ord)
          FROM pg_index i
          JOIN LATERAL unnest(i.indkey) WITH ORDINALITY AS u(attnum, ord) ON true
          JOIN pg_attribute a ON a.attrelid = i.indrelid AND a.attnum = u.attnum
          WHERE i.indrelid = to_regclass(format('public.%I', :'tbl'))
            AND i.indisunique
            AND i.indpred IS NULL
            AND i.indexprs IS NULL
            AND i.indisvalid
          GROUP BY i.indexrelid, i.indisprimary
          ORDER BY i.indisprimary DESC, i.indexrelid
          LIMIT 1;
          SQL
          }

          export_keys() {
            local db="$1" table="$2" cols="$3" out="$4"
            docker compose exec -T db psql -At -U "$DB_USER" "$db" -v tbl="$table" -v cols="$cols" <<'SQL' \
              | tr -d '\r' | sort -u > "$out"
          SELECT jsonb_build_array(:cols)::text FROM public.:"tbl" ORDER BY 1;
          SQL
          }

          docker compose exec -T db dropdb --if-exists -U "$DB_USER" "$TEST_DB" >/dev/null 2>&1 || true
          docker compose exec -T db createdb -U "$DB_USER" "$TEST_DB"
          gunzip -c /opt/backups/verdelimp/verdelimp_2026-08-21_02-35-49.sql.gz \
            | docker compose exec -T db psql -v ON_ERROR_STOP=1 -U "$DB_USER" "$TEST_DB" >/dev/null

          docker compose stop app
          APP_STOPPED=true

          PG_ARGS=(--data-only --column-inserts --on-conflict-do-nothing --disable-triggers --no-owner --no-privileges)
          while IFS= read -r T; do
            [ -n "$T" ] || continue
            PG_ARGS+=(--table="public.\"$T\"")
          done < "$TABLE_FILE"

          docker compose exec -T db pg_dump -U "$DB_USER" "${PG_ARGS[@]}" "$TEST_DB" \
            | sed '/^SELECT pg_catalog.setval/d' \
            | docker compose exec -T db psql -v ON_ERROR_STOP=1 -U "$DB_USER" "$DB_NAME"

          while IFS= read -r T; do
            [ -n "$T" ] || continue
            ID_COLS="$(identity_columns "$TEST_DB" "$T")"
            [ -n "$ID_COLS" ] || { echo "ERRO: identidade desapareceu em $T durante a verificação." >&2; exit 1; }
            export_keys "$TEST_DB" "$T" "$ID_COLS" "$WORK/${T}.backup.keys"
            export_keys "$DB_NAME" "$T" "$ID_COLS" "$WORK/${T}.current.keys"
            REMAINING="$(comm -23 "$WORK/${T}.backup.keys" "$WORK/${T}.current.keys" | wc -l | tr -d ' ')"
            if [ "$REMAINING" -ne 0 ]; then
              echo "ERRO: tabela $T ainda possui $REMAINING identidade(s) do snapshot ausentes." >&2
              exit 1
            fi
            echo "OK $T: todas as identidades do snapshot estão presentes."
          done < "$TABLE_FILE"

          docker compose start app
          APP_STOPPED=false

          BINDING="$(docker compose port app 3000 | head -n1)"
          PORT="${BINDING##*:}"
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/api/health" >/tmp/verdelimp-recovery-health.json 2>/dev/null; then
              cat /tmp/verdelimp-recovery-health.json
              break
            fi
            sleep 2
          done
          curl -fsS --max-time 10 "http://127.0.0.1:${PORT}/api/health"
          ROOT

      - name: Registrar conclusão one-shot
        id: finish
        shell: bash
        run: |
          set -Eeuo pipefail
          TOTAL="${{ steps.compare.outputs.total_deficit }}"
          RESULT="no_database_loss"
          if [ "$TOTAL" != "0" ]; then RESULT="missing_rows_reintegrated"; fi

          TMP="$(mktemp)"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "result=$RESULT"
            echo "predeploy_snapshot=verdelimp_2026-08-21_02-35-49.sql.gz"
            echo "missing_snapshot_keys_before=$TOTAL"
            echo "completed_at_utc=$(date -u '+%FT%TZ')"
          } > "$TMP"
          sudo install -o root -g root -m 600 "$TMP" "$RECOVERY_MARKER"
          rm -f "$TMP"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Registrar resultado na issue operacional
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const result = '${{ steps.finish.outputs.result }}' || 'indisponivel';
            const deficit = '${{ steps.compare.outputs.total_deficit }}' || 'indisponivel';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              outcome === 'success' ? '✅ **Recuperação de dados Verdelimp — concluída**' : '❌ **Recuperação de dados Verdelimp — falhou**',
              '',
              `- Execução: ${runUrl}`,
              `- Snapshot pré-deploy: \`verdelimp_2026-08-21_02-35-49.sql.gz\``,
              `- Identidades do snapshot ausentes antes da ação: **${deficit}**`,
              `- Resultado: \`${result}\``,
              '',
              result === 'missing_rows_reintegrated'
                ? 'Foi criado backup atual antes da operação e somente linhas ausentes do snapshot foram reintegradas; registros atuais não foram apagados nem sobrescritos.'
                : result === 'no_database_loss'
                  ? 'Todas as identidades persistidas no snapshot pré-deploy já estavam presentes no banco atual; nenhum dado foi alterado. O problema está na camada de exibição/filtros/RBAC.'
                  : 'Consulte os logs. A rotina é fail-closed e cria backup antes de qualquer reintegração.'
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 1225, body });
