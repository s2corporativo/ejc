name: Apply Security P0

on:
  push:
    branches:
      - fix/security-rbac-pii-p0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-rbac-pii-p0
      - name: Apply deterministic RBAC and ownership patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8-sig")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          # search.py: importa HTTPException para rejeitar CPF/CNPJ parcial.
          path = "backend/app/routers/search.py"
          text = read(path)
          old = "from fastapi import APIRouter, Depends, Query, Request\n"
          new = "from fastapi import APIRouter, Depends, HTTPException, Query, Request\n"
          if old not in text:
              raise SystemExit("search import marker not found")
          text = text.replace(old, new, 1)
          write(path, text)

          # clients.py: o CRM completo deixa de ser legível por qualquer perfil interno.
          path = "backend/app/routers/clients.py"
          text = read(path)
          old = '''def _req_clientes_leitura(cu: User = Depends(get_current_user)) -> User:
    """Leitura do CRM restrita à equipe interna — bloqueia cliente_externo
    (portal do cliente NÃO pode listar/consultar a carteira de clientes)."""
    if cu.role.value == "cliente_externo":
        raise HTTPException(status_code=403, detail="Sem permissão para consultar clientes")
    return cu
'''
          new = '''def _req_clientes_leitura(cu: User = Depends(get_current_user)) -> User:
    """Leitura integral do CRM limitada aos perfis definidos na matriz _CLIENTES."""
    if cu.role.value not in _CLIENTES:
        raise HTTPException(status_code=403, detail="Sem permissão para consultar clientes")
    return cu
'''
          if old not in text:
              raise SystemExit("clients read gate marker not found")
          text = text.replace(old, new, 1)
          write(path, text)

          # documents.py: ownership também para documentos sem case_id.
          path = "backend/app/routers/documents.py"
          text = read(path)
          text = text.replace(
              "from sqlalchemy import select, func as sqlfunc\n",
              "from sqlalchemy import select, func as sqlfunc, or_\n",
              1,
          )

          # Substitui gates locais antes de inserir o helper.
          text = text.replace(
              "        if d.case_id:\n            await verificar_acesso_caso(db, cu, d.case_id)\n",
              "        await _verificar_acesso_documento(db, cu, d)\n",
          )
          text = text.replace(
              "    if d.case_id:\n        await verificar_acesso_caso(db, cu, d.case_id)\n",
              "    await _verificar_acesso_documento(db, cu, d)\n",
          )

          marker = '''def _pode_acessar_confidencial(user: User, conf: str) -> bool:
    """Cofre: restrito+ exige perfil socio ou superior."""
    if conf in ("restrito", "confidencial", "segredo_justica"):
        return ROLE_LEVEL.get(user.role.value, 0) >= ROLE_LEVEL["socio"]
    return True
'''
          helpers = marker + '''

async def _verificar_acesso_cliente_sem_caso(
    db: AsyncSession,
    user: User,
    client_id: str,
) -> None:
    """Autoriza cliente avulso por gestão, titular externo ou caso atribuído."""
    if is_gestao(user):
        return
    if user.role.value == "cliente_externo":
        if getattr(user, "client_id", None) == client_id:
            return
        raise HTTPException(status_code=403, detail="Sem permissão para este cliente")
    case_id = (
        await db.execute(
            select(Case.id)
            .where(
                Case.client_id == client_id,
                Case.deleted_at.is_(None),
                or_(
                    Case.advogado_responsavel_id == user.id,
                    Case.advogado_auxiliar_id == user.id,
                ),
            )
            .limit(1)
        )
    ).scalar_one_or_none()
    if case_id is None:
        raise HTTPException(status_code=403, detail="Sem permissão para este cliente")


async def _verificar_acesso_documento(
    db: AsyncSession,
    user: User,
    document: Document,
) -> None:
    """Gate único para documento vinculado a caso, cliente ou apenas uploader."""
    if document.case_id:
        await verificar_acesso_caso(db, user, document.case_id)
        return
    if is_gestao(user) or document.uploaded_by == user.id:
        return
    if document.client_id:
        if user.role.value == "cliente_externo" and document.confidencialidade.value != "normal":
            raise HTTPException(status_code=403, detail="Documento interno ou restrito")
        await _verificar_acesso_cliente_sem_caso(db, user, document.client_id)
        return
    raise HTTPException(status_code=403, detail="Sem permissão para este documento")
'''
          if marker not in text:
              raise SystemExit("document confidentiality marker not found")
          text = text.replace(marker, helpers, 1)

          old_list = '''    # Esconder confidenciais de quem não pode ver
    if ROLE_LEVEL.get(cu.role.value, 0) < ROLE_LEVEL["socio"]:
        q = q.where(Document.confidencialidade.in_(["normal", "interno"]))
    # Ownership por caso (IDOR): não-gestão só vê docs dos seus casos
    # (responsável/auxiliar), de casos sem dono (legado/triagem) ou sem caso.
    # Espelha a semântica de core.ownership.verificar_acesso_caso.
    if not is_gestao(cu):
        casos_visiveis = select(Case.id).where(
            Case.deleted_at.is_(None),
            (
                (Case.advogado_responsavel_id == cu.id)
                | (Case.advogado_auxiliar_id == cu.id)
                | (Case.advogado_responsavel_id.is_(None) & Case.advogado_auxiliar_id.is_(None))
            ),
        )
        q = q.where(Document.case_id.is_(None) | Document.case_id.in_(casos_visiveis))
'''
          new_list = '''    # Cofre + ownership: documento sem case_id não é público para a equipe.
    if ROLE_LEVEL.get(cu.role.value, 0) < ROLE_LEVEL["socio"]:
        q = q.where(Document.confidencialidade.in_(["normal", "interno"]))
    if cu.role.value == "cliente_externo":
        if not getattr(cu, "client_id", None):
            q = q.where(Document.id.is_(None))
        else:
            q = q.where(
                Document.client_id == cu.client_id,
                Document.confidencialidade == "normal",
            )
    elif not is_gestao(cu):
        casos_visiveis = select(Case.id).where(
            Case.deleted_at.is_(None),
            or_(
                Case.advogado_responsavel_id == cu.id,
                Case.advogado_auxiliar_id == cu.id,
            ),
        )
        clientes_visiveis = select(Case.client_id).where(
            Case.deleted_at.is_(None),
            Case.client_id.is_not(None),
            or_(
                Case.advogado_responsavel_id == cu.id,
                Case.advogado_auxiliar_id == cu.id,
            ),
        )
        q = q.where(
            or_(
                Document.case_id.in_(casos_visiveis),
                (
                    Document.case_id.is_(None)
                    & Document.client_id.in_(clientes_visiveis)
                ),
                (
                    Document.case_id.is_(None)
                    & Document.client_id.is_(None)
                    & (Document.uploaded_by == cu.id)
                ),
            )
        )
'''
          if old_list not in text:
              raise SystemExit("document list ownership block not found")
          text = text.replace(old_list, new_list, 1)

          upload_marker = '''        if cli is None:
            raise HTTPException(status_code=404, detail="Cliente não encontrado")
'''
          upload_replacement = upload_marker + '''        await _verificar_acesso_cliente_sem_caso(db, cu, client_id)
'''
          if upload_marker not in text:
              raise SystemExit("document upload client marker not found")
          text = text.replace(upload_marker, upload_replacement, 1)

          old_drive = '''async def _gate_drive_doc(db: AsyncSession, cu: User, file_id: str):
    """Gate IDOR para docs do Google Drive (auditoria 2026-06-30).
    Resolve a linha em `documents` pelo drive_file_id e exige acesso ao caso
    (verificar_acesso_caso) ou, p/ doc sem caso, ser gestão ou o criador."""
    from sqlalchemy import text as sql_text
    row = (await db.execute(sql_text(
        "SELECT id, case_id, uploaded_by FROM documents "
        "WHERE drive_file_id = :fid AND deleted_at IS NULL LIMIT 1"
    ), {"fid": file_id})).mappings().first()
    if not row:
        raise HTTPException(404, "Documento não encontrado")
    if row.get("case_id"):
        await verificar_acesso_caso(db, cu, row["case_id"])
    elif not (is_gestao(cu) or row.get("uploaded_by") == cu.id):
        raise HTTPException(403, "Sem permissão para este documento")
    return row
'''
          new_drive = '''async def _gate_drive_doc(db: AsyncSession, cu: User, file_id: str):
    """Gate IDOR/LGPD para documentos do Drive, inclusive sem case_id."""
    from sqlalchemy import text as sql_text
    row = (await db.execute(sql_text(
        "SELECT id, case_id, client_id, uploaded_by, confidencialidade FROM documents "
        "WHERE drive_file_id = :fid AND deleted_at IS NULL LIMIT 1"
    ), {"fid": file_id})).mappings().first()
    if not row:
        raise HTTPException(404, "Documento não encontrado")
    if row.get("case_id"):
        await verificar_acesso_caso(db, cu, row["case_id"])
    elif is_gestao(cu) or row.get("uploaded_by") == cu.id:
        pass
    elif row.get("client_id"):
        if cu.role.value == "cliente_externo" and row.get("confidencialidade") != "normal":
            raise HTTPException(403, "Documento interno ou restrito")
        await _verificar_acesso_cliente_sem_caso(db, cu, row["client_id"])
    else:
        raise HTTPException(403, "Sem permissão para este documento")
    if not _pode_acessar_confidencial(cu, row.get("confidencialidade") or "normal"):
        raise HTTPException(403, "Documento restrito — acesso negado")
    return row
'''
          if old_drive not in text:
              raise SystemExit("drive gate block not found")
          text = text.replace(old_drive, new_drive, 1)
          write(path, text)
          PY

          rm -f .github/workflows/apply-security-p0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): restringe CRM e ownership de documentos avulsos"
          git push origin HEAD:fix/security-rbac-pii-p0
