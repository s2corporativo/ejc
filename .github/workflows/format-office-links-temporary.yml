name: Format OfficeLinks temporary

on:
  push:
    branches:
      - claude/ejc-restilizacao-v2-clean

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/ejc-restilizacao-v2-clean
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Aplicar Prettier
        working-directory: frontend
        run: npx prettier --write src/components/header/OfficeLinks.tsx
      - name: Commitar formatação
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/header/OfficeLinks.tsx
          git commit -m "style(ui): aplicar Prettier em OfficeLinks [skip ci]"
          git push origin HEAD:claude/ejc-restilizacao-v2-clean
