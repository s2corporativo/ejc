name: Temporary Format PR 899

on:
  push:
    branches:
      - refactor/saas-ultra-dashboard-20260808

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/saas-ultra-dashboard-20260808
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Aplicar Prettier somente nos arquivos novos
        working-directory: frontend
        run: npx prettier --write src/pages/DashboardUltra.tsx src/styles/saas-ultra-v2.css

      - name: Remover workflow temporário e gravar resultado
        run: |
          rm -f .github/workflows/tmp-format-pr899.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/DashboardUltra.tsx frontend/src/styles/saas-ultra-v2.css
          git add -u .github/workflows/tmp-format-pr899.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de formatação necessária."
            exit 0
          fi
          git commit -m "style(frontend): aplicar prettier no dashboard ultra"
          git push origin HEAD:refactor/saas-ultra-dashboard-20260808
