# ── EJC — garantia operacional do backup diário no Google Drive ───────────────
#
# Usa o runner self-hosted da própria VPS. Em PR, apenas valida. Após merge na
# main, instala os wrappers revisados em /opt/ejc e exige prova integral cifrada.
# Nenhum segredo é transferido: o serviço usa o ambiente já protegido da VPS.
name: Backup Google Drive — ativar e comprovar

on:
  pull_request:
    paths:
      - "scripts/backup.sh"
      - "scripts/backup/ativar_backup.sh"
      - "scripts/deploy_vps_safe.sh"
      - "scripts/check_migration_compatibility.py"
      - "scripts/tests/test_backup_wrapper.sh"
      - "scripts/tests/test_deploy_rollback.sh"
      - ".github/workflows/backup-gdrive-activation.yml"
      - ".github/workflows/deploy-vps.yml"
  push:
    branches: [main]
    paths:
      - "scripts/backup.sh"
      - "scripts/backup/ativar_backup.sh"
      - "scripts/deploy_vps_safe.sh"
      - "scripts/check_migration_compatibility.py"
      - "scripts/tests/test_backup_wrapper.sh"
      - "scripts/tests/test_deploy_rollback.sh"
      - ".github/workflows/backup-gdrive-activation.yml"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-gdrive-${{ github.ref }}
  # Atualizações do mesmo PR tornam a validação anterior obsoleta. Já uma prova
  # de produção na main nunca é cancelada no meio do backup/upload.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validar:
    name: Validar scripts de backup
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sintaxe e compilação
        run: |
          bash -n \
            scripts/backup.sh \
            scripts/backup/ativar_backup.sh \
            scripts/deploy_vps_safe.sh \
            scripts/tests/test_backup_wrapper.sh \
            scripts/tests/test_deploy_rollback.sh
          python3 -m py_compile scripts/check_migration_compatibility.py

      - name: Provar wrapper cifrado
        run: bash scripts/tests/test_backup_wrapper.sh

      - name: Provar rollback seguro
        run: bash scripts/tests/test_deploy_rollback.sh

  ativar-producao:
    name: Ativar e comprovar no VPS
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validar
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar instalação EJC
        run: |
          test -d /opt/ejc
          test -f /opt/ejc/.env
          docker ps --format '{{.Names}}' | grep -qx ejc_db
          cd /opt/ejc
          docker compose config >/dev/null

      - name: Instalar wrappers revisados
        run: |
          sudo install -d -m 755 /opt/ejc/scripts/backup
          # Scripts não contêm segredos; 755 permite que o runner não-root execute
          # a ativação instalada, enquanto o .env continua protegido e excluído.
          sudo install -m 755 scripts/backup.sh /opt/ejc/scripts/backup.sh
          sudo install -m 755 \
            scripts/backup/ativar_backup.sh \
            /opt/ejc/scripts/backup/ativar_backup.sh

      - name: Ativar e executar prova integral cifrada
        run: |
          cd /opt/ejc
          FORCE_BACKUP_TEST=1 bash scripts/backup/ativar_backup.sh

      - name: Confirmar aplicação saudável
        run: |
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          curl -fsS -o /dev/null -w "EJC público /api/health → HTTP %{http_code}\n" \
            https://ejc.depaulateixeira.adv.br/api/health
