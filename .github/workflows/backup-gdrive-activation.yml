# EJC — validação e prova manual do backup diário cifrado no Google Drive.
#
# Em Pull Request, executa somente testes determinísticos offline (validação de
# sintaxe, wrapper cifrado e migração/rollback) em executor não produtivo
# runner self-hosted `ejc-vps` (cota gratuita — decisao do titular 15/08/2026);
# o job de PR nao usa `environment: production`.
# A prova integral cifrada contra o Google Drive só ocorre por execução manual
# na main (job `comprovar-producao`).
name: Backup Google Drive — validar e comprovar

on:
  pull_request:
    paths:
      - "scripts/backup.sh"
      - "scripts/backup/ativar_backup.sh"
      - "scripts/deploy_vps_safe.sh"
      - "scripts/check_migration_compatibility.py"
      - "scripts/tests/test_backup_wrapper.sh"
      - "scripts/tests/test_deploy_rollback.sh"
      - "backend/tests/test_migration_compatibility_gate.py"
      - ".github/workflows/backup-gdrive-activation.yml"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-gdrive-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validar:
    name: Validar backup, migration e rollback
    # Nunca executar conteúdo de PR no host que também hospeda produção.
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Sintaxe e compilação
        run: |
          bash -n \
            scripts/backup.sh \
            scripts/backup/ativar_backup.sh \
            scripts/deploy_vps_safe.sh \
            scripts/tests/test_backup_wrapper.sh \
            scripts/tests/test_deploy_rollback.sh
          python3 -m py_compile scripts/check_migration_compatibility.py

      - name: Provar wrapper cifrado
        run: bash scripts/tests/test_backup_wrapper.sh

      - name: Provar migration anterior à troca e rollback
        run: bash scripts/tests/test_deploy_rollback.sh

  comprovar-producao:
    name: Executar prova integral cifrada na VPS
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    needs: validar
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Validar instalação EJC
        run: |
          test -d /opt/ejc
          test -f /opt/ejc/.env
          docker ps --format '{{.Names}}' | grep -qx ejc_db
          cd /opt/ejc
          docker compose config --quiet

      - name: Instalar wrappers revisados
        run: |
          sudo install -d -m 755 /opt/ejc/scripts/backup
          sudo install -m 755 scripts/backup.sh /opt/ejc/scripts/backup.sh
          sudo install -m 755 \
            scripts/backup/ativar_backup.sh \
            /opt/ejc/scripts/backup/ativar_backup.sh

      - name: Ativar e executar prova integral cifrada
        run: |
          cd /opt/ejc
          FORCE_BACKUP_TEST=1 bash scripts/backup/ativar_backup.sh

      - name: Confirmar aplicação saudável
        run: |
          curl -fsS http://127.0.0.1:8000/api/health >/dev/null
          curl -fsS -o /dev/null -w \
            "EJC público /api/health → HTTP %{http_code}\n" \
            https://ejc.depaulateixeira.adv.br/api/health
