name: Temporary formatter — stabilization branch

on:
  pull_request:
    branches:
      - fix/estabilizacao-ejc-10-10-20260720

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Aplicar Prettier nos arquivos apontados pelo CI
        working-directory: frontend
        run: npx prettier --write src/App.tsx src/pages/PainelProvedoresIA.tsx
      - name: Remover gatilho temporário
        run: rm -f scripts/.format-trigger
      - name: Commitar formatação, quando necessária
        run: |
          if git diff --quiet -- frontend/src/App.tsx frontend/src/pages/PainelProvedoresIA.tsx scripts/.format-trigger; then
            echo "Nenhuma alteração de formatação necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/pages/PainelProvedoresIA.tsx scripts/.format-trigger
          git commit -m "style(frontend): aplicar Prettier nos arquivos bloqueantes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
