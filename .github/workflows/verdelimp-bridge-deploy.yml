# Operação temporária vinculada à issue #1225; remover após a publicação.
name: One-shot Verdelimp bridge deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: one-shot-verdelimp-bridge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar Verdelimp pela VPS compartilhada
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, ejc-vps]
    timeout-minutes: 45
    env:
      VERDELIMP_APP_DIR: /opt/verdelimp-erp
      ONE_SHOT_MARKER: /opt/verdelimp-erp/.bridge-deploy-20260820.done
    steps:
      - name: Verificar se o one-shot já foi consumido
        id: one_shot
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n true
          if sudo -n test -f "$ONE_SHOT_MARKER"; then
            echo "consumed=true" >> "$GITHUB_OUTPUT"
            echo "Bridge já consumido anteriormente; execução encerrada como no-op seguro."
          else
            echo "consumed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Registrar início no runner da VPS
        if: steps.one_shot.outputs.consumed != 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1225,
                body: [
                  '▶️ **Bridge Verdelimp iniciado no runner `ejc-vps`**',
                  '',
                  `- Execução: ${runUrl}`,
                  `- CI da main que liberou o bridge: \`${context.payload.workflow_run?.head_sha || 'indisponível'}\``,
                  '- O próximo passo é o pré-voo fail-closed dentro da VPS.'
                ].join('\n'),
              });
            } catch (error) {
              core.warning(`Falha não bloqueante ao registrar início na issue #1225: ${error?.message || error}`);
            }

      - name: Pré-voo fail-closed
        if: steps.one_shot.outputs.consumed != 'true'
        id: preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="$VERDELIMP_APP_DIR"
          sudo -n true
          sudo test -d "$APP/.git"
          sudo test -f "$APP/.env.production"
          sudo test -f "$APP/.env.ops"

          ORIGIN="$(sudo git -C "$APP" remote get-url origin)"
          case "$ORIGIN" in
            "https://github.com/s2corporativo/verdelimpclaude"|\
            "https://github.com/s2corporativo/verdelimpclaude.git"|\
            "git@github.com:s2corporativo/verdelimpclaude.git"|\
            "ssh://git@github.com/s2corporativo/verdelimpclaude.git") ;;
            *) echo "::error::Origin não autorizado em $APP; recusando executar código como root."; exit 1 ;;
          esac

          LOCAL_STATUS="$(sudo git -C "$APP" status --porcelain)"
          if [ -n "$LOCAL_STATUS" ]; then
            echo "::error::Há alterações locais em $APP; deploy interrompido para preservar a VPS."
            printf '%s\n' "$LOCAL_STATUS"
            exit 1
          fi

          BEFORE_SHA="$(sudo git -C "$APP" rev-parse HEAD)"
          echo "before_sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "Pré-voo aprovado. SHA atual: $BEFORE_SHA"

      - name: Executar deploy seguro oficial do Verdelimp
        if: steps.one_shot.outputs.consumed != 'true'
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n bash -lc '
            set -Eeuo pipefail
            cd /opt/verdelimp-erp
            APP_DIR=/opt/verdelimp-erp BRANCH=main bash deploy/contabo/deploy.sh
          '

      - name: Consumir autorização one-shot após deploy local comprovado
        if: steps.one_shot.outputs.consumed != 'true'
        id: consume
        shell: bash
        run: |
          set -Eeuo pipefail
          APP="$VERDELIMP_APP_DIR"
          AFTER_SHA="$(sudo git -C "$APP" rev-parse HEAD)"
          TMP="$(mktemp)"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "deployed_sha=$AFTER_SHA"
            echo "consumed_at_utc=$(date -u '+%FT%TZ')"
          } > "$TMP"
          sudo install -o root -g root -m 600 "$TMP" "$ONE_SHOT_MARKER"
          rm -f "$TMP"
          echo "after_sha=$AFTER_SHA" >> "$GITHUB_OUTPUT"
          echo "Autorização one-shot consumida para SHA $AFTER_SHA."

      - name: Coletar prova local e exigir endpoint público saudável
        if: steps.one_shot.outputs.consumed != 'true'
        id: proof
        shell: bash
        run: |
          set -Eeuo pipefail
          AFTER_SHA="${{ steps.consume.outputs.after_sha }}"

          echo "### Prova pós-deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA anterior: \`${{ steps.preflight.outputs.before_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA publicado: \`$AFTER_SHA\`" >> "$GITHUB_STEP_SUMMARY"

          sudo -n bash -lc '
            set -Eeuo pipefail
            cd /opt/verdelimp-erp
            BINDING="$(docker compose port app 3000 | head -n1)"
            PORT="${BINDING##*:}"
            echo "Health local:"
            curl -fsS --max-time 15 "http://127.0.0.1:${PORT}/api/health"
            echo
            echo "Containers:"
            docker compose ps
          '

          echo "Endpoints públicos conhecidos:" | tee -a "$GITHUB_STEP_SUMMARY"
          PUBLIC_OK=0
          set +e
          for URL in \
            "https://verdelimp.s2corporativo.com.br/api/health" \
            "https://erp.13.140.167.153.sslip.io/api/health" \
            "https://erp.verdelimp.com.br/api/health"
          do
            CODE="$(curl -sS -o /tmp/verdelimp-public-health -w '%{http_code}' --max-time 15 "$URL")"
            RC=$?
            if [ "$RC" -eq 0 ] && [ "$CODE" = "200" ]; then
              PUBLIC_OK=$((PUBLIC_OK + 1))
              echo "- $URL -> HTTP 200" | tee -a "$GITHUB_STEP_SUMMARY"
              cat /tmp/verdelimp-public-health
              echo
            else
              echo "- $URL -> indisponível (curl=$RC, http=${CODE:-000})" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          set -e

          if [ "$PUBLIC_OK" -lt 1 ]; then
            echo "::error::Deploy local concluiu, mas nenhum endpoint público aceito respondeu HTTP 200. A autorização one-shot já foi consumida para impedir novo deploy acidental."
            exit 1
          fi
          echo "public_ok=$PUBLIC_OK" >> "$GITHUB_OUTPUT"

      - name: Registrar resultado na issue operacional
        if: always() && steps.one_shot.outputs.consumed != 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const outcome = '${{ job.status }}';
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const icon = outcome === 'success' ? '✅' : '❌';
              const before = '${{ steps.preflight.outputs.before_sha }}' || 'indisponível';
              const after = '${{ steps.consume.outputs.after_sha }}' || 'indisponível';
              const body = [
                `${icon} **Bridge Verdelimp — ${outcome}**`,
                '',
                `- Execução: ${runUrl}`,
                `- SHA antes: \`${before}\``,
                `- SHA depois: \`${after}\``,
                `- Runner: \`ejc-vps\``,
                '',
                outcome === 'success'
                  ? 'O deploy seguro do Verdelimp concluiu na VPS e ao menos um endpoint público respondeu HTTP 200.'
                  : 'A operação foi interrompida fail-closed. Se o deploy local já concluiu, a autorização one-shot permanece consumida para impedir repetição acidental.'
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1225,
                body,
              });
            } catch (error) {
              core.warning(`Falha não bloqueante ao registrar resultado na issue #1225: ${error?.message || error}`);
            }
