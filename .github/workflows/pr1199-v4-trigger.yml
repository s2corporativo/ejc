name: PR1199 v4 trigger

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/1199-client-document-isolation-v4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/1199-client-document-isolation-v4
          fetch-depth: 0
      - name: Executar script one-shot versionado
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/pr1199-v4-one-shot.yml')
          raw = path.read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Commit e push do patch"
          if marker not in raw or end_marker not in raw:
              raise SystemExit('bloco Python do one-shot não encontrado')
          block = raw.split(marker, 1)[1].split(end_marker, 1)[0]
          linhas = []
          for line in block.splitlines():
              if line.startswith('          '):
                  linhas.append(line[10:])
              else:
                  linhas.append(line)
          script = '\n'.join(linhas) + '\n'
          exec(compile(script, 'pr1199-v4-patch.py', 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/pr1199-v4-trigger.yml').unlink(missing_ok=True)
          PY
      - name: Commit e push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "s2corporativo"
          git config user.email "258954056+s2corporativo@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(clients): isolamento cliente-documento v4"
          git push origin HEAD:fix/1199-client-document-isolation-v4
