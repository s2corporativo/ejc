name: PR1199 v4 trigger

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/1199-client-document-isolation-v4'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/1199-client-document-isolation-v4
          fetch-depth: 0
      - name: Aplicar patch fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pr1199_v4_runner.py
      - name: Commit e push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "s2corporativo"
          git config user.email "258954056+s2corporativo@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(clients): isolamento cliente-documento v4"
          git push origin HEAD:fix/1199-client-document-isolation-v4
