# Dependabot — atualizações de segurança/versão automáticas por ecossistema.
# Abre PRs semanais; a CI (.github/workflows/ci.yml) valida cada um antes do merge.
version: 2
updates:
  # Backend Python (requirements.txt em backend/).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"

  # Frontend Node (package.json/package-lock.json em frontend/).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"

  # Actions usadas nos workflows (.github/workflows/*).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
